name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: "Check + Clippy + Fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            baoclaw-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('baoclaw-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check --manifest-path baoclaw-core/Cargo.toml

      - name: Cargo fmt
        run: cargo fmt --manifest-path baoclaw-core/Cargo.toml -- --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path baoclaw-core/Cargo.toml -- -D warnings

  test:
    name: "Test"
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            baoclaw-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('baoclaw-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo test
        run: cargo test --manifest-path baoclaw-core/Cargo.toml -- --test-threads=2
