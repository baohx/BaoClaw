\n    pub error: JsonRpcError,\n    pub id: Option&lt;RequestId&gt;,     // 可能为 None（解析错误）\n}\n\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcError {\n    pub code: i32,\n    pub message: String,\n    #[serde(skip_serializing_if = &quot;Option::is_none&quot;)]\n    pub data: Option&lt;Value&gt;,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-9","language":"rust","code":"// 请求 ID - 支持数字或字符串\n#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]\n#[serde(untagged)]\npub enum RequestId {\n    Number(i64),\n    String(String),\n}\n\n// JSON-RPC 2.0 请求\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcRequest {\n    pub jsonrpc: String,           // \"2.0\"\n    pub method: String,            // RPC 方法名\n    #[serde(default)]\n    pub params: Value,             // 参数（可选）\n    pub id: RequestId,             // 请求 ID\n}\n\n// JSON-RPC 2.0 成功响应\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcResponse {\n    pub jsonrpc: String,\n    pub result: Value,             // 结果\n    pub id: RequestId,\n}\n\n// JSON-RPC 2.0 错误响应\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcErrorResponse {\n    pub jsonrpc: String,\n    pub error: JsonRpcError,\n    pub id: Option<RequestId>,     // 可能为 None（解析错误）\n}\n\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcError {\n    pub code: i32,\n    pub message: String,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub data: Option<Value>,\n}","sourcePath":"baoclaw-core/src/ipc/protocol.rs","lineRange":{"start":15,"end":60}}],"progress":56},{"id":"04-ipc-multiclient-slide-14","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: protocol.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/ipc/protocol.rs</span><span class=\"code-lines\">lines 62-120</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">#[derive(Clone, Debug)]\npub enum JsonRpcMessage {\n    Request(JsonRpcRequest),\n    Response(JsonRpcResponse),\n    ErrorResponse(JsonRpcErrorResponse),\n    Notification(JsonRpcNotification),\n}\n\nimpl&lt;&#39;de&gt; Deserialize&lt;&#39;de&gt; for JsonRpcMessage {\n    fn deserialize&lt;D&gt;(deserializer: D) -&gt; Result&lt;Self, D::Error&gt;\n    where\n        D: serde::Deserializer&lt;&#39;de&gt;,\n    {\n        let value = Value::deserialize(deserializer)?;\n        \n        // 有 error 字段 → ErrorResponse\n        if value.get(&quot;error&quot;).is_some() {\n            return Ok(JsonRpcMessage::ErrorResponse(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        // 有 result 字段 → Response\n        if value.get(&quot;result&quot;).is_some() {\n            return Ok(JsonRpcMessage::Response(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        // 有 method 字段\n        if let Some(_method) = value.get(&quot;method&quot;) {\n            // 有 id → Request\n            if value.get(&quot;id&quot;).is_some() {\n                return Ok(JsonRpcMessage::Request(\n                    serde_json::from_value(value).map_err(serde::de::Error::custom)?\n                ));\n            }\n            // 无 id → Notification\n            return Ok(JsonRpcMessage::Notification(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        Err(serde::de::Error::custom(&quot;Invalid JSON-RPC message&quot;))\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-10","language":"rust","code":"#[derive(Clone, Debug)]\npub enum JsonRpcMessage {\n    Request(JsonRpcRequest),\n    Response(JsonRpcResponse),\n    ErrorResponse(JsonRpcErrorResponse),\n    Notification(JsonRpcNotification),\n}\n\nimpl<'de> Deserialize<'de> for JsonRpcMessage {\n    fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>\n    where\n        D: serde::Deserializer<'de>,\n    {\n        let value = Value::deserialize(deserializer)?;\n        \n        // 有 error 字段 → ErrorResponse\n        if value.get(\"error\").is_some() {\n            return Ok(JsonRpcMessage::ErrorResponse(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        // 有 result 字段 → Response\n        if value.get(\"result\").is_some() {\n            return Ok(JsonRpcMessage::Response(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        // 有 method 字段\n        if let Some(_method) = value.get(\"method\") {\n            // 有 id → Request\n            if value.get(\"id\").is_some() {\n                return Ok(JsonRpcMessage::Request(\n                    serde_json::from_value(value).map_err(serde::de::Error::custom)?\n                ));\n            }\n            // 无 id → Notification\n            return Ok(JsonRpcMessage::Notification(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        Err(serde::de::Error::custom(\"Invalid JSON-RPC message\"))\n    }\n}","sourcePath":"baoclaw-core/src/ipc/protocol.rs","lineRange":{"start":62,"end":120}}],"progress":56},{"id":"04-ipc-multiclient-slide-15","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: protocol.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/ipc/protocol.rs</span><span class=\"code-lines\">lines 130-160</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">// 编码：JSON + 换行符\npub fn encode_ndjson(message: &amp;impl Serialize) -&gt; Result&lt;Vec&lt;u8&gt;, serde_json::Error&gt; {\n    let mut bytes = serde_json::to_vec(message)?;\n    bytes.push(b&#39;\\n&#39;);\n    Ok(bytes)\n}\n\n// 解码：单行 JSON → JsonRpcMessage\npub fn decode_ndjson_line(line: &amp;str) -&gt; Result&lt;JsonRpcMessage, serde_json::Error&gt; {\n    let trimmed = line.trim();\n    if trimmed.is_empty() {\n        return Err(serde_json::Error::custom(&quot;Empty line&quot;));\n    }\n    serde_json::from_str(trimmed)\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-11","language":"rust","code":"// 编码：JSON + 换行符\npub fn encode_ndjson(message: &impl Serialize) -> Result<Vec<u8>, serde_json::Error> {\n    let mut bytes = serde_json::to_vec(message)?;\n    bytes.push(b'\\n');\n    Ok(bytes)\n}\n\n// 解码：单行 JSON → JsonRpcMessage\npub fn decode_ndjson_line(line: &str) -> Result<JsonRpcMessage, serde_json::Error> {\n    let trimmed = line.trim();\n    if trimmed.is_empty() {\n        return Err(serde_json::Error::custom(\"Empty line\"));\n    }\n    serde_json::from_str(trimmed)\n}","sourcePath":"baoclaw-core/src/ipc/protocol.rs","lineRange":{"start":130,"end":160}}],"progress":57},{"id":"04-ipc-multiclient-slide-16","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: server.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/ipc/server.rs</span><span class=\"code-lines\">lines 35-80</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// IPC 服务端 - 监听 Unix Domain Socket\npub struct IpcServer {\n    listener: UnixListener,\n    socket_path: PathBuf,\n}\n\nimpl IpcServer {\n    /// Create and bind to a Unix Domain Socket.\n    /// Cleans up old socket file if exists, sets permissions to 0600.\n    pub async fn bind(socket_path: PathBuf) -&gt; Result&lt;Self, IpcError&gt; {\n        // Remove old socket file if exists\n        if socket_path.exists() {\n            std::fs::remove_file(&amp;socket_path)\n                .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        }\n        \n        // Create parent directory\n        if let Some(parent) = socket_path.parent() {\n            std::fs::create_dir_all(parent)\n                .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        }\n        \n        // Bind listener\n        let listener = UnixListener::bind(&amp;socket_path)\n            .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        \n        // Set permissions to 0600 (only owner can access)\n        std::fs::set_permissions(&amp;socket_path, std::fs::Permissions::from_mode(0o600))\n            .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        \n        Ok(Self { listener, socket_path })\n    }\n}\n\nimpl Drop for IpcServer {\n    fn drop(&amp;mut self) {\n        // Clean up socket file on drop\n        let _ = std::fs::remove_file(&amp;self.socket_path);\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-12","language":"rust","code":"/// IPC 服务端 - 监听 Unix Domain Socket\npub struct IpcServer {\n    listener: UnixListener,\n    socket_path: PathBuf,\n}\n\nimpl IpcServer {\n    /// Create and bind to a Unix Domain Socket.\n    /// Cleans up old socket file if exists, sets permissions to 0600.\n    pub async fn bind(socket_path: PathBuf) -> Result<Self, IpcError> {\n        // Remove old socket file if exists\n        if socket_path.exists() {\n            std::fs::remove_file(&socket_path)\n                .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        }\n        \n        // Create parent directory\n        if let Some(parent) = socket_path.parent() {\n            std::fs::create_dir_all(parent)\n                .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        }\n        \n        // Bind listener\n        let listener = UnixListener::bind(&socket_path)\n            .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        \n        // Set permissions to 0600 (only owner can access)\n        std::fs::set_permissions(&socket_path, std::fs::Permissions::from_mode(0o600))\n            .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        \n        Ok(Self { listener, socket_path })\n    }\n}\n\nimpl Drop for IpcServer {\n    fn drop(&mut self) {\n        // Clean up socket file on drop\n        let _ = std::fs::remove_file(&self.socket_path);\n    }\n}","sourcePath":"baoclaw-core/src/ipc/server.rs","lineRange":{"start":35,"end":80}}],"progress":57},{"id":"04-ipc-multiclient-slide-17","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: server.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/ipc/server.rs</span><span class=\"code-lines\">lines 82-130</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// IPC 连接 - 带缓冲的读写\npub struct IpcConnection {\n    reader: BufReader&lt;tokio::net::unix::OwnedReadHalf&gt;,\n    writer: BufWriter&lt;tokio::net::unix::OwnedWriteHalf&gt;,\n}\n\nimpl IpcConnection {\n    /// Read a single NDJSON message.\n    pub async fn read_message(&amp;mut self) -&gt; Result&lt;JsonRpcMessage, IpcError&gt; {\n        let mut line = String::new();\n        let n = self.reader.read_line(&amp;mut line).await\n            .map_err(|e| IpcError::ReadFailed(e.to_string()))?;\n        \n        if n == 0 {\n            return Err(IpcError::ConnectionClosed);\n        }\n        \n        decode_ndjson_line(&amp;line)\n            .map_err(|e| IpcError::ParseFailed(e.to_string()))\n    }\n    \n    /// Write a single NDJSON message.\n    pub async fn write_message(&amp;mut self, message: &amp;impl Serialize) -&gt; Result&lt;(), IpcError&gt; {\n        let bytes = encode_ndjson(message)\n            .map_err(|e| IpcError::EncodeFailed(e.to_string()))?;\n        \n        self.writer.write_all(&amp;bytes).await\n            .map_err(|e| IpcError::WriteFailed(e.to_string()))?;\n        \n        self.writer.flush().await\n            .map_err(|e| IpcError::WriteFailed(e.to_string()))?;\n        \n        Ok(())\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-13","language":"rust","code":"/// IPC 连接 - 带缓冲的读写\npub struct IpcConnection {\n    reader: BufReader<tokio::net::unix::OwnedReadHalf>,\n    writer: BufWriter<tokio::net::unix::OwnedWriteHalf>,\n}\n\nimpl IpcConnection {\n    /// Read a single NDJSON message.\n    pub async fn read_message(&mut self) -> Result<JsonRpcMessage, IpcError> {\n        let mut line = String::new();\n        let n = self.reader.read_line(&mut line).await\n            .map_err(|e| IpcError::ReadFailed(e.to_string()))?;\n        \n        if n == 0 {\n            return Err(IpcError::ConnectionClosed);\n        }\n        \n        decode_ndjson_line(&line)\n            .map_err(|e| IpcError::ParseFailed(e.to_string()))\n    }\n    \n    /// Write a single NDJSON message.\n    pub async fn write_message(&mut self, message: &impl Serialize) -> Result<(), IpcError> {\n        let bytes = encode_ndjson(message)\n            .map_err(|e| IpcError::EncodeFailed(e.to_string()))?;\n        \n        self.writer.write_all(&bytes).await\n            .map_err(|e| IpcError::WriteFailed(e.to_string()))?;\n        \n        self.writer.flush().await\n            .map_err(|e| IpcError::WriteFailed(e.to_string()))?;\n        \n        Ok(())\n    }\n}","sourcePath":"baoclaw-core/src/ipc/server.rs","lineRange":{"start":82,"end":130}}],"progress":58},{"id":"04-ipc-multiclient-slide-18","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: router.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/ipc/router.rs</span><span class=\"code-lines\">lines 25-80</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]\n#[serde(tag = &quot;method&quot;, content = &quot;params&quot;)]\npub enum ClientMethod {\n    #[serde(rename = &quot;initialize&quot;)]\n    Initialize {\n        cwd: PathBuf,\n        model: Option&lt;String&gt;,\n        settings: Value,\n        #[serde(default)]\n        resume_session_id: Option&lt;String&gt;,\n        #[serde(default)]\n        shared_ses l: String,\n    },\n    \n    // ... 更多方法\n}","sourcePath":"baoclaw-core/src/ipc/router.rs","lineRange":{"start":25,"end":80}}],"progress":58},{"id":"04-ipc-multiclient-slide-19","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: events.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/ipc/events.rs</span><span class=\"code-lines\">lines 15-50</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// 引擎事件 → stream/event 通知\npub fn engine_event_to_notification(event: &amp;EngineEvent) -&gt; JsonRpcNotification {\n    JsonRpcNotification::new(\n        &quot;stream/event&quot;,\n        serde_json::to_value(event).unwrap_or(Value::Null),\n    )\n}\n\n/// 通知结构\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcNotification {\n    pub jsonrpc: String,\n    pub method: String,\n    pub params: Value,\n}\n\nimpl JsonRpcNotification {\n    pub fn new(method: &amp;str, params: Value) -&gt; Self {\n        Self {\n            jsonrpc: &quot;2.0&quot;.to_string(),\n            method: method.to_string(),\n            params,\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-15","language":"rust","code":"/// 引擎事件 → stream/event 通知\npub fn engine_event_to_notification(event: &EngineEvent) -> JsonRpcNotification {\n    JsonRpcNotification::new(\n        \"stream/event\",\n        serde_json::to_value(event).unwrap_or(Value::Null),\n    )\n}\n\n/// 通知结构\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcNotification {\n    pub jsonrpc: String,\n    pub method: String,\n    pub params: Value,\n}\n\nimpl JsonRpcNotification {\n    pub fn new(method: &str, params: Value) -> Self {\n        Self {\n            jsonrpc: \"2.0\".to_string(),\n            method: method.to_string(),\n            params,\n        }\n    }\n}","sourcePath":"baoclaw-core/src/ipc/events.rs","lineRange":{"start":15,"end":50}}],"progress":59},{"id":"04-ipc-multiclient-slide-20","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: client.ts","content":"<div class=\"code-source\"><span class=\"code-path\">ts-ipc/client.ts</span><span class=\"code-lines\">lines 20-70</span></div>\n<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">export class IpcClient {\n  private socket: net.Socket | null = null;\n  private buffer = &#39;&#39;;\n  private nextId = 1;\n  private pendingRequests = new Map&lt;number | string, {\n    resolve: (value: unknown) =&gt; void;\n    reject: (error: Error) =&gt; void;\n    timer: ReturnType&lt;typeof setTimeout&gt;;\n  }&gt;();\n  private notificationHandlers = new Map&lt;string, NotificationHandler[]&gt;();\n\n  async connect(socketPath: string): Promise&lt;void&gt; {\n    return new Promise((resolve, reject) =&gt; {\n      this.socket = net.createConnection(socketPath, () =&gt; {\n        resolve();\n      });\n      \n      this.socket.on(&#39;data&#39;, (data) =&gt; {\n        this.buffer += data.toString();\n        this.processBuffer();\n      });\n      \n      this.socket.on(&#39;error&#39;, (err) =&gt; {\n        reject(new Error(`IPC connection error: ${err.message}`));\n      });\n      \n      this.socket.on(&#39;close&#39;, () =&gt; {\n        this.cleanup();\n      });\n    });\n  }\n\n  private processBuffer(): void {\n    const lines = this.buffer.split(&#39;\\n&#39;);\n    this.buffer = lines.pop() || &#39;&#39;;  // Keep incomplete line in buffer\n    \n    for (const line of lines) {\n      if (line.trim()) {\n        this.handleMessage(JSON.parse(line));\n      }\n    }\n  }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-16","language":"typescript","code":"export class IpcClient {\n  private socket: net.Socket | null = null;\n  private buffer = '';\n  private nextId = 1;\n  private pendingRequests = new Map<number | string, {\n    resolve: (value: unknown) => void;\n    reject: (error: Error) => void;\n    timer: ReturnType<typeof setTimeout>;\n  }>();\n  private notificationHandlers = new Map<string, NotificationHandler[]>();\n\n  async connect(socketPath: string): Promise<void> {\n    return new Promise((resolve, reject) => {\n      this.socket = net.createConnection(socketPath, () => {\n        resolve();\n      });\n      \n      this.socket.on('data', (data) => {\n        this.buffer += data.toString();\n        this.processBuffer();\n      });\n      \n      this.socket.on('error', (err) => {\n        reject(new Error(`IPC connection error: ${err.message}`));\n      });\n      \n      this.socket.on('close', () => {\n        this.cleanup();\n      });\n    });\n  }\n\n  private processBuffer(): void {\n    const lines = this.buffer.split('\\n');\n    this.buffer = lines.pop() || '';  // Keep incomplete line in buffer\n    \n    for (const line of lines) {\n      if (line.trim()) {\n        this.handleMessage(JSON.parse(line));\n      }\n    }\n  }\n}","sourcePath":"ts-ipc/client.ts","lineRange":{"start":20,"end":70}}],"progress":59},{"id":"04-ipc-multiclient-slide-21","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: client.ts","content":"<div class=\"code-source\"><span class=\"code-path\">ts-ipc/client.ts</span><span class=\"code-lines\">lines 72-120</span></div>\n<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">  async request&lt;T = unknown&gt;(method: string, params?: unknown, timeout = 30000): Promise&lt;T&gt; {\n    return new Promise((resolve, reject) =&gt; {\n      if (!this.socket) {\n        reject(new Error(&#39;Not connected&#39;));\n        return;\n      }\n      \n      const id = this.nextId++;\n      const request = {\n        jsonrpc: &#39;2.0&#39;,\n        method,\n        params,\n        id,\n      };\n      \n      // Set timeout\n      const timer = setTimeout(() =&gt; {\n        this.pendingRequests.delete(id);\n        reject(new Error(`Request ${id} timed out`));\n      }, timeout);\n      \n      // Store pending request\n      this.pendingRequests.set(id, {\n        resolve: resolve as (value: unknown) =&gt; void,\n        reject,\n        timer,\n      });\n      \n      // Send request\n      this.socket.write(JSON.stringify(request) + &#39;\\n&#39;);\n    });\n  }\n\n  onNotification(method: string, handler: NotificationHandler): () =&gt; void {\n    if (!this.notificationHandlers.has(method)) {\n      this.notificationHandlers.set(method, []);\n    }\n    this.notificationHandlers.get(method)!.push(handler);\n    \n    // Return unsubscribe function\n    return () =&gt; {\n      const handlers = this.notificationHandlers.get(method);\n      if (handlers) {\n        const index = handlers.indexOf(handler);\n        if (index &gt;= 0) handlers.splice(index, 1);\n      }\n    };\n  }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-17","language":"typescript","code":"  async request<T = unknown>(method: string, params?: unknown, timeout = 30000): Promise<T> {\n    return new Promise((resolve, reject) => {\n      if (!this.socket) {\n        reject(new Error('Not connected'));\n        return;\n      }\n      \n      const id = this.nextId++;\n      const request = {\n        jsonrpc: '2.0',\n        method,\n        params,\n        id,\n      };\n      \n      // Set timeout\n      const timer = setTimeout(() => {\n        this.pendingRequests.delete(id);\n        reject(new Error(`Request ${id} timed out`));\n      }, timeout);\n      \n      // Store pending request\n      this.pendingRequests.set(id, {\n        resolve: resolve as (value: unknown) => void,\n        reject,\n        timer,\n      });\n      \n      // Send request\n      this.socket.write(JSON.stringify(request) + '\\n');\n    });\n  }\n\n  onNotification(method: string, handler: NotificationHandler): () => void {\n    if (!this.notificationHandlers.has(method)) {\n      this.notificationHandlers.set(method, []);\n    }\n    this.notificationHandlers.get(method)!.push(handler);\n    \n    // Return unsubscribe function\n    return () => {\n      const handlers = this.notificationHandlers.get(method);\n      if (handlers) {\n        const index = handlers.indexOf(handler);\n        if (index >= 0) handlers.splice(index, 1);\n      }\n    };\n  }","sourcePath":"ts-ipc/client.ts","lineRange":{"start":72,"end":120}}],"progress":60},{"id":"04-ipc-multiclient-slide-22","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: gateway.ts","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-whatsapp/src/gateway.ts</span><span class=\"code-lines\">lines 45-100</span></div>\n<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">export class Gateway {\n  private sessionManager: SessionManager;\n  private ipcClient: IpcClient;\n  private senderTracker: SenderTracker;\n  private permissionManager: PermissionManager;\n  private mediaHandler: MediaHandler;\n  private messageQueue: MessageQueue;\n\n  async start(): Promise&lt;void&gt; {\n    // 1. Initialize WhatsApp session\n    await this.sessionManager.connect();\n    \n    // 2. Discover and connect to daemon\n    const daemonInfo = await discoverDaemon(this.config.cwd);\n    await this.ipcClient.connect(daemonInfo.socket);\n    \n    // 3. Initialize IPC session\n    await this.ipcClient.request(&#39;initialize&#39;, {\n      cwd: this.config.cwd,\n      shared_session_id: this.config.sharedSessionId,\n    });\n    \n    // 4. Subscribe to stream events\n    this.ipcClient.onNotification(&#39;stream/event&#39;, (event) =&gt; {\n      this.handleStreamEvent(event);\n    });\n    \n    // 5. Start message processing loop\n    this.startProcessingLoop();\n  }\n\n  private async handleIncomingMessage(msg: Message): Promise&lt;void&gt; {\n    // 1. 去重检查\n    if (await this.isDuplicate(msg)) return;\n    \n    // 2. 允许列表检查\n    if (!this.isAllowed(msg.sender)) return;\n    \n    // 3. 速率限制\n    if (this.isRateLimited(msg.sender)) return;\n    \n    // 4. 命令解析\n    const text = this.parseCommand(msg.text);\n    if (!text) return;\n    \n    // 5. 消息入队\n    this.messageQueue.enqueue(msg.sender, text);\n  }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-18","language":"typescript","code":"export class Gateway {\n  private sessionManager: SessionManager;\n  private ipcClient: IpcClient;\n  private senderTracker: SenderTracker;\n  private permissionManager: PermissionManager;\n  private mediaHandler: MediaHandler;\n  private messageQueue: MessageQueue;\n\n  async start(): Promise<void> {\n    // 1. Initialize WhatsApp session\n    await this.sessionManager.connect();\n    \n    // 2. Discover and connect to daemon\n    const daemonInfo = await discoverDaemon(this.config.cwd);\n    await this.ipcClient.connect(daemonInfo.socket);\n    \n    // 3. Initialize IPC session\n    await this.ipcClient.request('initialize', {\n      cwd: this.config.cwd,\n      shared_session_id: this.config.sharedSessionId,\n    });\n    \n    // 4. Subscribe to stream events\n    this.ipcClient.onNotification('stream/event', (event) => {\n      this.handleStreamEvent(event);\n    });\n    \n    // 5. Start message processing loop\n    this.startProcessingLoop();\n  }\n\n  private async handleIncomingMessage(msg: Message): Promise<void> {\n    // 1. 去重检查\n    if (await this.isDuplicate(msg)) return;\n    \n    // 2. 允许列表检查\n    if (!this.isAllowed(msg.sender)) return;\n    \n    // 3. 速率限制\n    if (this.isRateLimited(msg.sender)) return;\n    \n    // 4. 命令解析\n    const text = this.parseCommand(msg.text);\n    if (!text) return;\n    \n    // 5. 消息入队\n    this.messageQueue.enqueue(msg.sender, text);\n  }\n}","sourcePath":"baoclaw-whatsapp/src/gateway.ts","lineRange":{"start":45,"end":100}}],"progress":60},{"id":"04-ipc-multiclient-slide-23","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: messageQueue.ts","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-whatsapp/src/messageQueue.ts</span><span class=\"code-lines\">lines 10-50</span></div>\n<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">export class MessageQueue {\n  private queues = new Map&lt;string, string[]&gt;();\n  private processing = new Set&lt;string&gt;();\n  private maxSize: number;\n\n  constructor(maxSize = 10) {\n    this.maxSize = maxSize;\n  }\n\n  enqueue(sender: string, text: string): boolean {\n    // Check if queue is full\n    const queue = this.queues.get(sender) || [];\n    if (queue.length &gt;= this.maxSize) {\n      return false;  // Backpressure\n    }\n    \n    queue.push(text);\n    this.queues.set(sender, queue);\n    return true;\n  }\n\n  dequeue(sender: string): string | undefined {\n    const queue = this.queues.get(sender);\n    if (!queue || queue.length === 0) return undefined;\n    \n    return queue.shift();\n  }\n\n  isProcessing(sender: string): boolean {\n    return this.processing.has(sender);\n  }\n\n  setProcessing(sender: string, value: boolean): void {\n    if (value) {\n      this.processing.add(sender);\n    } else {\n      this.processing.delete(sender);\n    }\n  }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-19","language":"typescript","code":"export class MessageQueue {\n  private queues = new Map<string, string[]>();\n  private processing = new Set<string>();\n  private maxSize: number;\n\n  constructor(maxSize = 10) {\n    this.maxSize = maxSize;\n  }\n\n  enqueue(sender: string, text: string): boolean {\n    // Check if queue is full\n    const queue = this.queues.get(sender) || [];\n    if (queue.length >= this.maxSize) {\n      return false;  // Backpressure\n    }\n    \n    queue.push(text);\n    this.queues.set(sender, queue);\n    return true;\n  }\n\n  dequeue(sender: string): string | undefined {\n    const queue = this.queues.get(sender);\n    if (!queue || queue.length === 0) return undefined;\n    \n    return queue.shift();\n  }\n\n  isProcessing(sender: string): boolean {\n    return this.processing.has(sender);\n  }\n\n  setProcessing(sender: string, value: boolean): void {\n    if (value) {\n      this.processing.add(sender);\n    } else {\n      this.processing.delete(sender);\n    }\n  }\n}","sourcePath":"baoclaw-whatsapp/src/messageQueue.ts","lineRange":{"start":10,"end":50}}],"progress":61},{"id":"04-ipc-multiclient-slide-24","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: senderTracker.ts","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-whatsapp/src/senderTracker.ts</span><span class=\"code-lines\">lines 10-50</span></div>\n<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">export class SenderTracker {\n  // 发送者 → JID 映射\n  private senderToJid = new Map&lt;string, string&gt;();\n  // 响应累积器\n  private accumulators = new Map&lt;string, string&gt;();\n\n  registerSender(phone: string, jid: string, isGroup: boolean): void {\n    this.senderToJid.set(phone, jid);\n  }\n\n  getJid(phone: string): string | null {\n    return this.senderToJid.get(phone) || null;\n  }\n\n  accumulate(phone: string, content: string): void {\n    const current = this.accumulators.get(phone) || &#39;&#39;;\n    this.accumulators.set(phone, current + content);\n  }\n\n  getAccumulated(phone: string): string {\n    return this.accumulators.get(phone) || &#39;&#39;;\n  }\n\n  clearAccumulator(phone: string): void {\n    this.accumulators.delete(phone);\n  }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-20","language":"typescript","code":"export class SenderTracker {\n  // 发送者 → JID 映射\n  private senderToJid = new Map<string, string>();\n  // 响应累积器\n  private accumulators = new Map<string, string>();\n\n  registerSender(phone: string, jid: string, isGroup: boolean): void {\n    this.senderToJid.set(phone, jid);\n  }\n\n  getJid(phone: string): string | null {\n    return this.senderToJid.get(phone) || null;\n  }\n\n  accumulate(phone: string, content: string): void {\n    const current = this.accumulators.get(phone) || '';\n    this.accumulators.set(phone, current + content);\n  }\n\n  getAccumulated(phone: string): string {\n    return this.accumulators.get(phone) || '';\n  }\n\n  clearAccumulator(phone: string): void {\n    this.accumulators.delete(phone);\n  }\n}","sourcePath":"baoclaw-whatsapp/src/senderTracker.ts","lineRange":{"start":10,"end":50}}],"progress":61},{"id":"04-ipc-multiclient-slide-25","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: cli.ts","content":"<div class=\"code-source\"><span class=\"code-path\">ts-ipc/cli.ts</span><span class=\"code-lines\">lines 150-200</span></div>\n<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">function discoverDaemons(): DaemonInfo[] {\n  const dir = path.join(os.tmpdir(), &#39;baoclaw-sockets&#39;);\n  \n  if (!fs.existsSync(dir)) return [];\n  \n  const daemons: DaemonInfo[] = [];\n  \n  for (const file of fs.readdirSync(dir)) {\n    if (!file.endsWith(&#39;.json&#39;)) continue;\n    \n    try {\n      const content = fs.readFileSync(path.join(dir, file), &#39;utf-8&#39;);\n      const info: DaemonInfo = JSON.parse(content);\n      \n      // 检查进程存活\n      try {\n        process.kill(info.pid, 0);  // Signal 0 = check if process exists\n      } catch {\n        // Process dead, clean up\n        fs.unlinkSync(path.join(dir, file));\n        continue;\n      }\n      \n      // 检查 socket 文件存在\n      if (!fs.existsSync(info.socket)) {\n        fs.unlinkSync(path.join(dir, file));\n        continue;\n      }\n      \n      daemons.push(info);\n    } catch {\n      // Invalid JSON, skip\n    }\n  }\n  \n  // 按启动时间排序，最新的优先\n  daemons.sort((a, b) =&gt; \n    new Date(b.started_at).getTime() - new Date(a.started_at).getTime()\n  );\n  \n  return daemons;\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-21","language":"typescript","code":"function discoverDaemons(): DaemonInfo[] {\n  const dir = path.join(os.tmpdir(), 'baoclaw-sockets');\n  \n  if (!fs.existsSync(dir)) return [];\n  \n  const daemons: DaemonInfo[] = [];\n  \n  for (const file of fs.readdirSync(dir)) {\n    if (!file.endsWith('.json')) continue;\n    \n    try {\n      const content = fs.readFileSync(path.join(dir, file), 'utf-8');\n      const info: DaemonInfo = JSON.parse(content);\n      \n      // 检查进程存活\n      try {\n        process.kill(info.pid, 0);  // Signal 0 = check if process exists\n      } catch {\n        // Process dead, clean up\n        fs.unlinkSync(path.join(dir, file));\n        continue;\n      }\n      \n      // 检查 socket 文件存在\n      if (!fs.existsSync(info.socket)) {\n        fs.unlinkSync(path.join(dir, file));\n        continue;\n      }\n      \n      daemons.push(info);\n    } catch {\n      // Invalid JSON, skip\n    }\n  }\n  \n  // 按启动时间排序，最新的优先\n  daemons.sort((a, b) => \n    new Date(b.started_at).getTime() - new Date(a.started_at).getTime()\n  );\n  \n  return daemons;\n}","sourcePath":"ts-ipc/cli.ts","lineRange":{"start":150,"end":200}}],"progress":62},{"id":"04-ipc-multiclient-slide-26","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例: gateway.ts","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-whatsapp/src/gateway.ts</span><span class=\"code-lines\">lines 300-340</span></div>\n<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">export class Gateway {\n  private shuttingDown = false;\n\n  async shutdown(signal: string): Promise&lt;void&gt; {\n    if (this.shuttingDown) return;\n    this.shuttingDown = true;\n    \n    console.log(`Shutting down (${signal})...`);\n    \n    // 1. 设置超时强制退出\n    const forceTimer = setTimeout(() =&gt; {\n      console.log(&#39;Force exit after timeout&#39;);\n      process.exit(1);\n    }, 10000);\n    \n    try {\n      // 2. 保存会话状态\n      await this.sessionManager.disconnect();\n      \n      // 3. 关闭 IPC 连接\n      await this.ipcClient.disconnect();\n      \n      // 4. 清理 PID 文件\n      this.removePidFile();\n      \n      console.log(&#39;Shutdown complete&#39;);\n    } catch (err) {\n      console.error(&#39;Shutdown error:&#39;, err);\n    } finally {\n      clearTimeout(forceTimer);\n      process.exit(0);\n    }\n  }\n}\n\n// 注册信号处理\nprocess.on(&#39;SIGTERM&#39;, () =&gt; gateway.shutdown(&#39;SIGTERM&#39;));\nprocess.on(&#39;SIGINT&#39;, () =&gt; gateway.shutdown(&#39;SIGINT&#39;));</code></pre>\n","type":"code","codeBlocks":[{"id":"code-22","language":"typescript","code":"export class Gateway {\n  private shuttingDown = false;\n\n  async shutdown(signal: string): Promise<void> {\n    if (this.shuttingDown) return;\n    this.shuttingDown = true;\n    \n    console.log(`Shutting down (${signal})...`);\n    \n    // 1. 设置超时强制退出\n    const forceTimer = setTimeout(() => {\n      console.log('Force exit after timeout');\n      process.exit(1);\n    }, 10000);\n    \n    try {\n      // 2. 保存会话状态\n      await this.sessionManager.disconnect();\n      \n      // 3. 关闭 IPC 连接\n      await this.ipcClient.disconnect();\n      \n      // 4. 清理 PID 文件\n      this.removePidFile();\n      \n      console.log('Shutdown complete');\n    } catch (err) {\n      console.error('Shutdown error:', err);\n    } finally {\n      clearTimeout(forceTimer);\n      process.exit(0);\n    }\n  }\n}\n\n// 注册信号处理\nprocess.on('SIGTERM', () => gateway.shutdown('SIGTERM'));\nprocess.on('SIGINT', () => gateway.shutdown('SIGINT'));","sourcePath":"baoclaw-whatsapp/src/gateway.ts","lineRange":{"start":300,"end":340}}],"progress":62},{"id":"04-ipc-multiclient-slide-27","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：默认权限允许其他用户连接\nlet listener = UnixListener::bind(&amp;socket_path)?;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-23","language":"rust","code":"// ❌ 错误：默认权限允许其他用户连接\nlet listener = UnixListener::bind(&socket_path)?;"}],"progress":63},{"id":"04-ipc-multiclient-slide-28","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：设置 0600 权限\nlet listener = UnixListener::bind(&amp;socket_path)?;\nstd::fs::set_permissions(&amp;socket_path, std::fs::Permissions::from_mode(0o600))?;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-24","language":"rust","code":"// ✅ 正确：设置 0600 权限\nlet listener = UnixListener::bind(&socket_path)?;\nstd::fs::set_permissions(&socket_path, std::fs::Permissions::from_mode(0o600))?;"}],"progress":63},{"id":"04-ipc-multiclient-slide-29","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">// ❌ 错误：假设一次读取就是一条完整消息\nsocket.on(&#39;data&#39;, (data) =&gt; {\n  const msg = JSON.parse(data.toString());  // 可能不完整或包含多条\n});</code></pre>\n","type":"code","codeBlocks":[{"id":"code-25","language":"typescript","code":"// ❌ 错误：假设一次读取就是一条完整消息\nsocket.on('data', (data) => {\n  const msg = JSON.parse(data.toString());  // 可能不完整或包含多条\n});"}],"progress":64},{"id":"04-ipc-multiclient-slide-30","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">// ✅ 正确：使用 NDJSON 帧格式\nsocket.on(&#39;data&#39;, (data) =&gt; {\n  this.buffer += data.toString();\n  const lines = this.buffer.split(&#39;\\n&#39;);\n  this.buffer = lines.pop() || &#39;&#39;;\n  for (const line of lines) {\n    if (line.trim()) {\n      this.handleMessage(JSON.parse(line));\n    }\n  }\n});</code></pre>\n","type":"code","codeBlocks":[{"id":"code-26","language":"typescript","code":"// ✅ 正确：使用 NDJSON 帧格式\nsocket.on('data', (data) => {\n  this.buffer += data.toString();\n  const lines = this.buffer.split('\\n');\n  this.buffer = lines.pop() || '';\n  for (const line of lines) {\n    if (line.trim()) {\n      this.handleMessage(JSON.parse(line));\n    }\n  }\n});"}],"progress":64},{"id":"04-ipc-multiclient-slide-31","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">// ❌ 错误：假设守护进程总是运行\nawait ipcClient.request(&#39;initialize&#39;, params);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-27","language":"typescript","code":"// ❌ 错误：假设守护进程总是运行\nawait ipcClient.request('initialize', params);"}],"progress":65},{"id":"04-ipc-multiclient-slide-32","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">// ✅ 正确：检查守护进程状态\ntry {\n  await ipcClient.request(&#39;initialize&#39;, params);\n} catch (err) {\n  if (err.code === &#39;ECONNREFUSED&#39;) {\n    // 守护进程已终止，尝试重启\n    await startDaemon();\n    await ipcClient.connect(socketPath);\n    await ipcClient.request(&#39;initialize&#39;, params);\n  } else {\n    throw err;\n  }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-28","language":"typescript","code":"// ✅ 正确：检查守护进程状态\ntry {\n  await ipcClient.request('initialize', params);\n} catch (err) {\n  if (err.code === 'ECONNREFUSED') {\n    // 守护进程已终止，尝试重启\n    await startDaemon();\n    await ipcClient.connect(socketPath);\n    await ipcClient.request('initialize', params);\n  } else {\n    throw err;\n  }\n}"}],"progress":65},{"id":"04-ipc-multiclient-slide-33","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">// ❌ 错误：无限队列可能导致内存溢出\nqueue.push(message);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-29","language":"typescript","code":"// ❌ 错误：无限队列可能导致内存溢出\nqueue.push(message);"}],"progress":66},{"id":"04-ipc-multiclient-slide-34","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-typescript\"><code class=\"language-typescript\">// ✅ 正确：限制队列大小\nif (queue.length &gt;= this.maxSize) {\n  return false;  // 拒绝新消息，让客户端稍后重试\n}\nqueue.push(message);\nreturn true;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-30","language":"typescript","code":"// ✅ 正确：限制队列大小\nif (queue.length >= this.maxSize) {\n  return false;  // 拒绝新消息，让客户端稍后重试\n}\nqueue.push(message);\nreturn true;"}],"progress":66},{"id":"04-ipc-multiclient-slide-35","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">let listener = TcpListener::bind(&quot;127.0.0.1:8080&quot;).await?;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-31","language":"rust","code":"let listener = TcpListener::bind(\"127.0.0.1:8080\").await?;"}],"progress":67},{"id":"04-ipc-multiclient-slide-36","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">let server = tonic::transport::Server::builder()\n    .add_service(IpcServiceServer::new(service))\n    .serve(addr)\n    .await?;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-32","language":"rust","code":"let server = tonic::transport::Server::builder()\n    .add_service(IpcServiceServer::new(service))\n    .serve(addr)\n    .await?;"}],"progress":68},{"id":"04-ipc-multiclient-slide-37","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">let listener = UnixListener::bind(&amp;socket_path)?;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-33","language":"rust","code":"let listener = UnixListener::bind(&socket_path)?;"}],"progress":68},{"id":"04-ipc-multiclient-slide-38","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">[4 bytes length][JSON payload]</code></pre>\n","type":"code","codeBlocks":[{"id":"code-34","language":"other","code":"[4 bytes length][JSON payload]"}],"progress":69},{"id":"04-ipc-multiclient-slide-39","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">[JSON]\\n[JSON]\\n</code></pre>\n","type":"code","codeBlocks":[{"id":"code-35","language":"other","code":"[JSON]\\n[JSON]\\n"}],"progress":69},{"id":"04-ipc-multiclient-slide-40","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"思考","content":"<p><!-- Requirements: 5.4 讨论替代方案与权衡决策 --></p>\n<h3>替代方案</h3>\n<p>#### 方案 A: TCP Socket</p>\n<p>``<code>rust\nlet listener = TcpListener::bind(\"127.0.0.1:8080\").await?;\n</code>`<code></p>\n<p>- <strong>优点:</strong> 支持远程连接，跨机器通信\n- <strong>缺点:</strong> 需要额外的认证机制，性能较低\n- <strong>适用场景:</strong> 分布式部署，需要远程访问</p>\n<p>#### 方案 B: gRPC</p>\n<p></code>`<code>rust\nlet server = tonic::transport::Server::builder()\n    .add_service(IpcServiceServer::new(service))\n    .serve(addr)\n    .await?;\n</code>`<code></p>\n<p>- <strong>优点:</strong> 强类型接口，代码生成，流式支持\n- <strong>缺点:</strong> 更重的依赖，编译时间长\n- <strong>适用场景:</strong> 需要跨语言客户端的正式服务</p>\n<p>#### 方案 C: JSON-RPC over Unix Domain Socket ✓</p>\n<p></code>`<code>rust\nlet listener = UnixListener::bind(&socket_path)?;\n</code>`<code></p>\n<p>- <strong>优点:</strong> 简单、高性能、文件权限安全\n- <strong>缺点:</strong> 仅限本机通信\n- <strong>适用场景:</strong> 本地服务（BaoClaw 选择）</p>\n<p>\n<h3>权衡决策</h3></p>\n<p>| 决策点 | 选择 | 原因 | 影响 |\n|--------|------|------|------|\n| 传输协议 | Unix Domain Socket | 本机通信最高效 | 无网络开销 |\n| 消息格式 | NDJSON | 流式友好，易调试 | 自然边界 |\n| 协议层 | JSON-RPC 2.0 | 简单标准，广泛支持 | 多语言客户端 |\n| 会话隔离 | shared_session_id | 灵活的共享/隔离 | 多渠道接入 |\n| 消息队列 | Per-Client Queue | 顺序保证，背压控制 | 可靠性 |</p>\n<h3>设计决策：为什么用 Unix Domain Socket？</h3>\n<p><strong>优点：</strong></p>\n<p>1. <strong>性能:</strong> 无网络栈开销，延迟更低\n2. <strong>安全:</strong> 文件权限控制（0600），只有 owner 可连接\n3. <strong>简单:</strong> 无需端口管理，避免端口冲突</p>\n<p><strong>缺点：</strong></p>\n<p>- 仅限本机通信\n- 不适用于分布式部署</p>\n<p><strong>结论:</strong> BaoClaw 定位为本地开发助手，Unix Domain Socket 完美匹配需求。若未来需要远程访问，可增加 TCP 或 WebSocket 网关。</p>\n<h3>设计决策：为什么用 NDJSON 而非长度前缀？</h3>\n<p><strong>长度前缀格式：</strong></p>\n<p></code>`<code>\n[4 bytes length][JSON payload]\n</code>`<code></p>\n<p><strong>NDJSON 格式：</strong></p>\n<p></code>`<code>\n[JSON]\\n[JSON]\\n\n</code>``</p>\n<p><strong>对比：</strong></p>\n<p>| 特性 | 长度前缀 | NDJSON |\n|------|---------|--------|\n| 解析复杂度 | 需要先读长度 | 直接按行分割 |\n| 调试友好 | 需要解码 | 直接可读 |\n| 流式支持 | 需缓冲完整消息 | 天然流式 |\n| 实现简单 | 中等 | 非常简单 |</p>\n<p><strong>结论:</strong> NDJSON 更适合流式场景，且调试友好。性能差异在本地 IPC 场景下可忽略。</p>\n<p>---</p>\n","type":"reflection","progress":70},{"id":"04-ipc-multiclient-slide-41","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"总结","content":"<p><!-- Requirements: 5.5 提供要点总结与延伸阅读链接 --></p>\n<h3>核心要点</h3>\n<p>- <strong>守护进程模式</strong>: Agent 在后台持续运行，支持会话保持和多客户端\n- <strong>JSON-RPC 2.0</strong>: 轻量级 RPC 协议，支持请求-响应和通知模式\n- <strong>Unix Domain Socket</strong>: 本机 IPC 最高效的方式，文件权限保证安全\n- <strong>NDJSON 帧格式</strong>: 流式友好，自然消息边界，易于调试\n- <strong>会话共享</strong>: <code>shared_session_id</code> 实现多渠道共享同一会话</p>\n<h3>关键概念回顾</h3>\n<p>1. <strong>IpcServer</strong>: Unix Domain Socket 服务端，自动清理和权限控制\n2. <strong>JsonRpcMessage</strong>: 统一消息类型，自动反序列化为 Request/Response/Notification\n3. <strong>IpcClient</strong>: TypeScript 客户端，支持请求-响应和通知订阅\n4. <strong>MessageQueue</strong>: Per-Client 消息队列，保证顺序和背压控制\n5. <strong>SenderTracker</strong>: 发送者追踪，管理 JID 映射和响应累积</p>\n<h3>IPC 方法一览</h3>\n<p>| 方法 | 方向 | 说明 |\n|------|------|------|\n| <code>initialize</code> | Client → Daemon | 初始化会话 |\n| <code>submitMessage</code> | Client → Daemon | 提交用户消息 |\n| <code>permissionResponse</code> | Client → Daemon | 响应权限请求 |\n| <code>abort</code> | Client → Daemon | 中止当前操作 |\n| <code>compact</code> | Client → Daemon | 触发上下文压缩 |\n| <code>stream/event</code> | Daemon → Client | 流事件通知 |</p>\n<h3>延伸阅读</h3>\n<p>#### 官方资源</p>\n<p>- <a href=\"https://github.com/baoclaw/baoclaw\">BaoClaw GitHub</a> - 完整源码实现\n- <a href=\"./../../../baoclaw-core/src/ipc/protocol.rs\">IPC Protocol 源码</a> - JSON-RPC 协议定义\n- <a href=\"./../../../baoclaw-core/src/ipc/server.rs\">IPC Server 源码</a> - 服务端实现\n- <a href=\"./../../../ts-ipc/client.ts\">TypeScript Client 源码</a> - 客户端实现</p>\n<p>#### 相关章节</p>\n<p>- <a href=\"./../03-memory-context/\">上一章：记忆与上下文</a> - 理解会话记忆和上下文管理\n- <a href=\"./../05-production/\">下一章：生产实践</a> - 了解错误处理、流式输出和权限控制</p>\n<p>#### 外部资源</p>\n<p>- <a href=\"https://www.jsonrpc.org/specification\">JSON-RPC 2.0 Specification</a> - 协议规范\n- <a href=\"https://man7.org/linux/man-pages/man7/unix.7.html\">Unix Domain Sockets</a> - Linux 手册\n- <a href=\"http://ndjson.org/\">NDJSON Format</a> - NDJSON 规范\n</p>","type":"summary","progress":70},{"id":"05-production-slide-01","chapterId":"05-production","chapterTitle":"生产实践","title":"生产实践","content":"<div class=\"chapter-number\">Chapter 5</div>\n<h1>生产实践</h1>\n","type":"title","progress":71},{"id":"05-production-slide-02","chapterId":"05-production","chapterTitle":"生产实践","title":"问题","content":"<p><!-- Requirements: 5.1 描述该章节解决的实际工程问题 --></p>\n<p>将 Agent 从原型推向生产环境，我们面临以下核心挑战：</p>\n<h3>1. 错误无处不在，如何优雅恢复？</h3>\n<p>在生产环境中，错误来源多样：</p>\n<p>- <strong>网络错误</strong>: API 调用超时、连接断开\n- <strong>服务错误</strong>: LLM API 限流、服务器故障\n- <strong>工具错误</strong>: 执行超时、权限不足、参数错误\n- <strong>IPC 错误</strong>: 守护进程崩溃、管道断裂</p>\n<p>如果每个错误都需要人工干预，系统将无法可靠运行。我们需要：</p>\n<p>- 自动识别错误类型\n- 选择合适的恢复策略\n- 在可恢复时自动重试\n- 在不可恢复时优雅降级</p>\n<h3>2. 长时间运行的工具，如何提供实时反馈？</h3>\n<p>某些工具执行时间较长（如代码搜索、大规模文件操作）：</p>\n<p>- 用户不知道工具是否在运行\n- 无法看到中间进度\n- 可能误以为系统卡死</p>\n<p>我们需要流式输出机制：</p>\n<p>- 实时推送执行进度\n- 支持心跳保活\n- 可中断长时间运行的任务</p>\n<h3>3. 工具执行有风险，如何控制权限？</h3>\n<p>Agent 可以执行任意命令、读写文件，这带来安全风险：</p>\n<p>- 误删除重要文件\n- 执行危险命令（如 <code>rm -rf /</code>）\n- 访问敏感数据</p>\n<p>我们需要权限控制系统：</p>\n<p>- 区分只读和写操作\n- 支持细粒度规则配置\n- 交互式确认机制</p>\n<h3>问题背景</h3>\n<p>生产级 Agent 需要三层防护：</p>\n<p>``<code>\n┌─────────────────────────────────────────────────┐\n│                 用户请求                         │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           权限控制层 (PermissionGate)            │\n│  • 检查工具是否允许执行                           │\n│  • 支持规则配置和交互确认                         │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           错误处理层 (ErrorHandling)             │\n│  • 捕获和分类错误                                 │\n│  • 选择恢复策略                                   │\n│  • 自动重试或优雅降级                             │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           流式输出层 (StreamingExecutor)          │\n│  • 实时进度推送                                   │\n│  • 心跳保活                                       │\n│  • 超时控制                                       │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n                 执行结果\n</code>``</p>\n<p>---</p>\n","type":"problem","progress":71},{"id":"05-production-slide-03","chapterId":"05-production","chapterTitle":"生产实践","title":"模式","content":"<p><!-- Requirements: 5.2 讲解通用的设计模式或架构范式 --></p>\n<h3>模式 1: 错误恢复策略模式</h3>\n<p>根据错误类型选择不同的恢复策略：</p>\n<p>| 错误类型 | 恢复策略 | 原因 |\n|---------|---------|------|\n| IPC 断开 | 重启进程 | 进程已不可用 |\n| 状态同步失败 | 全量同步 | 增量同步已失效 |\n| API 限流 | 指数退避重试 | 临时性问题 |\n| 认证错误 | 致命错误 | 需要用户干预 |\n| 工具超时 | 致命错误 | 需要调整参数 |</p>\n<h3>模式 2: 权限门控模式</h3>\n<p>权限检查遵循优先级顺序：</p>\n<p>``<code>mermaid\ngraph TD\n    A[工具调用请求] --> B{检查 Deny 规则}\n    B -->|匹配| C[拒绝执行]\n    B -->|不匹配| D{Bypass 模式?}\n    D -->|是| E[允许执行]\n    D -->|否| F{检查 Allow 规则}\n    F -->|匹配| E\n    F -->|不匹配| G{检查 Ask 规则}\n    G -->|匹配| H[请求用户确认]\n    G -->|不匹配| I{Plan 模式?}\n    I -->|是| J{只读工具?}\n    J -->|是| E\n    J -->|否| H\n    I -->|否| H\n</code>`<code></p>\n<h3>模式 3: 流式执行模式</h3>\n<p>长时间运行的工具通过 channel 实时推送进度：</p>\n<p></code>`<code>mermaid\nsequenceDiagram\n    participant Client as 客户端\n    participant Executor as StreamingExecutor\n    participant Tool as 工具进程\n    participant Channel as mpsc::Channel\n    \n    Client->>Executor: execute_streaming(tool, cmd)\n    Executor->>Channel: create_stream_pair()\n    Executor->>Tool: spawn command\n    Tool-->>Channel: Started\n    Channel-->>Client: StreamChunk::Started\n    loop 执行中\n        Tool-->>Channel: Stdout/Progress\n        Channel-->>Client: StreamChunk\n    end\n    Tool-->>Channel: Completed/Error\n    Channel-->>Client: Final Chunk\n</code>``</p>\n<h3>权限规则优先级</h3>\n<p>权限系统使用多源规则，按以下顺序评估：</p>\n<p>1. <strong>Deny 规则</strong> - 最高优先级，无条件拒绝\n2. <strong>Allow 规则</strong> - 明确允许的工具/模式\n3. <strong>Ask 规则</strong> - 需要用户确认\n4. <strong>模式默认</strong> - Plan 模式允许只读工具\n5. <strong>默认行为</strong> - 询问用户</p>\n<p>---</p>\n","type":"pattern","progress":72},{"id":"05-production-slide-04","chapterId":"05-production","chapterTitle":"生产实践","title":"实现","content":"<p><!-- Requirements: 5.3 提供 BaoClaw 的 Rust 代码示例 --></p>\n<h3>示例 1: 错误恢复策略枚举</h3>\n<p><code>RecoveryStrategy</code> 定义了不同错误类型对应的恢复策略：</p>\n<p>``<code>rust path=\"baoclaw-core/src/engine/error_handling.rs\" lines=\"36-45\"\n/// Error recovery strategy for different error types.\n#[derive(Clone, Debug)]\npub enum RecoveryStrategy {\n    /// Retry with exponential backoff\n    Retry {\n        max_attempts: u32,\n        initial_delay_ms: u64,\n    },\n    /// Request full state sync from Rust core\n    FullStateSync,\n    /// Restart the Rust core process\n    RestartProcess,\n    /// No recovery possible, report to user\n    Fatal(String),\n}\n</code>`<code></p>\n<p><strong>策略说明：</strong></p>\n<p>| 策略 | 适用场景 | 实现方式 |\n|------|---------|---------|\n| </code>Retry<code> | 临时性错误（限流、网络抖动） | 指数退避重试 |\n| </code>FullStateSync<code> | 状态不一致 | 重新拉取完整状态 |\n| </code>RestartProcess<code> | 进程级故障 | 重启守护进程 |\n| </code>Fatal<code> | 不可恢复错误 | 报告用户，等待干预 |</p>\n<h3>示例 2: 确定恢复策略</h3>\n<p></code>determine_recovery_strategy<code> 函数根据错误类型返回对应策略：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/error_handling.rs\" lines=\"48-72\"\n/// Determine the recovery strategy for a given error.\npub fn determine_recovery_strategy(error_type: &str, error_message: &str) -> RecoveryStrategy {\n    match error_type {\n        \"ipc_disconnect\" | \"connection_closed\" => RecoveryStrategy::RestartProcess,\n        \"state_sync_failed\" | \"patch_apply_failed\" => RecoveryStrategy::FullStateSync,\n        \"api_rate_limited\" | \"api_server_error\" => RecoveryStrategy::Retry {\n            max_attempts: 3,\n            initial_delay_ms: 1000,\n        },\n        \"api_auth_error\" | \"api_bad_request\" => {\n            RecoveryStrategy::Fatal(error_message.to_string())\n        }\n        \"mcp_disconnect\" => RecoveryStrategy::Retry {\n            max_attempts: 5,\n            initial_delay_ms: 2000,\n        },\n        \"tool_timeout\" => {\n            RecoveryStrategy::Fatal(format!(\"Tool timed out: {}\", error_message))\n        }\n        _ => RecoveryStrategy::Fatal(error_message.to_string()),\n    }\n}\n</code>`<code></p>\n<p><strong>关键决策点：</strong></p>\n<p>- <strong>IPC 断开</strong> → 重启进程，因为进程已不可用\n- <strong>API 限流</strong> → 重试 3 次，初始延迟 1 秒，指数退避\n- <strong>认证错误</strong> → 致命错误，需要用户检查 API Key\n- <strong>MCP 断开</strong> → 重试 5 次，给 MCP 服务器更多恢复时间</p>\n<h3>示例 3: 工具超时执行</h3>\n<p></code>execute_tool_with_timeout<code> 为工具执行添加超时保护：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/error_handling.rs\" lines=\"9-20\"\n/// Execute a tool with a timeout. Returns ToolError::Timeout if exceeded.\npub async fn execute_tool_with_timeout(\n    tool: &dyn Tool,\n    input: Value,\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n    timeout_ms: u64,\n) -> Result<ToolResult, ToolError> {\n    let duration = Duration::from_millis(timeout_ms);\n    match timeout(duration, tool.call(input, context, progress)).await {\n        Ok(result) => result,\n        Err(_) => Err(ToolError::Timeout(timeout_ms)),\n    }\n}\n</code>`<code></p>\n<p><strong>实现要点：</strong></p>\n<p>- 使用 </code>tokio::time::timeout<code> 包装异步调用\n- 超时后返回 </code>ToolError::Timeout<code> 而非 panic\n- 调用方可根据错误类型决定是否重试</p>\n<h3>示例 4: 流式块类型定义</h3>\n<p></code>StreamChunk<code> 表示流式输出的单个数据块：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/streaming_executor.rs\" lines=\"8-26\"\n/// A chunk of streaming output from a tool execution.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct StreamChunk {\n    /// Tool execution ID.\n    pub execution_id: String,\n    /// Tool name.\n    pub tool_name: String,\n    /// Chunk type.\n    pub chunk_type: StreamChunkType,\n    /// Text content.\n    pub content: String,\n    /// Sequence number (0-based).\n    pub seq: u32,\n    /// Timestamp.\n    pub timestamp: String,\n}</p>\n<p>#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum StreamChunkType {\n    Started,    // 工具开始执行\n    Progress,   // 中间进度\n    Stdout,     // 标准输出\n    Stderr,     // 标准错误\n    Completed,  // 执行完成\n    Error,      // 执行失败\n    Heartbeat,  // 心跳保活\n}\n</code>`<code></p>\n<h3>示例 5: 流式配置与默认值</h3>\n<p></code>StreamingConfig<code> 定义流式执行的可配置参数：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/streaming_executor.rs\" lines=\"28-55\"\n/// Configuration for streaming execution.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct StreamingConfig {\n    /// Maximum chunks to buffer (backpressure).\n    pub buffer_size: usize,\n    /// Heartbeat interval in milliseconds (0 = disabled).\n    pub heartbeat_interval_ms: u64,\n    /// Maximum execution time in seconds.\n    pub timeout_secs: u64,\n    /// Whether to stream stdout.\n    pub stream_stdout: bool,\n    /// Whether to stream stderr.\n    pub stream_stderr: bool,\n    /// Maximum output size in bytes (truncates beyond this).\n    pub max_output_bytes: usize,\n}</p>\n<p>impl Default for StreamingConfig {\n    fn default() -> Self {\n        Self {\n            buffer_size: 256,\n            heartbeat_interval_ms: 5000,\n            timeout_secs: 300,\n            stream_stdout: true,\n            stream_stderr: true,\n            max_output_bytes: 1024 * 1024, // 1MB\n        }\n    }\n}\n</code>`<code></p>\n<p><strong>默认配置说明：</strong></p>\n<p>- </code>buffer_size: 256<code> - 最多缓存 256 个块，防止内存爆炸\n- </code>heartbeat_interval_ms: 5000<code> - 每 5 秒发送心跳\n- </code>timeout_secs: 300<code> - 5 分钟超时\n- </code>max_output_bytes: 1MB<code> - 输出超过 1MB 自动截断</p>\n<h3>示例 6: StreamWriter 和 StreamReader</h3>\n<p>流式执行的写入端和读取端：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/streaming_executor.rs\" lines=\"101-163\"\n/// Write end of a streaming execution — used by tool implementations.\npub struct StreamWriter {\n    sender: mpsc::Sender<StreamChunk>,\n    execution_id: String,\n    seq_counter: u32,\n}</p>\n<p>impl StreamWriter {\n    /// Send a started event.\n    pub async fn started(&mut self, tool_name: &str) { /<em> ... </em>/ }</p>\n<p>    /// Send a progress update.\n    pub async fn progress(&mut self, message: &str) { /<em> ... </em>/ }</p>\n<p>    /// Send stdout data.\n    pub async fn stdout(&mut self, data: &str) { /<em> ... </em>/ }</p>\n<p>    /// Send stderr data.\n    pub async fn stderr(&mut self, data: &str) { /<em> ... </em>/ }</p>\n<p>    /// Send completion event.\n    pub async fn completed(&mut self) { /<em> ... </em>/ }</p>\n<p>    /// Send error event.\n    pub async fn error(&mut self, message: &str) { /<em> ... </em>/ }</p>\n<p>    /// Send heartbeat.\n    pub async fn heartbeat(&mut self) { /<em> ... </em>/ }\n}</p>\n<p>/// Handle for receiving streaming output from a tool execution.\npub struct StreamReader {\n    receiver: mpsc::Receiver<StreamChunk>,\n    execution_id: String,\n}</p>\n<p>impl StreamReader {\n    /// Receive the next chunk, waiting if necessary.\n    pub async fn next(&mut self) -> Option<StreamChunk> {\n        self.receiver.recv().await\n    }</p>\n<p>    /// Collect all remaining chunks into a single result.\n    pub async fn collect(mut self) -> StreamResult { /<em> ... </em>/ }\n}\n</code>`<code></p>\n<h3>示例 7: 创建流式执行对</h3>\n<p></code>create_stream_pair<code> 创建配对的写入器和读取器：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/streaming_executor.rs\" lines=\"91-99\"\n/// Creates a streaming execution pair (writer, reader).\npub fn create_stream_pair(execution_id: String) -> (StreamWriter, StreamReader) {\n    let (tx, rx) = mpsc::channel(256);\n    let writer = StreamWriter {\n        sender: tx,\n        execution_id: execution_id.clone(),\n        seq_counter: 0,\n    };\n    let reader = StreamReader {\n        receiver: rx,\n        execution_id,\n    };\n    (writer, reader)\n}\n</code>`<code></p>\n<h3>示例 8: PermissionGate 权限门控</h3>\n<p></code>PermissionGate<code> 管理待处理的权限请求：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/permissions/gate.rs\" lines=\"20-56\"\n/// User's permission decision sent from CLI\n#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]\n#[serde(tag = \"type\")]\npub enum PermissionDecision {\n    #[serde(rename = \"allow\")]\n    Allow,\n    #[serde(rename = \"deny\")]\n    Deny,\n    #[serde(rename = \"allow_always\")]\n    AllowAlways {\n        #[serde(skip_serializing_if = \"Option::is_none\")]\n        rule: Option<String>,\n    },\n}</p>\n<p>/// Permission decision channel — maintained in QueryEngine,\n/// used by ToolExecutor to wait for user responses.\n#[derive(Clone)]\npub struct PermissionGate {\n    pending: Arc<RwLock<HashMap<String, oneshot::Sender<PermissionDecision>>>>,\n}</p>\n<p>impl PermissionGate {\n    /// Register a pending permission request, returns a receiver to await the decision.\n    pub fn request(&self, tool_use_id: &str) -> oneshot::Receiver<PermissionDecision> {\n        let (tx, rx) = oneshot::channel();\n        self.pending\n            .write()\n            .unwrap()\n            .insert(tool_use_id.to_string(), tx);\n        rx\n    }</p>\n<p>    /// Submit a user's permission decision. Returns true if the decision was delivered.\n    pub fn respond(&self, tool_use_id: &str, decision: PermissionDecision) -> bool {\n        if let Some(tx) = self.pending.write().unwrap().remove(tool_use_id) {\n            tx.send(decision).is_ok()\n        } else {\n            false\n        }\n    }\n}\n</code>`<code></p>\n<p><strong>工作流程：</strong></p>\n<p>1. 工具执行前调用 </code>request(tool_use_id)<code> 获取 </code>Receiver<code>\n2. 向客户端发送权限请求事件\n3. 用户选择后，客户端调用 </code>respond(tool_use_id, decision)<code>\n4. 工具执行器通过 </code>Receiver<code> 获取决策，继续或拒绝执行</p>\n<h3>示例 9: PermissionManager 权限管理器</h3>\n<p></code>PermissionManager<code> 实现完整的权限检查逻辑：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/permissions/manager.rs\" lines=\"15-35\"\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum PermissionMode {\n    Default,            // 默认：询问用户\n    Plan,               // 计划模式：只读工具自动允许\n    BypassPermissions,  // 绕过模式：所有工具自动允许\n    Auto,               // 自动模式\n}</p>\n<p>#[derive(Clone, Debug, PartialEq)]\npub enum PermissionResult {\n    Allow,\n    Ask { message: String },\n    Deny { message: String },\n}</p>\n<p>pub struct PermissionManager {\n    context: RwLock<ToolPermissionContext>,\n}\n</code>`<code></p>\n<h3>示例 10: 权限检查流程</h3>\n<p></code>check_permission<code> 按优先级顺序评估权限：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/permissions/manager.rs\" lines=\"117-165\"\nimpl PermissionManager {\n    /// Check permission for a tool invocation.\n    ///\n    /// Evaluation order:\n    /// 1. Deny rules (highest priority)\n    /// 2. Allow rules\n    /// 3. Ask rules\n    /// 4. Mode-specific defaults\n    /// 5. Default: Ask\n    pub fn check_permission(\n        &self,\n        tool_name: &str,\n        input_description: Option<&str>,\n    ) -> PermissionResult {\n        let ctx = self.context.read().unwrap();</p>\n<p>        // Step 1: Check deny rules first (highest priority)\n        if find_matching_rule_in_map(&ctx.always_deny_rules, tool_name, input_description) {\n            return PermissionResult::Deny {\n                message: format!(\"Tool '{}' is denied by permission rules\", tool_name),\n            };\n        }</p>\n<p>        // Step 2: In BypassPermissions mode, allow all non-denied tools\n        if ctx.mode == PermissionMode::BypassPermissions {\n            return PermissionResult::Allow;\n        }</p>\n<p>        // Step 3: Check allow rules\n        if find_matching_rule_in_map(&ctx.always_allow_rules, tool_name, input_description) {\n            return PermissionResult::Allow;\n        }</p>\n<p>        // Step 4: Check ask rules\n        if find_matching_rule_in_map(&ctx.always_ask_rules, tool_name, input_description) {\n            return PermissionResult::Ask {\n                message: format!(\"Tool '{}' requires permission (matched ask rule)\", tool_name),\n            };\n        }</p>\n<p>        // Step 5: Plan mode - allow read-only tools, ask for others\n        if ctx.mode == PermissionMode::Plan {\n            if is_read_only_tool(tool_name) {\n                return PermissionResult::Allow;\n            }\n            return PermissionResult::Ask {\n                message: format!(\"Tool '{}' requires permission in Plan mode\", tool_name),\n            };\n        }</p>\n<p>        // Step 6: Default - Ask\n        PermissionResult::Ask {\n            message: format!(\"Tool '{}' requires permission\", tool_name),\n        }\n    }\n}\n</code>`<code></p>\n<h3>示例 11: Glob 模式匹配</h3>\n<p>权限规则支持 </code>*<code> 通配符：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/permissions/manager.rs\" lines=\"43-78\"\n/// Simple glob matching with </code>*<code> wildcard.\n/// </code>*<code> matches any sequence of characters (including empty).\nfn glob_matches(pattern: &str, text: &str) -> bool {\n    let pattern_bytes = pattern.as_bytes();\n    let text_bytes = text.as_bytes();\n    let p_len = pattern_bytes.len();\n    let t_len = text_bytes.len();</p>\n<p>    // DP approach: dp[i][j] = pattern[0..i] matches text[0..j]\n    let mut dp = vec![vec![false; t_len + 1]; p_len + 1];\n    dp[0][0] = true;</p>\n<p>    // Handle leading *s\n    for i in 1..=p_len {\n        if pattern_bytes[i - 1] == b'*' {\n            dp[i][0] = dp[i - 1][0];\n        }\n    }</p>\n<p>    for i in 1..=p_len {\n        for j in 1..=t_len {\n            if pattern_bytes[i - 1] == b'*' {\n                // * matches zero chars (dp[i-1][j]) or one more char (dp[i][j-1])\n                dp[i][j] = dp[i - 1][j] || dp[i][j - 1];\n            } else if pattern_bytes[i - 1].to_ascii_lowercase()\n                == text_bytes[j - 1].to_ascii_lowercase()\n            {\n                dp[i][j] = dp[i - 1][j - 1];\n            }\n        }\n    }</p>\n<p>    dp[p_len][t_len]\n}\n</code>`<code></p>\n<p><strong>匹配示例：</strong></p>\n<p>| 规则模式 | 输入描述 | 匹配结果 |\n|---------|---------|---------|\n| </code>git *<code> | </code>git push origin main<code> | ✅ 匹配 |\n| </code>git *<code> | </code>git status<code> | ✅ 匹配 |\n| </code>git *<code> | </code>npm install<code> | ❌ 不匹配 |\n| </code>*<code> | 任意字符串 | ✅ 匹配 |</p>\n<h3>常见错误示例</h3>\n<p>#### 错误示例 1：权限检查遗漏</p>\n<p></code>`<code>rust\n// ❌ 错误：直接执行工具，跳过权限检查\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    tool.call(input, context, progress).await\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：先检查权限\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    let permission = self.permission_manager.check_permission(\n        tool.name(),\n        Some(&tool.input_description()),\n    );\n    \n    match permission {\n        PermissionResult::Deny { message } => {\n            return Err(ToolError::PermissionDenied(message));\n        }\n        PermissionResult::Ask { message } => {\n            // 发送权限请求，等待用户响应\n            let decision = self.permission_gate.request(&tool.id).await?;\n            if matches!(decision, PermissionDecision::Deny) {\n                return Err(ToolError::PermissionDenied(\"User denied\".into()));\n            }\n        }\n        PermissionResult::Allow => {}\n    }\n    \n    tool.call(input, context, progress).await\n}\n</code>`<code></p>\n<p>#### 错误示例 2：流式输出缺少心跳</p>\n<p></code>`<code>rust\n// ❌ 错误：长时间运行无心跳，客户端可能超时\nasync fn long_running_task(&mut self, writer: &mut StreamWriter) {\n    for i in 0..1000 {\n        // 执行耗时操作\n        self.process_item(i).await;\n        writer.progress(&format!(\"处理中: {}/1000\", i)).await;\n    }\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：定期发送心跳\nasync fn long_running_task(&mut self, writer: &mut StreamWriter) {\n    let mut last_heartbeat = Instant::now();\n    \n    for i in 0..1000 {\n        self.process_item(i).await;\n        writer.progress(&format!(\"处理中: {}/1000\", i)).await;\n        \n        // 每 5 秒发送心跳\n        if last_heartbeat.elapsed() > Duration::from_secs(5) {\n            writer.heartbeat().await;\n            last_heartbeat = Instant::now();\n        }\n    }\n}\n</code>`<code></p>\n<p>#### 错误示例 3：错误恢复策略选择不当</p>\n<p></code>`<code>rust\n// ❌ 错误：认证错误不应该重试\nmatch error_type {\n    \"api_error\" => self.retry_with_backoff().await,\n    _ => self.report_fatal(error).await,\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：使用 determine_recovery_strategy\nlet strategy = determine_recovery_strategy(error_type, error_message);</p>\n<p>match strategy {\n    RecoveryStrategy::Retry { max_attempts, initial_delay_ms } => {\n        self.retry_with_backoff(max_attempts, initial_delay_ms).await\n    }\n    RecoveryStrategy::Fatal(msg) => {\n        self.report_fatal(msg).await\n    }\n    // ... 其他策略\n}\n</code>``</p>\n<p>---</p>\n","type":"implementation","progress":72},{"id":"05-production-slide-05","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">┌─────────────────────────────────────────────────┐\n│                 用户请求                         │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           权限控制层 (PermissionGate)            │\n│  • 检查工具是否允许执行                           │\n│  • 支持规则配置和交互确认                         │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           错误处理层 (ErrorHandling)             │\n│  • 捕获和分类错误                                 │\n│  • 选择恢复策略                                   │\n│  • 自动重试或优雅降级                             │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           流式输出层 (StreamingExecutor)          │\n│  • 实时进度推送                                   │\n│  • 心跳保活                                       │\n│  • 超时控制                                       │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n                 执行结果</code></pre>\n","type":"code","codeBlocks":[{"id":"code-1","language":"other","code":"┌─────────────────────────────────────────────────┐\n│                 用户请求                         │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           权限控制层 (PermissionGate)            │\n│  • 检查工具是否允许执行                           │\n│  • 支持规则配置和交互确认                         │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           错误处理层 (ErrorHandling)             │\n│  • 捕获和分类错误                                 │\n│  • 选择恢复策略                                   │\n│  • 自动重试或优雅降级                             │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n┌─────────────────────────────────────────────────┐\n│           流式输出层 (StreamingExecutor)          │\n│  • 实时进度推送                                   │\n│  • 心跳保活                                       │\n│  • 超时控制                                       │\n└───────────────────┬─────────────────────────────┘\n                    ▼\n                 执行结果"}],"progress":73},{"id":"05-production-slide-06","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-mermaid\"><code class=\"language-mermaid\">graph TD\n    A[工具调用请求] --&gt; B{检查 Deny 规则}\n    B --&gt;|匹配| C[拒绝执行]\n    B --&gt;|不匹配| D{Bypass 模式?}\n    D --&gt;|是| E[允许执行]\n    D --&gt;|否| F{检查 Allow 规则}\n    F --&gt;|匹配| E\n    F --&gt;|不匹配| G{检查 Ask 规则}\n    G --&gt;|匹配| H[请求用户确认]\n    G --&gt;|不匹配| I{Plan 模式?}\n    I --&gt;|是| J{只读工具?}\n    J --&gt;|是| E\n    J --&gt;|否| H\n    I --&gt;|否| H</code></pre>\n","type":"code","codeBlocks":[{"id":"code-2","language":"mermaid","code":"graph TD\n    A[工具调用请求] --> B{检查 Deny 规则}\n    B -->|匹配| C[拒绝执行]\n    B -->|不匹配| D{Bypass 模式?}\n    D -->|是| E[允许执行]\n    D -->|否| F{检查 Allow 规则}\n    F -->|匹配| E\n    F -->|不匹配| G{检查 Ask 规则}\n    G -->|匹配| H[请求用户确认]\n    G -->|不匹配| I{Plan 模式?}\n    I -->|是| J{只读工具?}\n    J -->|是| E\n    J -->|否| H\n    I -->|否| H"}],"progress":73},{"id":"05-production-slide-07","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-mermaid\"><code class=\"language-mermaid\">sequenceDiagram\n    participant Client as 客户端\n    participant Executor as StreamingExecutor\n    participant Tool as 工具进程\n    participant Channel as mpsc::Channel\n    \n    Client-&gt;&gt;Executor: execute_streaming(tool, cmd)\n    Executor-&gt;&gt;Channel: create_stream_pair()\n    Executor-&gt;&gt;Tool: spawn command\n    Tool--&gt;&gt;Channel: Started\n    Channel--&gt;&gt;Client: StreamChunk::Started\n    loop 执行中\n        Tool--&gt;&gt;Channel: Stdout/Progress\n        Channel--&gt;&gt;Client: StreamChunk\n    end\n    Tool--&gt;&gt;Channel: Completed/Error\n    Channel--&gt;&gt;Client: Final Chunk</code></pre>\n","type":"code","codeBlocks":[{"id":"code-3","language":"mermaid","code":"sequenceDiagram\n    participant Client as 客户端\n    participant Executor as StreamingExecutor\n    participant Tool as 工具进程\n    participant Channel as mpsc::Channel\n    \n    Client->>Executor: execute_streaming(tool, cmd)\n    Executor->>Channel: create_stream_pair()\n    Executor->>Tool: spawn command\n    Tool-->>Channel: Started\n    Channel-->>Client: StreamChunk::Started\n    loop 执行中\n        Tool-->>Channel: Stdout/Progress\n        Channel-->>Client: StreamChunk\n    end\n    Tool-->>Channel: Completed/Error\n    Channel-->>Client: Final Chunk"}],"progress":74},{"id":"05-production-slide-08","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: error_handling.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/error_handling.rs</span><span class=\"code-lines\">lines 36-45</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Error recovery strategy for different error types.\n#[derive(Clone, Debug)]\npub enum RecoveryStrategy {\n    /// Retry with exponential backoff\n    Retry {\n        max_attempts: u32,\n        initial_delay_ms: u64,\n    },\n    /// Request full state sync from Rust core\n    FullStateSync,\n    /// Restart the Rust core process\n    RestartProcess,\n    /// No recovery possible, report to user\n    Fatal(String),\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-4","language":"rust","code":"/// Error recovery strategy for different error types.\n#[derive(Clone, Debug)]\npub enum RecoveryStrategy {\n    /// Retry with exponential backoff\n    Retry {\n        max_attempts: u32,\n        initial_delay_ms: u64,\n    },\n    /// Request full state sync from Rust core\n    FullStateSync,\n    /// Restart the Rust core process\n    RestartProcess,\n    /// No recovery possible, report to user\n    Fatal(String),\n}","sourcePath":"baoclaw-core/src/engine/error_handling.rs","lineRange":{"start":36,"end":45}}],"progress":74},{"id":"05-production-slide-09","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: error_handling.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/error_handling.rs</span><span class=\"code-lines\">lines 48-72</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Determine the recovery strategy for a given error.\npub fn determine_recovery_strategy(error_type: &amp;str, error_message: &amp;str) -&gt; RecoveryStrategy {\n    match error_type {\n        &quot;ipc_disconnect&quot; | &quot;connection_closed&quot; =&gt; RecoveryStrategy::RestartProcess,\n        &quot;state_sync_failed&quot; | &quot;patch_apply_failed&quot; =&gt; RecoveryStrategy::FullStateSync,\n        &quot;api_rate_limited&quot; | &quot;api_server_error&quot; =&gt; RecoveryStrategy::Retry {\n            max_attempts: 3,\n            initial_delay_ms: 1000,\n        },\n        &quot;api_auth_error&quot; | &quot;api_bad_request&quot; =&gt; {\n            RecoveryStrategy::Fatal(error_message.to_string())\n        }\n        &quot;mcp_disconnect&quot; =&gt; RecoveryStrategy::Retry {\n            max_attempts: 5,\n            initial_delay_ms: 2000,\n        },\n        &quot;tool_timeout&quot; =&gt; {\n            RecoveryStrategy::Fatal(format!(&quot;Tool timed out: {}&quot;, error_message))\n        }\n        _ =&gt; RecoveryStrategy::Fatal(error_message.to_string()),\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-5","language":"rust","code":"/// Determine the recovery strategy for a given error.\npub fn determine_recovery_strategy(error_type: &str, error_message: &str) -> RecoveryStrategy {\n    match error_type {\n        \"ipc_disconnect\" | \"connection_closed\" => RecoveryStrategy::RestartProcess,\n        \"state_sync_failed\" | \"patch_apply_failed\" => RecoveryStrategy::FullStateSync,\n        \"api_rate_limited\" | \"api_server_error\" => RecoveryStrategy::Retry {\n            max_attempts: 3,\n            initial_delay_ms: 1000,\n        },\n        \"api_auth_error\" | \"api_bad_request\" => {\n            RecoveryStrategy::Fatal(error_message.to_string())\n        }\n        \"mcp_disconnect\" => RecoveryStrategy::Retry {\n            max_attempts: 5,\n            initial_delay_ms: 2000,\n        },\n        \"tool_timeout\" => {\n            RecoveryStrategy::Fatal(format!(\"Tool timed out: {}\", error_message))\n        }\n        _ => RecoveryStrategy::Fatal(error_message.to_string()),\n    }\n}","sourcePath":"baoclaw-core/src/engine/error_handling.rs","lineRange":{"start":48,"end":72}}],"progress":75},{"id":"05-production-slide-10","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: error_handling.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/error_handling.rs</span><span class=\"code-lines\">lines 9-20</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Execute a tool with a timeout. Returns ToolError::Timeout if exceeded.\npub async fn execute_tool_with_timeout(\n    tool: &amp;dyn Tool,\n    input: Value,\n    context: &amp;ToolContext,\n    progress: &amp;dyn ProgressSender,\n    timeout_ms: u64,\n) -&gt; Result&lt;ToolResult, ToolError&gt; {\n    let duration = Duration::from_millis(timeout_ms);\n    match timeout(duration, tool.call(input, context, progress)).await {\n        Ok(result) =&gt; result,\n        Err(_) =&gt; Err(ToolError::Timeout(timeout_ms)),\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-6","language":"rust","code":"/// Execute a tool with a timeout. Returns ToolError::Timeout if exceeded.\npub async fn execute_tool_with_timeout(\n    tool: &dyn Tool,\n    input: Value,\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n    timeout_ms: u64,\n) -> Result<ToolResult, ToolError> {\n    let duration = Duration::from_millis(timeout_ms);\n    match timeout(duration, tool.call(input, context, progress)).await {\n        Ok(result) => result,\n        Err(_) => Err(ToolError::Timeout(timeout_ms)),\n    }\n}","sourcePath":"baoclaw-core/src/engine/error_handling.rs","lineRange":{"start":9,"end":20}}],"progress":75},{"id":"05-production-slide-11","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: streaming_executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/streaming_executor.rs</span><span class=\"code-lines\">lines 8-26</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// A chunk of streaming output from a tool execution.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct StreamChunk {\n    /// Tool execution ID.\n    pub execution_id: String,\n    /// Tool name.\n    pub tool_name: String,\n    /// Chunk type.\n    pub chunk_type: StreamChunkType,\n    /// Text content.\n    pub content: String,\n    /// Sequence number (0-based).\n    pub seq: u32,\n    /// Timestamp.\n    pub timestamp: String,\n}\n\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum StreamChunkType {\n    Started,    // 工具开始执行\n    Progress,   // 中间进度\n    Stdout,     // 标准输出\n    Stderr,     // 标准错误\n    Completed,  // 执行完成\n    Error,      // 执行失败\n    Heartbeat,  // 心跳保活\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-7","language":"rust","code":"/// A chunk of streaming output from a tool execution.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct StreamChunk {\n    /// Tool execution ID.\n    pub execution_id: String,\n    /// Tool name.\n    pub tool_name: String,\n    /// Chunk type.\n    pub chunk_type: StreamChunkType,\n    /// Text content.\n    pub content: String,\n    /// Sequence number (0-b
