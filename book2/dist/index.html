  <!-- Data -->
  <script>window.BOOK_DATA = {"slides":[{"id":"01-fundamentals-slide-01","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"Agent 基础","content":"<div class=\"chapter-number\">Chapter 1</div>\n<h1>Agent 基础</h1>\n","type":"title","progress":0},{"id":"01-fundamentals-slide-02","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"问题","content":"<p><!-- Requirements: 5.1 描述该章节解决的实际工程问题 --></p>\n<p>在构建 AI 应用时，我们面临以下核心问题：</p>\n<h3>1. LLM 只能生成文本，无法执行操作</h3>\n<p>大语言模型（LLM）本质上是一个函数：输入文本，输出文本。它没有记忆、没有工具、没有自主行动的能力。</p>\n<p>``<code>\nLLM: text → text\n</code>`<code></p>\n<p>当你问它\"帮我创建一个文件\"，它只能告诉你怎么做，但不能真的去做。</p>\n<h3>2. 缺乏持续的状态管理</h3>\n<p>传统聊天机器人是一次性的输入输出，无法记住之前发生了什么。长时间的对话需要：\n- 保持对话历史\n- 理解项目上下文\n- 记住用户偏好</p>\n<h3>3. 难以集成外部系统</h3>\n<p>要让 AI 执行实际操作（读写文件、调用 API、运行命令），需要一套统一的接口来：\n- 注册和管理工具\n- 处理权限控制\n- 处理执行结果</p>\n<h3>问题背景</h3>\n<p>Agent 作为 LLM 的扩展，通过<strong>工具系统</strong>获得与外部世界交互的能力，通过<strong>记忆系统</strong>保持状态，通过<strong>ReAct 循环</strong>持续决策。</p>\n<p></code>`<code>\nAgent: 指令 → [思考 → 行动 → 观察]* → 结果\n</code>``</p>\n<p>---</p>\n","type":"problem","progress":1},{"id":"01-fundamentals-slide-03","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"模式","content":"<p><!-- Requirements: 5.2 讲解通用的设计模式或架构范式 --></p>\n<h3>核心设计模式：ReAct 循环</h3>\n<p>Agent 的核心设计模式是 <strong>ReAct 循环</strong>（Reasoning-Action-Observation）。</p>\n<p>#### 三个阶段</p>\n<p>| 阶段 | 英文 | 作用 | BaoClaw 实现 |\n|------|------|------|-------------|\n| 推理 | Reasoning | 分析当前状态，决定下一步行动 | LLM API 调用 |\n| 行动 | Action | 执行具体的工具调用 | Tool Executor |\n| 观察 | Observation | 获取执行结果并更新状态 | Message 追加 |</p>\n<p>#### 架构图</p>\n<p>``<code>mermaid\ngraph LR\n    A[用户输入] --> B[推理]\n    B --> C{需要工具?}\n    C -->|是| D[行动]\n    D --> E[观察]\n    E --> B\n    C -->|否| F[最终响应]\n</code>`<code></p>\n<p>#### 工作流程</p>\n<p></code>`<code>mermaid\nsequenceDiagram\n    participant User as 用户\n    participant Engine as QueryEngine\n    participant LLM as LLM API\n    participant Tool as Tool Executor\n    \n    User->>Engine: 发送请求\n    Engine->>LLM: 推理\n    LLM-->>Engine: 返回思考+工具调用\n    Engine->>Tool: 执行工具\n    Tool-->>Engine: 返回结果\n    Engine->>Engine: 观察：追加到消息历史\n    Engine->>LLM: 继续推理\n    LLM-->>Engine: 最终答案\n    Engine-->>User: 返回响应\n</code>`<code></p>\n<h3>Agent Harness 架构</h3>\n<p>Agent Harness（Agent 运行时框架）是承载 Agent 运行的基础设施：</p>\n<p></code>`<code>\n┌─────────────────────────────────────────────────┐\n│                   Clients                        │\n│  ┌──────────┐  ┌──────────────┐  ┌───────────┐ │\n│  │ Terminal  │  │   Telegram   │  │ Feishu    │ │\n│  │  CLI      │  │   Gateway    │  │ Gateway   │ │\n│  └─────┬────┘  └──────┬───────┘  └─────┬─────┘ │\n│        └───────────────┼───────────────┘        │\n│                        │ IPC (JSON-RPC / UDS)   │\n│                        ▼                        │\n│  ┌─────────────────────────────────────────────┐│\n│  │              Daemon (Rust)                   ││\n│  │  ┌─────────────────────────────────────┐    ││\n│  │  │         QueryEngine                  │    ││\n│  │  │  Messages ←→ LLM API ←→ Tools       │    ││\n│  │  └─────────────────────────────────────┘    ││\n│  └─────────────────────────────────────────────┘│\n└─────────────────────────────────────────────────┘\n</code>``</p>\n<p>---</p>\n","type":"pattern","progress":1},{"id":"01-fundamentals-slide-04","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"实现","content":"<p><!-- Requirements: 5.3 提供 BaoClaw 的 Rust 代码示例 --></p>\n<h3>示例 1: QueryEngine 核心结构</h3>\n<p>QueryEngine 是 BaoClaw 的核心组件，负责调用 LLM API、管理消息历史和执行工具。</p>\n<p>``<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"32-64\"\n/// Configuration for the QueryEngine.\npub struct QueryEngineConfig {\n    pub cwd: PathBuf,\n    pub tools: Vec<Arc<dyn Tool>>,\n    pub api_client: Arc<UnifiedClient>,\n    pub model: String,\n    pub thinking_config: ThinkingConfig,\n    pub max_turns: Option<u32>,\n    pub max_budget_usd: Option<f64>,\n    pub verbose: bool,\n    pub custom_system_prompt: Option<String>,\n    pub append_system_prompt: Option<String>,\n    pub session_id: Option<String>,\n    pub fallback_models: Vec<String>,\n    pub max_retries_per_model: u32,\n    /// Model context window (tokens). Default: 200_000 (Claude).\n    pub context_window: u64,\n    /// Auto-compact threshold as fraction of </code>context_window<code>. Default: 0.7.\n    pub auto_compact_threshold_ratio: f64,\n    // ... 其他字段\n}\n</code>`<code></p>\n<p><strong>代码说明:</strong></p>\n<p>- </code>tools: Vec<Arc<dyn Tool>><code> - 注册的工具列表，实现 Tool trait\n- </code>max_turns<code> - 最大迭代次数，防止无限循环\n- </code>context_window<code> - 上下文窗口大小，用于 token 计数和自动压缩\n- </code>thinking_config<code> - 思考模式配置（enabled/disabled/adaptive）</p>\n<h3>示例 2: EngineEvent 事件类型</h3>\n<p>EngineEvent 定义了 Agent 循环中产生的各种事件：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"77-130\"\n/// Events yielded by the QueryEngine during message processing.\n#[derive(Clone, Debug, Serialize, Deserialize)]\n#[serde(tag = \"type\")]\npub enum EngineEvent {\n    #[serde(rename = \"assistant_chunk\")]\n    AssistantChunk {\n        content: String,\n        #[serde(skip_serializing_if = \"Option::is_none\")]\n        tool_use_id: Option<String>,\n    },\n    #[serde(rename = \"thinking_chunk\")]\n    ThinkingChunk {\n        content: String,\n    },\n    #[serde(rename = \"tool_use\")]\n    ToolUse {\n        tool_name: String,\n        input: Value,\n        tool_use_id: String,\n    },\n    #[serde(rename = \"tool_result\")]\n    ToolResult {\n        tool_use_id: String,\n        output: Value,\n        is_error: bool,\n    },\n    // ... 其他事件类型\n}\n</code>`<code></p>\n<p><strong>事件流示例:</strong></p>\n<p></code>`<code>\n1. TurnStart { turn_id: 1 }\n2. AssistantChunk { content: \"让我先读取文件...\" }\n3. ToolUse { tool_name: \"FileRead\", input: {...}, tool_use_id: \"xxx\" }\n4. ToolResult { tool_use_id: \"xxx\", output: \"文件内容\", is_error: false }\n5. AssistantChunk { content: \"现在我来修改...\" }\n6. TurnEnd { turn_id: 1, tool_count: 1 }\n</code>`<code></p>\n<h3>示例 3: Tool Trait 定义</h3>\n<p>Tool trait 是所有工具必须实现的接口：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/tools/trait_def.rs\" lines=\"62-100\"\n/// The core Tool trait that all tools must implement\n#[async_trait]\npub trait Tool: Send + Sync {\n    /// The unique name of this tool\n    fn name(&self) -> &str;</p>\n<p>    /// Alternative names for this tool\n    fn aliases(&self) -> Vec<&str> {\n        vec![]\n    }</p>\n<p>    /// JSON Schema for the tool's input\n    fn input_schema(&self) -> JsonSchema;</p>\n<p>    /// Whether this tool only reads data (doesn't modify filesystem)\n    fn is_read_only(&self, _input: &Value) -> bool {\n        false\n    }</p>\n<p>    /// Whether this tool is destructive (e.g., deletes files)\n    fn is_destructive(&self, _input: &Value) -> bool {\n        false\n    }</p>\n<p>    /// Whether this tool can be safely executed concurrently with other tools\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        false\n    }</p>\n<p>    /// Execute the tool with the given input\n    async fn call(\n        &self,\n        input: Value,\n        context: &ToolContext,\n        progress: &dyn ProgressSender,\n    ) -> Result<ToolResult, ToolError>;</p>\n<p>    /// Get the system prompt contribution for this tool\n    fn prompt(&self) -> String;\n}\n</code>`<code></p>\n<p><strong>关键方法说明:</strong></p>\n<p>| 方法 | 作用 | 示例 |\n|------|------|------|\n| </code>name()<code> | 返回工具名称 | </code>\"FileRead\"<code> |\n| </code>input_schema()<code> | 返回输入 JSON Schema | </code>{\"type\": \"object\", \"properties\": {...}}<code> |\n| </code>is_read_only()<code> | 是否只读工具 | </code>FileRead<code> → true, </code>FileWrite<code> → false |\n| </code>is_concurrency_safe()<code> | 是否可并发执行 | </code>Glob<code> → true, </code>FileWrite<code> → false |\n| </code>call()<code> | 执行工具 | 读取文件、运行命令等 |</p>\n<h3>示例 4: 工具执行流程</h3>\n<p>工具执行器处理验证、权限检查和调用：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/tools/executor.rs\" lines=\"45-78\"\n/// Execute a single tool following the pipeline: validate → permissions → call\npub async fn execute_tool(\n    tool: &dyn Tool,\n    request: &ToolUseRequest,\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n) -> ToolExecutionResult {\n    let tool_name = tool.name().to_string();\n    let tool_use_id = request.id.clone();</p>\n<p>    // Step 1: Validate input\n    let validation = tool.validate_input(&request.input, context).await;\n    if let ValidationResult::Invalid { message, .. } = validation {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Validation error: {}\", message)),\n            is_error: true,\n        };\n    }</p>\n<p>    // Step 2: Check permissions\n    let permission = tool.check_permissions(&request.input, context).await;\n    if let ToolPermissionCheckResult::Deny { message } = permission {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Permission denied: {}\", message)),\n            is_error: true,\n        };\n    }</p>\n<p>    // Step 3: Call the tool with abort awareness\n    let call_result = tool.call(request.input.clone(), context, progress).await;\n    // ... 处理结果\n}\n</code>`<code></p>\n<h3>示例 5: 消息提交与循环入口</h3>\n<p>用户消息提交后进入 ReAct 循环：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"660-730\"\n    /// Submit a user message and process the response loop.\n    /// Returns a receiver that yields EngineEvent items.\n    pub async fn submit_message(\n        &mut self,\n        prompt: String,\n    ) -> mpsc::Receiver<EngineEvent> {\n        self.submit_message_with_attachments(prompt, None).await\n    }</p>\n<p>    pub async fn submit_message_with_attachments(\n        &mut self,\n        prompt: String,\n        attachments: Option<Vec<serde_json::Value>>,\n    ) -> mpsc::Receiver<EngineEvent> {\n        // Reset abort flag for the new query\n        let _ = self.abort_tx.send(false);</p>\n<p>        let (tx, rx) = mpsc::channel(256);</p>\n<p>        // Build user message content\n        let content = if let Some(att) = attachments {\n            // ... 处理多模态内容\n        } else {\n            Value::String(prompt)\n        };</p>\n<p>        // Build the user message and append to history\n        let user_msg = Message {\n            uuid: uuid::Uuid::new_v4().to_string(),\n            timestamp: chrono::Utc::now().to_rfc3339(),\n            content: MessageContent::User {\n                message: ApiUserMessage {\n                    role: \"user\".to_string(),\n                    content,\n                },\n                is_meta: false,\n                tool_use_result: None,\n            },\n        };\n        self.messages.push(user_msg);</p>\n<p>        // ... Token budget check, auto-compact, spawn query loop\n        // ...\n    }\n</code>`<code></p>\n<h3>示例 6: ReAct 循环核心实现</h3>\n<p></code>run_query_loop<code> 是 ReAct 循环的真正实现，展示了\"推理-行动-观察\"的迭代过程：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"950-1050\"\n/// The core query loop that calls the LLM, processes tool uses, and loops until done.\nasync fn run_query_loop(\n    messages: &mut Vec<Message>,\n    mut config: QueryLoopConfig,\n    tx: mpsc::Sender<EngineEvent>,\n) {\n    let start_time = std::time::Instant::now();\n    let mut turn_count = 0u32;\n    let mut total_usage = EMPTY_USAGE;</p>\n<p>    loop {\n        // 发送 TurnStart 事件\n        turn_id_counter += 1;\n        let _ = tx.send(EngineEvent::TurnStart {\n            turn_id: turn_id_counter,\n            parent_turn_id: config.parent_turn_id,\n            agent_label: config.agent_label.clone(),\n        }).await;</p>\n<p>        // === 推理阶段 ===\n        // 调用 LLM API，获取思考内容和工具调用请求\n        let request = build_api_request(&messages, &config);\n        let mut stream = config.api_client.create_message_stream(request).await;</p>\n<p>        // 处理 SSE 流事件，累积 content blocks\n        let mut assistant_content_blocks: Vec<ContentBlock> = Vec::new();\n        // ... 流式处理 LLM 响应</p>\n<p>        // === 行动阶段 ===\n        // 检查是否有工具调用\n        let tool_uses = extract_tool_uses(&assistant_content_blocks);</p>\n<p>        if tool_uses.is_empty() {\n            // 没有工具调用 → 查询完成\n            let _ = tx.send(EngineEvent::Result(QueryResult {\n                status: QueryStatus::Complete,\n                text: extract_text(&assistant_content_blocks),\n                // ...\n            })).await;\n            return;\n        }</p>\n<p>        // 执行工具\n        let tool_context = ToolContext {\n            cwd: config.cwd.clone(),\n            model: config.model.clone(),\n            abort_signal: Arc::new(config.abort_rx.clone()),\n            // ...\n        };\n        let tool_results = execute_tools(&config.tools, &tool_uses, &tool_context, &progress).await;</p>\n<p>        // === 观察阶段 ===\n        // 将工具结果追加到消息历史\n        let tool_result_msg = build_tool_result_message(&tool_results);\n        messages.push(tool_result_msg);</p>\n<p>        // 发送 TurnEnd 事件，继续下一轮循环\n        turn_count += 1;\n    }\n}\n</code>`<code></p>\n<p><strong>ReAct 循环的工作流程：</strong></p>\n<p>1. <strong>推理 (Reasoning)</strong>: 调用 LLM API，分析当前状态，产生思考内容和工具调用请求\n2. <strong>行动 (Action)</strong>: 如果有工具调用，执行工具（验证 → 权限检查 → 调用）\n3. <strong>观察 (Observation)</strong>: 将工具执行结果追加到消息历史，作为下一轮的输入\n4. <strong>循环</strong>: 如果 LLM 返回了工具调用，则回到步骤 1 继续推理；否则返回最终结果</p>\n<h3>常见错误示例</h3>\n<p>#### 错误示例 1：缺少超时控制</p>\n<p></code>`<code>rust\n// ❌ 错误：可能导致无限阻塞\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    self.run_tool(tool).await // 可能永远阻塞\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：添加超时控制\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    tokio::time::timeout(\n        self.config.tool_timeout,\n        self.run_tool(tool),\n    ).await?\n}\n</code>`<code></p>\n<p>#### 错误示例 2：忘记处理 abort 信号</p>\n<p></code>`<code>rust\n// ❌ 错误：长时间运行的工具无法被中断\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult> {\n    // 执行耗时操作...\n    let result = self.long_running_task().await;\n    Ok(result)\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：检查 abort 信号\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult> {\n    tokio::select! {\n        result = self.long_running_task() => Ok(result),\n        _ = await_abort(ctx.abort_signal.clone()) => {\n            Err(ToolError::Aborted)\n        }\n    }\n}\n</code>``</p>\n<p>---</p>\n","type":"implementation","progress":2},{"id":"01-fundamentals-slide-05","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">LLM: text → text</code></pre>\n","type":"code","codeBlocks":[{"id":"code-1","language":"other","code":"LLM: text → text"}],"progress":2},{"id":"01-fundamentals-slide-06","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">Agent: 指令 → [思考 → 行动 → 观察]* → 结果</code></pre>\n","type":"code","codeBlocks":[{"id":"code-2","language":"other","code":"Agent: 指令 → [思考 → 行动 → 观察]* → 结果"}],"progress":3},{"id":"01-fundamentals-slide-07","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-mermaid\"><code class=\"language-mermaid\">graph LR\n    A[用户输入] --&gt; B[推理]\n    B --&gt; C{需要工具?}\n    C --&gt;|是| D[行动]\n    D --&gt; E[观察]\n    E --&gt; B\n    C --&gt;|否| F[最终响应]</code></pre>\n","type":"code","codeBlocks":[{"id":"code-3","language":"mermaid","code":"graph LR\n    A[用户输入] --> B[推理]\n    B --> C{需要工具?}\n    C -->|是| D[行动]\n    D --> E[观察]\n    E --> B\n    C -->|否| F[最终响应]"}],"progress":3},{"id":"01-fundamentals-slide-08","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-mermaid\"><code class=\"language-mermaid\">sequenceDiagram\n    participant User as 用户\n    participant Engine as QueryEngine\n    participant LLM as LLM API\n    participant Tool as Tool Executor\n    \n    User-&gt;&gt;Engine: 发送请求\n    Engine-&gt;&gt;LLM: 推理\n    LLM--&gt;&gt;Engine: 返回思考+工具调用\n    Engine-&gt;&gt;Tool: 执行工具\n    Tool--&gt;&gt;Engine: 返回结果\n    Engine-&gt;&gt;Engine: 观察：追加到消息历史\n    Engine-&gt;&gt;LLM: 继续推理\n    LLM--&gt;&gt;Engine: 最终答案\n    Engine--&gt;&gt;User: 返回响应</code></pre>\n","type":"code","codeBlocks":[{"id":"code-4","language":"mermaid","code":"sequenceDiagram\n    participant User as 用户\n    participant Engine as QueryEngine\n    participant LLM as LLM API\n    participant Tool as Tool Executor\n    \n    User->>Engine: 发送请求\n    Engine->>LLM: 推理\n    LLM-->>Engine: 返回思考+工具调用\n    Engine->>Tool: 执行工具\n    Tool-->>Engine: 返回结果\n    Engine->>Engine: 观察：追加到消息历史\n    Engine->>LLM: 继续推理\n    LLM-->>Engine: 最终答案\n    Engine-->>User: 返回响应"}],"progress":4},{"id":"01-fundamentals-slide-09","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">┌─────────────────────────────────────────────────┐\n│                   Clients                        │\n│  ┌──────────┐  ┌──────────────┐  ┌───────────┐ │\n│  │ Terminal  │  │   Telegram   │  │ Feishu    │ │\n│  │  CLI      │  │   Gateway    │  │ Gateway   │ │\n│  └─────┬────┘  └──────┬───────┘  └─────┬─────┘ │\n│        └───────────────┼───────────────┘        │\n│                        │ IPC (JSON-RPC / UDS)   │\n│                        ▼                        │\n│  ┌─────────────────────────────────────────────┐│\n│  │              Daemon (Rust)                   ││\n│  │  ┌─────────────────────────────────────┐    ││\n│  │  │         QueryEngine                  │  append_system_prompt: Option&lt;String&gt;,\n    pub session_id: Option&lt;String&gt;,\n    pub fallback_models: Vec&lt;String&gt;,\n    pub max_retries_per_model: u32,\n    /// Model context window (tokens). Default: 200_000 (Claude).\n    pub context_window: u64,\n    /// Auto-compact threshold as fraction of `context_window`. Default: 0.7.\n    pub auto_compact_threshold_ratio: f64,\n    // ... 其他字段\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-6","language":"rust","code":"/// Configuration for the QueryEngine.\npub struct QueryEngineConfig {\n    pub cwd: PathBuf,\n    pub tools: Vec<Arc<dyn Tool>>,\n    pub api_client: Arc<UnifiedClient>,\n    pub model: String,\n    pub thinking_config: ThinkingConfig,\n    pub max_turns: Option<u32>,\n    pub max_budget_usd: Option<f64>,\n    pub verbose: bool,\n    pub custom_system_prompt: Option<String>,\n    pub append_system_prompt: Option<String>,\n    pub session_id: Option<String>,\n    pub fallback_models: Vec<String>,\n    pub max_retries_per_model: u32,\n    /// Model context window (tokens). Default: 200_000 (Claude).\n    pub context_window: u64,\n    /// Auto-compact threshold as fraction of `context_window`. Default: 0.7.\n    pub auto_compact_threshold_ratio: f64,\n    // ... 其他字段\n}","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":32,"end":64}}],"progress":5},{"id":"01-fundamentals-slide-11","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例: query_engine.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/query_engine.rs</span><span class=\"code-lines\">lines 77-130</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Events yielded by the QueryEngine during message processing.\n#[derive(Clone, Debug, Serialize, Deserialize)]\n#[serde(tag = &quot;type&quot;)]\npub enum EngineEvent {\n    #[serde(rename = &quot;assistant_chunk&quot;)]\n    AssistantChunk {\n        content: String,\n        #[serde(skip_serializing_if = &quot;Option::is_none&quot;)]\n        tool_use_id: Option&lt;String&gt;,\n    },\n    #[serde(rename = &quot;thinking_chunk&quot;)]\n    ThinkingChunk {\n        content: String,\n    },\n    #[serde(rename = &quot;tool_use&quot;)]\n    ToolUse {\n        tool_name: String,\n        input: Value,\n        tool_use_id: String,\n    },\n    #[serde(rename = &quot;tool_result&quot;)]\n    ToolResult {\n        tool_use_id: String,\n        output: Value,\n        is_error: bool,\n    },\n    // ... 其他事件类型\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-7","language":"rust","code":"/// Events yielded by the QueryEngine during message processing.\n#[derive(Clone, Debug, Serialize, Deserialize)]\n#[serde(tag = \"type\")]\npub enum EngineEvent {\n    #[serde(rename = \"assistant_chunk\")]\n    AssistantChunk {\n        content: String,\n        #[serde(skip_serializing_if = \"Option::is_none\")]\n        tool_use_id: Option<String>,\n    },\n    #[serde(rename = \"thinking_chunk\")]\n    ThinkingChunk {\n        content: String,\n    },\n    #[serde(rename = \"tool_use\")]\n    ToolUse {\n        tool_name: String,\n        input: Value,\n        tool_use_id: String,\n    },\n    #[serde(rename = \"tool_result\")]\n    ToolResult {\n        tool_use_id: String,\n        output: Value,\n        is_error: bool,\n    },\n    // ... 其他事件类型\n}","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":77,"end":130}}],"progress":5},{"id":"01-fundamentals-slide-12","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">1. TurnStart { turn_id: 1 }\n2. AssistantChunk { content: &quot;让我先读取文件...&quot; }\n3. ToolUse { tool_name: &quot;FileRead&quot;, input: {...}, tool_use_id: &quot;xxx&quot; }\n4. ToolResult { tool_use_id: &quot;xxx&quot;, output: &quot;文件内容&quot;, is_error: false }\n5. AssistantChunk { content: &quot;现在我来修改...&quot; }\n6. TurnEnd { turn_id: 1, tool_count: 1 }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-8","language":"other","code":"1. TurnStart { turn_id: 1 }\n2. AssistantChunk { content: \"让我先读取文件...\" }\n3. ToolUse { tool_name: \"FileRead\", input: {...}, tool_use_id: \"xxx\" }\n4. ToolResult { tool_use_id: \"xxx\", output: \"文件内容\", is_error: false }\n5. AssistantChunk { content: \"现在我来修改...\" }\n6. TurnEnd { turn_id: 1, tool_count: 1 }"}],"progress":6},{"id":"01-fundamentals-slide-13","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例: trait_def.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/tools/trait_def.rs</span><span class=\"code-lines\">lines 62-100</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// The core Tool trait that all tools must implement\n#[async_trait]\npub trait Tool: Send + Sync {\n    /// The unique name of this tool\n    fn name(&amp;self) -&gt; &amp;str;\n\n    /// Alternative names for this tool\n    fn aliases(&amp;self) -&gt; Vec&lt;&amp;str&gt; {\n        vec![]\n    }\n\n    /// JSON Schema for the tool&#39;s input\n    fn input_schema(&amp;self) -&gt; JsonSchema;\n\n    /// Whether this tool only reads data (doesn&#39;t modify filesystem)\n    fn is_read_only(&amp;self, _input: &amp;Value) -&gt; bool {\n        false\n    }\n\n    /// Whether this tool is destructive (e.g., deletes files)\n    fn is_destructive(&amp;self, _input: &amp;Value) -&gt; bool {\n        false\n    }\n\n    /// Whether this tool can be safely executed concurrently with other tools\n    fn is_concurrency_safe(&amp;self, _input: &amp;Value) -&gt; bool {\n        false\n    }\n\n    /// Execute the tool with the given input\n    async fn call(\n        &amp;self,\n        input: Value,\n        context: &amp;ToolContext,\n        progress: &amp;dyn ProgressSender,\n    ) -&gt; Result&lt;ToolResult, ToolError&gt;;\n\n    /// Get the system prompt contribution for this tool\n    fn prompt(&amp;self) -&gt; String;\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-9","language":"rust","code":"/// The core Tool trait that all tools must implement\n#[async_trait]\npub trait Tool: Send + Sync {\n    /// The unique name of this tool\n    fn name(&self) -> &str;\n\n    /// Alternative names for this tool\n    fn aliases(&self) -> Vec<&str> {\n        vec![]\n    }\n\n    /// JSON Schema for the tool's input\n    fn input_schema(&self) -> JsonSchema;\n\n    /// Whether this tool only reads data (doesn't modify filesystem)\n    fn is_read_only(&self, _input: &Value) -> bool {\n        false\n    }\n\n    /// Whether this tool is destructive (e.g., deletes files)\n    fn is_destructive(&self, _input: &Value) -> bool {\n        false\n    }\n\n    /// Whether this tool can be safely executed concurrently with other tools\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        false\n    }\n\n    /// Execute the tool with the given input\n    async fn call(\n        &self,\n        input: Value,\n        context: &ToolContext,\n        progress: &dyn ProgressSender,\n    ) -> Result<ToolResult, ToolError>;\n\n    /// Get the system prompt contribution for this tool\n    fn prompt(&self) -> String;\n}","sourcePath":"baoclaw-core/src/tools/trait_def.rs","lineRange":{"start":62,"end":100}}],"progress":6},{"id":"01-fundamentals-slide-14","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例: executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/tools/executor.rs</span><span class=\"code-lines\">lines 45-78</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Execute a single tool following the pipeline: validate → permissions → call\npub async fn execute_tool(\n    tool: &amp;dyn Tool,\n    request: &amp;ToolUseRequest,\n    context: &amp;ToolContext,\n    progress: &amp;dyn ProgressSender,\n) -&gt; ToolExecutionResult {\n    let tool_name = tool.name().to_string();\n    let tool_use_id = request.id.clone();\n\n    // Step 1: Validate input\n    let validation = tool.validate_input(&amp;request.input, context).await;\n    if let ValidationResult::Invalid { message, .. } = validation {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(&quot;Validation error: {}&quot;, message)),\n            is_error: true,\n        };\n    }\n\n    // Step 2: Check permissions\n    let permission = tool.check_permissions(&amp;request.input, context).await;\n    if let ToolPermissionCheckResult::Deny { message } = permission {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(&quot;Permission denied: {}&quot;, message)),\n            is_error: true,\n        };\n    }\n\n    // Step 3: Call the tool with abort awareness\n    let call_result = tool.call(request.input.clone(), context, progress).await;\n    // ... 处理结果\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-10","language":"rust","code":"/// Execute a single tool following the pipeline: validate → permissions → call\npub async fn execute_tool(\n    tool: &dyn Tool,\n    request: &ToolUseRequest,\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n) -> ToolExecutionResult {\n    let tool_name = tool.name().to_string();\n    let tool_use_id = request.id.clone();\n\n    // Step 1: Validate input\n    let validation = tool.validate_input(&request.input, context).await;\n    if let ValidationResult::Invalid { message, .. } = validation {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Validation error: {}\", message)),\n            is_error: true,\n        };\n    }\n\n    // Step 2: Check permissions\n    let permission = tool.check_permissions(&request.input, context).await;\n    if let ToolPermissionCheckResult::Deny { message } = permission {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Permission denied: {}\", message)),\n            is_error: true,\n        };\n    }\n\n    // Step 3: Call the tool with abort awareness\n    let call_result = tool.call(request.input.clone(), context, progress).await;\n    // ... 处理结果\n}","sourcePath":"baoclaw-core/src/tools/executor.rs","lineRange":{"start":45,"end":78}}],"progress":7},{"id":"01-fundamentals-slide-15","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例: query_engine.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/query_engine.rs</span><span class=\"code-lines\">lines 660-730</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Submit a user message and process the response loop.\n    /// Returns a receiver that yields EngineEvent items.\n    pub async fn submit_message(\n        &amp;mut self,\n        prompt: String,\n    ) -&gt; mpsc::Receiver&lt;EngineEvent&gt; {\n        self.submit_message_with_attachments(prompt, None).await\n    }\n\n    pub async fn submit_message_with_attachments(\n        &amp;mut self,\n        prompt: String,\n        attachments: Option&lt;Vec&lt;serde_json::Value&gt;&gt;,\n    ) -&gt; mpsc::Receiver&lt;EngineEvent&gt; {\n        // Reset abort flag for the new query\n        let _ = self.abort_tx.send(false);\n\n        let (tx, rx) = mpsc::channel(256);\n\n        // Build user message content\n        let content = if let Some(att) = attachments {\n            // ... 处理多模态内容\n        } else {\n            Value::String(prompt)\n        };\n\n        // Build the user message and append to history\n        let user_msg = Message {\n            uuid: uuid::Uuid::new_v4().to_string(),\n            timestamp: chrono::Utc::now().to_rfc3339(),\n            content: MessageContent::User {\n                message: ApiUserMessage {\n                    role: &quot;user&quot;.to_string(),\n                    content,\n                },\n                is_meta: false,\n                tool_use_result: None,\n            },\n        };\n        self.messages.push(user_msg);\n\n        // ... Token budget check, auto-compact, spawn query loop\n        // ...\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-11","language":"rust","code":"    /// Submit a user message and process the response loop.\n    /// Returns a receiver that yields EngineEvent items.\n    pub async fn submit_message(\n        &mut self,\n        prompt: String,\n    ) -> mpsc::Receiver<EngineEvent> {\n        self.submit_message_with_attachments(prompt, None).await\n    }\n\n    pub async fn submit_message_with_attachments(\n        &mut self,\n        prompt: String,\n        attachments: Option<Vec<serde_json::Value>>,\n    ) -> mpsc::Receiver<EngineEvent> {\n        // Reset abort flag for the new query\n        let _ = self.abort_tx.send(false);\n\n        let (tx, rx) = mpsc::channel(256);\n\n        // Build user message content\n        let content = if let Some(att) = attachments {\n            // ... 处理多模态内容\n        } else {\n            Value::String(prompt)\n        };\n\n        // Build the user message and append to history\n        let user_msg = Message {\n            uuid: uuid::Uuid::new_v4().to_string(),\n            timestamp: chrono::Utc::now().to_rfc3339(),\n            content: MessageContent::User {\n                message: ApiUserMessage {\n                    role: \"user\".to_string(),\n                    content,\n                },\n                is_meta: false,\n                tool_use_result: None,\n            },\n        };\n        self.messages.push(user_msg);\n\n        // ... Token budget check, auto-compact, spawn query loop\n        // ...\n    }","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":660,"end":730}}],"progress":7},{"id":"01-fundamentals-slide-16","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例: query_engine.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/query_engine.rs</span><span class=\"code-lines\">lines 950-1050</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// The core query loop that calls the LLM, processes tool uses, and loops until done.\nasync fn run_query_loop(\n    messages: &amp;mut Vec&lt;Message&gt;,\n    mut config: QueryLoopConfig,\n    tx: mpsc::Sender&lt;EngineEvent&gt;,\n) {\n    let start_time = std::time::Instant::now();\n    let mut turn_count = 0u32;\n    let mut total_usage = EMPTY_USAGE;\n\n    loop {\n        // 发送 TurnStart 事件\n        turn_id_counter += 1;\n        let _ = tx.send(EngineEvent::TurnStart {\n            turn_id: turn_id_counter,\n            parent_turn_id: config.parent_turn_id,\n            agent_label: config.agent_label.clone(),\n        }).await;\n\n        // === 推理阶段 ===\n        // 调用 LLM API，获取思考内容和工具调用请求\n        let request = build_api_request(&amp;messages, &amp;config);\n        let mut stream = config.api_client.create_message_stream(request).await;\n\n        // 处理 SSE 流事件，累积 content blocks\n        let mut assistant_content_blocks: Vec&lt;ContentBlock&gt; = Vec::new();\n        // ... 流式处理 LLM 响应\n\n        // === 行动阶段 ===\n        // 检查是否有工具调用\n        let tool_uses = extract_tool_uses(&amp;assistant_content_blocks);\n\n        if tool_uses.is_empty() {\n            // 没有工具调用 → 查询完成\n            let _ = tx.send(EngineEvent::Result(QueryResult {\n                status: QueryStatus::Complete,\n                text: extract_text(&amp;assistant_content_blocks),\n                // ...\n            })).await;\n            return;\n        }\n\n        // 执行工具\n        let tool_context = ToolContext {\n            cwd: config.cwd.clone(),\n            model: config.model.clone(),\n            abort_signal: Arc::new(config.abort_rx.clone()),\n            // ...\n        };\n        let tool_results = execute_tools(&amp;config.tools, &amp;tool_uses, &amp;tool_context, &amp;progress).await;\n\n        // === 观察阶段 ===\n        // 将工具结果追加到消息历史\n        let tool_result_msg = build_tool_result_message(&amp;tool_results);\n        messages.push(tool_result_msg);\n\n        // 发送 TurnEnd 事件，继续下一轮循环\n        turn_count += 1;\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-12","language":"rust","code":"/// The core query loop that calls the LLM, processes tool uses, and loops until done.\nasync fn run_query_loop(\n    messages: &mut Vec<Message>,\n    mut config: QueryLoopConfig,\n    tx: mpsc::Sender<EngineEvent>,\n) {\n    let start_time = std::time::Instant::now();\n    let mut turn_count = 0u32;\n    let mut total_usage = EMPTY_USAGE;\n\n    loop {\n        // 发送 TurnStart 事件\n        turn_id_counter += 1;\n        let _ = tx.send(EngineEvent::TurnStart {\n            turn_id: turn_id_counter,\n            parent_turn_id: config.parent_turn_id,\n            agent_label: config.agent_label.clone(),\n        }).await;\n\n        // === 推理阶段 ===\n        // 调用 LLM API，获取思考内容和工具调用请求\n        let request = build_api_request(&messages, &config);\n        let mut stream = config.api_client.create_message_stream(request).await;\n\n        // 处理 SSE 流事件，累积 content blocks\n        let mut assistant_content_blocks: Vec<ContentBlock> = Vec::new();\n        // ... 流式处理 LLM 响应\n\n        // === 行动阶段 ===\n        // 检查是否有工具调用\n        let tool_uses = extract_tool_uses(&assistant_content_blocks);\n\n        if tool_uses.is_empty() {\n            // 没有工具调用 → 查询完成\n            let _ = tx.send(EngineEvent::Result(QueryResult {\n                status: QueryStatus::Complete,\n                text: extract_text(&assistant_content_blocks),\n                // ...\n            })).await;\n            return;\n        }\n\n        // 执行工具\n        let tool_context = ToolContext {\n            cwd: config.cwd.clone(),\n            model: config.model.clone(),\n            abort_signal: Arc::new(config.abort_rx.clone()),\n            // ...\n        };\n        let tool_results = execute_tools(&config.tools, &tool_uses, &tool_context, &progress).await;\n\n        // === 观察阶段 ===\n        // 将工具结果追加到消息历史\n        let tool_result_msg = build_tool_result_message(&tool_results);\n        messages.push(tool_result_msg);\n\n        // 发送 TurnEnd 事件，继续下一轮循环\n        turn_count += 1;\n    }\n}","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":950,"end":1050}}],"progress":8},{"id":"01-fundamentals-slide-17","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：可能导致无限阻塞\nasync fn execute(&amp;self, tool: ToolCall) -&gt; Result&lt;ToolResult&gt; {\n    self.run_tool(tool).await // 可能永远阻塞\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-13","language":"rust","code":"// ❌ 错误：可能导致无限阻塞\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    self.run_tool(tool).await // 可能永远阻塞\n}"}],"progress":8},{"id":"01-fundamentals-slide-18","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：添加超时控制\nasync fn execute(&amp;self, tool: ToolCall) -&gt; Result&lt;ToolResult&gt; {\n    tokio::time::timeout(\n        self.config.tool_timeout,\n        self.run_tool(tool),\n    ).await?\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-14","language":"rust","code":"// ✅ 正确：添加超时控制\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    tokio::time::timeout(\n        self.config.tool_timeout,\n        self.run_tool(tool),\n    ).await?\n}"}],"progress":9},{"id":"01-fundamentals-slide-19","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：长时间运行的工具无法被中断\nasync fn call(&amp;self, input: Value, ctx: &amp;ToolContext) -&gt; Result&lt;ToolResult&gt; {\n    // 执行耗时操作...\n    let result = self.long_running_task().await;\n    Ok(result)\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-15","language":"rust","code":"// ❌ 错误：长时间运行的工具无法被中断\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult> {\n    // 执行耗时操作...\n    let result = self.long_running_task().await;\n    Ok(result)\n}"}],"progress":9},{"id":"01-fundamentals-slide-20","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：检查 abort 信号\nasync fn call(&amp;self, input: Value, ctx: &amp;ToolContext) -&gt; Result&lt;ToolResult&gt; {\n    tokio::select! {\n        result = self.long_running_task() =&gt; Ok(result),\n        _ = await_abort(ctx.abort_signal.clone()) =&gt; {\n            Err(ToolError::Aborted)\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-16","language":"rust","code":"// ✅ 正确：检查 abort 信号\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult> {\n    tokio::select! {\n        result = self.long_running_task() => Ok(result),\n        _ = await_abort(ctx.abort_signal.clone()) => {\n            Err(ToolError::Aborted)\n        }\n    }\n}"}],"progress":10},{"id":"01-fundamentals-slide-21","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">tools: Vec&lt;Arc&lt;dyn Tool&gt;&gt;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-17","language":"rust","code":"tools: Vec<Arc<dyn Tool>>"}],"progress":10},{"id":"01-fundamentals-slide-22","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"思考","content":"<p><!-- Requirements: 5.4 讨论替代方案与权衡决策 --></p>\n<h3>替代方案</h3>\n<p>#### 方案 A: 同步执行模型</p>\n<p>- <strong>优点:</strong> 实现简单，易于理解和调试\n- <strong>缺点:</strong> 效率低，无法处理并发请求，阻塞主线程\n- <strong>适用场景:</strong> 单用户、低并发场景</p>\n<p>#### 方案 B: 多线程模型</p>\n<p>- <strong>优点:</strong> 性能好，真正的并行执行\n- <strong>缺点:</strong> 实现复杂，需要处理线程安全问题，Rust 的 async 更轻量\n- <strong>适用场景:</strong> CPU 密集型任务</p>\n<p>#### 方案 C: 异步模型（Tokio）✓</p>\n<p>- <strong>优点:</strong> 高并发、资源高效、Rust 生态主流\n- <strong>缺点:</strong> 需要理解异步编程模型\n- <strong>适用场景:</strong> I/O 密集型、高并发场景（BaoClaw 选择）</p>\n<h3>权衡决策</h3>\n<p>| 决策点 | 选择 | 原因 | 影响 |\n|--------|------|------|------|\n| 异步模型 | Tokio | Rust 异步标准，生态成熟 | 高并发支持 |\n| 错误处理 | Result 类型 | 类型安全，强制处理错误 | 代码健壮性 |\n| 状态管理 | 内存 + 持久化 | 平衡性能和可靠性 | 支持恢复 |\n| 事件传递 | mpsc channel | 解耦组件，支持流式 | 实时响应 |\n| 工具接口 | Trait 对象 | 动态分发，插件化 | 扩展性 |</p>\n<h3>设计决策：为什么用 Trait 对象？</h3>\n<p>``<code>rust\ntools: Vec<Arc<dyn Tool>>\n</code>``</p>\n<p><strong>优点:</strong>\n- 动态分发：运行时决定调用哪个工具\n- 插件化：可以动态注册新工具（如 MCP 工具）\n- 统一接口：所有工具共享相同的调用方式</p>\n<p><strong>缺点:</strong>\n- 轻微性能开销（虚表查找）\n- 无法内联优化</p>\n<p><strong>结论:</strong> 对于 Agent 场景，工具调用的网络延迟远大于虚表开销，动态分发的灵活性更重要。</p>\n<p>---</p>\n","type":"reflection","progress":11},{"id":"01-fundamentals-slide-23","chapterId":"01-fundamentals","chapterTitle":"Agent 基础","title":"总结","content":"<p><!-- Requirements: 5.5 提供要点总结与延伸阅读链接 --></p>\n<h3>核心要点</h3>\n<p>- <strong>Agent 是 LLM 的扩展</strong>：具有推理、行动、记忆三个核心能力\n- <strong>ReAct 循环</strong>：推理-行动-观察的迭代过程，是 Agent 的核心决策模式\n- <strong>QueryEngine</strong>：BaoClaw 的核心组件，负责调用 LLM API、管理消息、执行工具\n- <strong>Tool Trait</strong>：统一的工具接口，支持验证、权限检查、并发控制\n- <strong>异步架构</strong>：Tokio 是 Rust 高并发 Agent 的首选</p>\n<h3>关键概念回顾</h3>\n<p>1. <strong>Agent Harness</strong>：承载 Agent 运行的基础设施，包括进程管理、IPC、工具注册等\n2. <strong>ReAct 循环</strong>：<code>思考 → 行动 → 观察</code> 的迭代决策模式\n3. <strong>Tool System</strong>：为 Agent 提供执行能力的组件，通过 <code>Tool trait</code> 定义统一接口\n4. <strong>EngineEvent</strong>：Agent 循环中产生的事件，用于流式输出和状态同步</p>\n<h3>延伸阅读</h3>\n<p>#### 官方资源</p>\n<p>- <a href=\"https://github.com/baoclaw/baoclaw\">BaoClaw GitHub</a> - 完整源码实现\n- <a href=\"./../../../baoclaw-core/src/engine/query_engine.rs\">QueryEngine 源码</a> - 核心引擎实现\n- <a href=\"./../../../baoclaw-core/src/tools/trait_def.rs\">Tool Trait 源码</a> - 工具接口定义</p>\n<p>#### 相关章节</p>\n<p>- <a href=\"./../02-core-implementation/\">下一章：工具系统详解</a> - 深入理解 Tool trait 和工具执行\n- <a href=\"./../03-memory-context/\">记忆与上下文</a> - 了解消息管理和上下文压缩</p>\n<p>#### 外部资源</p>\n<p>- <a href=\"https://rust-lang.github.io/async-book/\">Rust 异步编程</a> - 异步编程指南\n- <a href=\"https://tokio.rs/\">Tokio 文档</a> - 异步运行时参考\n- <a href=\"https://arxiv.org/abs/2210.03629\">ReAct 论文</a> - ReAct 模式原始论文\n</p>","type":"summary","progress":11},{"id":"02-core-implementation-slide-01","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"工具系统与扩展","content":"<div class=\"chapter-number\">Chapter 2</div>\n<h1>工具系统与扩展</h1>\n","type":"title","progress":12},{"id":"02-core-implementation-slide-02","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"问题","content":"<p><!-- Requirements: 5.1 描述该章节解决的实际工程问题 --></p>\n<p>在构建 Agent 时，我们面临以下核心问题：</p>\n<h3>1. 如何让 Agent 获得执行能力？</h3>\n<p>LLM 只能生成文本，无法直接操作文件系统、执行命令或调用外部 API。需要一套机制让 Agent 能够：</p>\n<p>- 读取和写入文件\n- 执行 Shell 命令\n- 搜索代码库\n- 访问网络资源</p>\n<h3>2. 如何支持动态扩展？</h3>\n<p>内置工具无法覆盖所有场景。用户可能需要：</p>\n<p>- 集成特定的 API 服务\n- 添加自定义的分析工具\n- 连接企业内部系统</p>\n<h3>3. 如何保证执行安全？</h3>\n<p>工具执行涉及敏感操作：</p>\n<p>- 文件修改可能破坏代码\n- Shell 命令可能有危险副作用\n- 网络请求可能泄露数据</p>\n<h3>4. 如何处理大规模结果？</h3>\n<p>工具执行可能产生大量输出：</p>\n<p>- 文件读取可能返回超大内容\n- 搜索结果可能有数千条\n- 大型 base64 编码的图像数据</p>\n<h3>问题背景</h3>\n<p>工具系统是 Agent 与外部世界交互的桥梁。一个设计良好的工具系统需要平衡<strong>灵活性</strong>（支持各种工具类型）、<strong>安全性</strong>（权限控制、危险操作防护）和<strong>性能</strong>（并发执行、结果处理）。</p>\n<p>---</p>\n","type":"problem","progress":12},{"id":"02-core-implementation-slide-03","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"模式","content":"<p><!-- Requirements: 5.2 讲解通用的设计模式或架构范式 --></p>\n<h3>核心设计模式：Trait-based Plugin Architecture</h3>\n<p>BaoClaw 的工具系统采用 <strong>Trait-based Plugin Architecture</strong>，核心是 <code>Tool</code> trait，所有工具（内置工具和 MCP 工具）都实现该 trait。</p>\n<p>#### 架构图</p>\n<p>``<code>\n┌─────────────────────────────────────────────────────────────┐\n│                      Tool System                             │\n│  ┌─────────────────┐                                        │\n│  │   Tool Trait    │  ← 核心抽象 (trait_def.rs)             │\n│  │  - name()       │                                        │\n│  │  - call()       │                                        │\n│  │  - validate()   │                                        │\n│  │  - prompt()     │                                        │\n│  └────────┬────────┘                                        │\n│           │                                                  │\n│  ┌────────┴────────┬─────────────────┐                     │\n│  │                 │                 │                      │\n│  ▼                 ▼                 ▼                      │\n│ Built-in Tools   MCP Tools        Agent Tools              │\n│ (Rust impl)      (McpToolWrapper)  (sub-agents)            │\n│  │                 │                 │                      │\n│  ├── BashTool     ├── [MCP Server  ├── AgentTool           │\n│  ├── FileRead     │   tools]       │   (creates sub-       │\n│  ├── FileWrite    └── McpToolWrapper  QueryEngine)         │\n│  ├── FileEdit         (adapts MCP                           │\n│  ├── Glob             to Tool trait)                        │\n│  ├── Grep                                                   │\n│  ├── WebFetch                                               │\n│  ├── WebSearch                                              │\n│  ├── SkillTool                                              │\n│  └── ...                                                    │\n└─────────────────────────────────────────────────────────────┘\n</code>`<code></p>\n<h3>执行管道模式</h3>\n<p>每个工具调用遵循固定管道：</p>\n<p></code>`<code>\nToolUseRequest\n      │\n      ▼\n┌─────────────┐\n│  validate   │  ← 验证输入参数\n└─────┬───────┘\n      │ Validation::Ok\n      ▼\n┌─────────────┐\n│ permissions │  ← 检查权限 (PermissionManager)\n└─────┬───────┘\n      │ Allow\n      ▼\n┌─────────────┐\n│    call     │  ← 执行工具 (tool.call())\n└─────┬───────┘\n      │ Result\n      ▼\n┌─────────────┐\n│   persist   │  ← 大结果持久化 (可选)\n└─────┬───────┘\n      │\n      ▼\nToolExecutionResult\n</code>`<code></p>\n<h3>并发优化策略</h3>\n<p>工具执行器会根据 </code>is_concurrency_safe()<code> 将工具分为两类：</p>\n<p></code>`<code>mermaid\ngraph LR\n    A[Tool Requests] --> B{Concurrency Safe?}\n    B -->|Yes| C[Parallel Execution]\n    B -->|No| D[Sequential Execution]\n    C --> E[join_all]\n    D --> F[One by One]\n    E --> G[Results]\n    F --> G\n</code>`<code></p>\n<h3>MCP 适配器模式</h3>\n<p>MCP (Model Context Protocol) 工具通过适配器模式集成：</p>\n<p></code>`<code>\n┌─────────────────────────────────────────────────────────────┐\n│                      MCP Client                              │\n│  ┌───────────────┐                                          │\n│  │  McpClient    │  ← MCP 客户端 (client.rs)                │\n│  │  - connect()  │                                          │\n│  │  - list_tools │                                          │\n│  │  - call_tool  │                                          │\n│  └───────┬───────┘                                          │\n│          │                                                   │\n│  ┌───────┴───────┐                                          │\n│  │ StdioTransport │  ← 进程间通信 (transport.rs)            │\n│  │  - spawn()    │                                          │\n│  │  - request()  │                                          │\n│  └───────────────┘                                          │\n│          │                                                   │\n│  ┌───────┴───────┐                                          │\n│  │ McpToolWrapper │  ← 适配 Tool trait (tool_wrapper.rs)    │\n│  └───────────────┘                                          │\n└─────────────────────────────────────────────────────────────┘\n</code>`<code></p>\n<h3>技能发现模式</h3>\n<p>Skills 和 Plugins 通过分层发现机制加载：</p>\n<p></code>`<code>\n┌─────────────────────────────────────────────────────────────┐\n│                  Discovery Hierarchy                         │\n│                                                              │\n│  ~/.baoclaw/                    ← User Level (全局)          │\n│  ├── skills/                                                │\n│  │   └── my-skill/SKILL.md                                  │\n│  ├── plugins/                                               │\n│  │   └── my-plugin/skills/...                               │\n│  └── mcp.json                  ← User MCP configs            │\n│                                                              │\n│  <project>/.baoclaw/            ← Project Level (项目)       │\n│  ├── skills/                                                │\n│  ├── plugins/                                               │\n│  ├── mcp.json                  ← Project MCP configs         │\n│  └── mcp.local.json            ← Local MCP (gitignored)      │\n│                                                              │\n└─────────────────────────────────────────────────────────────┘\n</code>``</p>\n<p>---</p>\n","type":"pattern","progress":13},{"id":"02-core-implementation-slide-04","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"实现","content":"<p><!-- Requirements: 5.3 提供 BaoClaw 的 Rust 代码示例 --></p>\n<h3>示例 1: Tool Trait 定义</h3>\n<p>Tool trait 是所有工具必须实现的核心接口。</p>\n<p>``<code>rust path=\"baoclaw-core/src/tools/trait_def.rs\" lines=\"49-124\"\n/// The core Tool trait that all tools must implement\n#[async_trait]\npub trait Tool: Send + Sync {\n    /// The unique name of this tool\n    fn name(&self) -> &str;</p>\n<p>    /// Alternative names for this tool\n    fn aliases(&self) -> Vec<&str> {\n        vec![]\n    }</p>\n<p>    /// JSON Schema for the tool's input\n    fn input_schema(&self) -> JsonSchema;</p>\n<p>    /// Whether this tool only reads data (doesn't modify filesystem)\n    fn is_read_only(&self, _input: &Value) -> bool {\n        false\n    }</p>\n<p>    /// Whether this tool is destructive (e.g., deletes files)\n    fn is_destructive(&self, _input: &Value) -> bool {\n        false\n    }</p>\n<p>    /// Whether this tool can be safely executed concurrently with other tools\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        false\n    }</p>\n<p>    /// Maximum result size in characters before persisting to disk\n    fn max_result_size_chars(&self) -> usize {\n        100_000\n    }</p>\n<p>    /// Execute the tool with the given input\n    async fn call(\n        &self,\n        input: Value,\n        context: &ToolContext,\n        progress: &dyn ProgressSender,\n    ) -> Result<ToolResult, ToolError>;</p>\n<p>    /// Validate the input before execution\n    async fn validate_input(\n        &self,\n        _input: &Value,\n        _context: &ToolContext,\n    ) -> ValidationResult {\n        ValidationResult::Ok\n    }</p>\n<p>    /// Tool-specific permission check\n    async fn check_permissions(\n        &self,\n        _input: &Value,\n        _context: &ToolContext,\n    ) -> ToolPermissionCheckResult {\n        ToolPermissionCheckResult::Ask {\n            message: format!(\"Tool '{}' requires permission\", self.name()),\n            updated_input: Value::Null,\n        }\n    }</p>\n<p>    /// Get the system prompt contribution for this tool\n    fn prompt(&self) -> String;</p>\n<p>    /// Whether this tool should be deferred (lazy-loaded) in the prompt.\n    fn is_deferred(&self) -> bool {\n        false\n    }\n}\n</code>`<code></p>\n<p><strong>关键方法说明:</strong></p>\n<p>| 方法 | 作用 | 默认值 |\n|------|------|--------|\n| </code>name()<code> | 返回工具名称 | 无（必须实现） |\n| </code>input_schema()<code> | 返回输入 JSON Schema | 无（必须实现） |\n| </code>call()<code> | 执行工具 | 无（必须实现） |\n| </code>prompt()<code> | 返回工具的 prompt 说明 | 无（必须实现） |\n| </code>is_read_only()<code> | 是否只读 | </code>false<code> |\n| </code>is_concurrency_safe()<code> | 是否可并发 | </code>false<code> |\n| </code>max_result_size_chars()<code> | 结果大小限制 | </code>100_000<code> |\n| </code>is_deferred()<code> | 是否延迟加载 | </code>false<code> |</p>\n<h3>示例 2: 工具执行器</h3>\n<p>执行器负责验证、权限检查和调用工具。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/tools/executor.rs\" lines=\"43-98\"\n/// Execute a single tool following the pipeline: validate → permissions → call\npub async fn execute_tool(\n    tool: &dyn Tool,\n    request: &ToolUseRequest,\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n) -> ToolExecutionResult {\n    let tool_name = tool.name().to_string();\n    let tool_use_id = request.id.clone();</p>\n<p>    // Step 1: Validate input\n    let validation = tool.validate_input(&request.input, context).await;\n    if let ValidationResult::Invalid { message, .. } = validation {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Validation error: {}\", message)),\n            is_error: true,\n        };\n    }</p>\n<p>    // Step 2: Check permissions\n    let permission = tool.check_permissions(&request.input, context).await;\n    if let ToolPermissionCheckResult::Deny { message } = permission {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Permission denied: {}\", message)),\n            is_error: true,\n        };\n    }</p>\n<p>    // Step 3: Call the tool with abort awareness\n    let abort_signal = context.abort_signal.clone();\n    let call_result = tokio::select! {\n        r = tool.call(request.input.clone(), context, progress) => r,\n        _ = async {\n            let mut rx = abort_signal.as_ref().clone();\n            loop {\n                if *rx.borrow() {\n                    break;\n                }\n                if rx.changed().await.is_err() {\n                    std::future::pending::<()>().await;\n                }\n            }\n        } => {\n            Err(ToolError::Aborted)\n        }\n    };\n    // ... 处理结果\n}\n</code>`<code></p>\n<h3>示例 3: 并发工具执行</h3>\n<p>多个工具调用时，执行器会自动优化并发：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/tools/executor.rs\" lines=\"191-263\"\n/// Execute multiple tools, running concurrency-safe tools in parallel\n/// and non-concurrency-safe tools sequentially.\npub async fn execute_tools(\n    tools: &[Arc<dyn Tool>],\n    requests: &[ToolUseRequest],\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n) -> Vec<ToolExecutionResult> {\n    if requests.is_empty() {\n        return vec![];\n    }</p>\n<p>    // Build (original_index, request, tool_ref) tuples\n    let mut concurrent: Vec<(usize, &ToolUseRequest, &Arc<dyn Tool>)> = Vec::new();\n    let mut sequential: Vec<(usize, &ToolUseRequest, &Arc<dyn Tool>)> = Vec::new();\n    let mut not_found: Vec<(usize, &ToolUseRequest)> = Vec::new();</p>\n<p>    for (idx, req) in requests.iter().enumerate() {\n        match find_tool(tools, &req.name) {\n            Some(tool) => {\n                if tool.is_concurrency_safe(&req.input) {\n                    concurrent.push((idx, req, tool));\n                } else {\n                    sequential.push((idx, req, tool));\n                }\n            }\n            None => {\n                not_found.push((idx, req));\n            }\n        }\n    }</p>\n<p>    let total = requests.len();\n    let mut results: Vec<Option<ToolExecutionResult>> = vec![None; total];</p>\n<p>    // Execute concurrent-safe tools in parallel\n    if !concurrent.is_empty() {\n        let futures: Vec<_> = concurrent\n            .iter()\n            .map(|(_, req, tool)| execute_tool(tool.as_ref(), req, context, progress))\n            .collect();\n        let concurrent_results = futures::future::join_all(futures).await;\n        for ((idx, _, _), result) in concurrent.iter().zip(concurrent_results) {\n            results[*idx] = Some(result);\n        }\n    }</p>\n<p>    // Execute sequential tools one by one\n    for (idx, req, tool) in &sequential {\n        let result = execute_tool(tool.as_ref(), req, context, progress).await;\n        results[*idx] = Some(result);\n    }</p>\n<p>    // ... 处理 not_found 和返回结果\n}\n</code>`<code></p>\n<h3>示例 4: MCP 客户端实现</h3>\n<p>MCP 客户端负责与外部 MCP 服务器通信：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/mcp/client.rs\" lines=\"61-92\"\npub struct McpClient {\n    config: McpServerConfig,\n    status: Arc<RwLock<McpConnectionStatus>>,\n    tools: Arc<RwLock<Vec<McpToolDef>>>,\n    transport: Option<Arc<RwLock<StdioTransport>>>,\n}</p>\n<p>impl McpClient {\n    /// Connect via stdio transport: spawn child process, handshake, refresh tools.\n    pub async fn connect_stdio(&mut self) -> Result<(), McpError> {\n        let transport = StdioTransport::spawn(\n            &self.config.command,\n            &self.config.args,\n            &self.config.env,\n        )\n        .await?;</p>\n<p>        self.transport = Some(Arc::new(RwLock::new(transport)));\n        *self.status.write().await = McpConnectionStatus::Connected;</p>\n<p>        self.refresh_tools().await?;\n        Ok(())\n    }\n}\n</code>`<code></p>\n<h3>示例 5: StdioTransport - JSON-RPC 通信</h3>\n<p>Transport 层负责底层的 JSON-RPC 通信：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/mcp/transport.rs\" lines=\"48-97\"\npub struct StdioTransport {\n    child: Child,\n    writer: BufWriter<ChildStdin>,\n    reader: BufReader<ChildStdout>,\n    next_id: u64,\n}</p>\n<p>impl StdioTransport {\n    /// Spawn a child process and perform MCP initialize handshake.\n    pub async fn spawn(\n        command: &str,\n        args: &[String],\n        env: &HashMap<String, String>,\n    ) -> Result<Self, McpError> {\n        let mut child = tokio::process::Command::new(command)\n            .args(args)\n            .envs(env)\n            .stdin(std::process::Stdio::piped())\n            .stdout(std::process::Stdio::piped())\n            .stderr(std::process::Stdio::piped())\n            .spawn()\n            .map_err(|e| McpError::ConnectionFailed(format!(\"Failed to spawn: {}\", e)))?;</p>\n<p>        // ... 建立连接</p>\n<p>        // MCP initialize handshake\n        let _init_result = transport\n            .request(\n                \"initialize\",\n                Some(serde_json::json!({\n                    \"protocolVersion\": \"2024-11-05\",\n                    \"capabilities\": {},\n                    \"clientInfo\": {\n                        \"name\": \"baoclaw\",\n                        \"version\": \"0.3.0\"\n                    }\n                })),\n            )\n            .await?;</p>\n<p>        // Send initialized notification\n        transport.notify(\"notifications/initialized\", None).await?;</p>\n<p>        Ok(transport)\n    }\n}\n</code>`<code></p>\n<h3>示例 6: McpToolWrapper - 适配 Tool Trait</h3>\n<p>McpToolWrapper 将 MCP 工具适配为 BaoClaw 的 Tool trait：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/mcp/tool_wrapper.rs\" lines=\"15-73\"\n/// Wraps an MCP server tool as a BaoClaw Tool trait implementation.\npub struct McpToolWrapper {\n    client: Arc<McpClient>,\n    tool_def: McpToolDef,\n    server_name: String,\n}</p>\n<p>#[async_trait]\nimpl Tool for McpToolWrapper {\n    fn name(&self) -> &str {\n        &self.tool_def.name\n    }</p>\n<p>    fn input_schema(&self) -> JsonSchema {\n        let schema = &self.tool_def.input_schema;\n        JsonSchema {\n            schema_type: schema[\"type\"].as_str().unwrap_or(\"object\").to_string(),\n            properties: schema.get(\"properties\").cloned(),\n            required: schema.get(\"required\").and_then(|v| {\n                v.as_array()\n                    .map(|arr| arr.iter().filter_map(|v| v.as_str().map(String::from)).collect())\n            }),\n            description: Some(self.tool_def.description.clone()),\n        }\n    }</p>\n<p>    async fn call(\n        &self,\n        input: Value,\n        _context: &ToolContext,\n        _progress: &dyn ProgressSender,\n    ) -> Result<ToolResult, ToolError> {\n        let result = self\n            .client\n            .call_tool(&self.tool_def.name, input)\n            .await\n            .map_err(|e| ToolError::ExecutionFailed(format!(\"MCP tool error: {}\", e)))?;</p>\n<p>        let is_error = result\n            .get(\"isError\")\n            .and_then(|v| v.as_bool())\n            .unwrap_or(false);</p>\n<p>        Ok(ToolResult {\n            data: result,\n            is_error,\n        })\n    }</p>\n<p>    fn prompt(&self) -> String {\n        format!(\"[MCP:{}] {}\", self.server_name, self.tool_def.description)\n    }</p>\n<p>    /// MCP tools can return large base64 images.\n    fn max_result_size_chars(&self) -> usize {\n        10_000_000\n    }\n}\n</code>`<code></p>\n<h3>示例 7: Skills 发现机制</h3>\n<p>Skills 通过文件系统发现并延迟加载：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/discovery/skills.rs\" lines=\"13-67\"\n/// A discovered skill\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SkillInfo {\n    pub name: String,\n    pub path: String,\n    pub source: String, // \"user\", \"project\", \"managed\"\n    pub description: Option<String>,\n}</p>\n<p>/// Scan for skills in standard directories relative to cwd and home.\n/// Directory format: skill-name/SKILL.md or skill-name.md\npub async fn discover_skills(cwd: &Path) -> Vec<SkillInfo> {\n    let mut skills = Vec::new();</p>\n<p>    // Project skills: <cwd>/.baoclaw/skills/\n    let skills_dir = cwd.join(\".baoclaw\").join(\"skills\");\n    if let Ok(entries) = scan_skills_dir(&skills_dir, \"project\").await {\n        skills.extend(entries);\n    }</p>\n<p>    // User skills: ~/.baoclaw/skills/\n    if let Some(home) = dirs_path() {\n        let user_skills = home.join(\".baoclaw\").join(\"skills\");\n        if let Ok(entries) = scan_skills_dir(&user_skills, \"user\").await {\n            skills.extend(entries);\n        }</p>\n<p>        // Plugin skills: scan ~/.baoclaw/plugins/*/skills/\n        let user_plugins = home.join(\".baoclaw\").join(\"plugins\");\n        if let Ok(plugin_skills) = scan_plugin_skills(&user_plugins).await {\n            skills.extend(plugin_skills);\n        }\n    }</p>\n<p>    skills\n}\n</code>`<code></p>\n<h3>示例 8: MCP 配置发现</h3>\n<p>MCP 服务器配置从多个位置加载：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/discovery/mcp_config.rs\" lines=\"40-69\"\n/// Discover all MCP server configurations from standard locations.\n/// Reads from:\n///   - ~/.claude/mcp.json (user scope)\n///   - .claude/mcp.json in cwd (project scope)\n///   - .claude/mcp.local.json in cwd (local scope, gitignored)\npub async fn discover_mcp_servers(cwd: &Path) -> Vec<McpServerInfo> {\n    let mut servers = Vec::new();</p>\n<p>    // User-level config: ~/.baoclaw/mcp.json\n    if let Some(home) = dirs_path() {\n        let user_config = home.join(\".baoclaw\").join(\"mcp.json\");\n        if let Ok(entries) = load_mcp_config(&user_config, \"user\").await {\n            servers.extend(entries);\n        }</p>\n<p>        // Plugin MCP configs: ~/.baoclaw/plugins/*/mcp.json\n        if let Ok(plugin_servers) = scan_plugin_mcp(&home.join(\".baoclaw\").join(\"plugins\")).await {\n            servers.extend(plugin_servers);\n        }\n    }</p>\n<p>    // Project-level config: <cwd>/.baoclaw/mcp.json\n    let project_config = cwd.join(\".baoclaw\").join(\"mcp.json\");\n    if let Ok(entries) = load_mcp_config(&project_config, \"project\").await {\n        servers.extend(entries);\n    }</p>\n<p>    // Local config (gitignored): <cwd>/.baoclaw/mcp.local.json\n    let local_config = cwd.join(\".baoclaw\").join(\"mcp.local.json\");\n    if let Ok(entries) = load_mcp_config(&local_config, \"local\").await {\n        servers.extend(entries);\n    }</p>\n<p>    servers\n}\n</code>`<code></p>\n<h3>示例 9: Plugins 发现</h3>\n<p>Plugins 是包含 skills、tools 和 MCP 配置的目录：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/discovery/plugins.rs\" lines=\"6-16\"\n/// A discovered plugin\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct PluginInfo {\n    pub name: String,\n    pub version: Option<String>,\n    pub description: Option<String>,\n    pub path: String,\n    pub source: String, // \"user\", \"project\"\n    pub has_tools: bool,\n    pub has_skills: bool,\n    pub has_mcp: bool,\n}\n</code>`<code></p>\n<h3>示例 10: 大结果持久化</h3>\n<p>工具执行器会自动处理大结果：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/tools/executor.rs\" lines=\"157-189\"\n/// Truncate result data if its serialized size exceeds max_size_chars.\nfn maybe_persist_or_truncate(data: Value, max_size_chars: usize, context: &ToolContext, tool_use_id: &str) -> Value {\n    let serialized = match serde_json::to_string(&data) {\n        Ok(s) => s,\n        Err(_) => return data,\n    };</p>\n<p>    // Under the size limit — no action needed\n    if serialized.len() <= max_size_chars {\n        return data;\n    }</p>\n<p>    // Try persisting via ToolResultStore\n    if let Some(ref store) = context.tool_result_store {\n        let content_str = match &data {\n            Value::String(s) => s.clone(),\n            other => serde_json::to_string(other).unwrap_or_default(),\n        };</p>\n<p>        if let Some(formatted) = store.persist_and_format(&content_str, tool_use_id) {\n            return Value::String(formatted);\n        }\n    }</p>\n<p>    // Fallback: truncate\n    let truncated: String = serialized.chars().take(max_size_chars).collect();\n    Value::String(format!(\n        \"{}\\n\\n[Result truncated: output exceeded {} characters]\",\n        truncated, max_size_chars\n    ))\n}\n</code>`<code></p>\n<h3>常见错误示例</h3>\n<p>#### 错误示例 1：工具未实现并发安全标记</p>\n<p></code>`<code>rust\n// ❌ 错误：只读工具应该标记为并发安全\nimpl Tool for MyReadTool {\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        false  // 实际是只读的，应该返回 true\n    }\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：只读工具标记为并发安全\nimpl Tool for MyReadTool {\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        true  // 只读操作可以并发执行\n    }\n}\n</code>`<code></p>\n<p>#### 错误示例 2：忘记处理 abort 信号</p>\n<p></code>`<code>rust\n// ❌ 错误：长时间运行的工具无法被中断\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult, ToolError> {\n    let result = self.long_running_task().await;\n    Ok(result)\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：检查 abort 信号\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult, ToolError> {\n    tokio::select! {\n        result = self.long_running_task() => Ok(result),\n        _ = async {\n            let mut rx = ctx.abort_signal.clone();\n            while !*rx.borrow() {\n                if rx.changed().await.is_err() {\n                    std::future::pending::<()>().await;\n                }\n            }\n        } => {\n            Err(ToolError::Aborted)\n        }\n    }\n}\n</code>`<code></p>\n<p>#### 错误示例 3：MCP 工具结果大小限制太小</p>\n<p></code>`<code>rust\n// ❌ 错误：默认的 100K 限制对图像太小\nimpl Tool for MyScreenshotTool {\n    // 默认 max_result_size_chars() 返回 100_000\n}\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：提高限制以支持 base64 图像\nimpl Tool for MyScreenshotTool {\n    fn max_result_size_chars(&self) -> usize {\n        10_000_000  // 10MB\n    }\n}\n</code>``</p>\n<p>---</p>\n","type":"implementation","progress":13},{"id":"02-core-implementation-slide-05","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">┌─────────────────────────────────────────────────────────────┐\n│                      Tool System                             │\n│  ┌─────────────────┐                                        │\n│  │   Tool Trait    │  ← 核心抽象 (trait_def.rs)             │\n│  │  -
