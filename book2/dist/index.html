       │\n│                                                              │\n│  <project>/.baoclaw/            ← Project Level (项目)       │\n│  ├── skills/                                                │\n│  ├── plugins/                                               │\n│  ├── mcp.json                  ← Project MCP configs         │\n│  └── mcp.local.json            ← Local MCP (gitignored)      │\n│                                                              │\n└─────────────────────────────────────────────────────────────┘"}],"progress":16},{"id":"02-core-implementation-slide-10","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: trait_def.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/tools/trait_def.rs</span><span class=\"code-lines\">lines 49-124</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// The core Tool trait that all tools must implement\n#[async_trait]\npub trait Tool: Send + Sync {\n    /// The unique name of this tool\n    fn name(&amp;self) -&gt; &amp;str;\n\n    /// Alternative names for this tool\n    fn aliases(&amp;self) -&gt; Vec&lt;&amp;str&gt; {\n        vec![]\n    }\n\n    /// JSON Schema for the tool&#39;s input\n    fn input_schema(&amp;self) -&gt; JsonSchema;\n\n    /// Whether this tool only reads data (doesn&#39;t modify filesystem)\n    fn is_read_only(&amp;self, _input: &amp;Value) -&gt; bool {\n        false\n    }\n\n    /// Whether this tool is destructive (e.g., deletes files)\n    fn is_destructive(&amp;self, _input: &amp;Value) -&gt; bool {\n        false\n    }\n\n    /// Whether this tool can be safely executed concurrently with other tools\n    fn is_concurrency_safe(&amp;self, _input: &amp;Value) -&gt; bool {\n        false\n    }\n\n    /// Maximum result size in characters before persisting to disk\n    fn max_result_size_chars(&amp;self) -&gt; usize {\n        100_000\n    }\n\n    /// Execute the tool with the given input\n    async fn call(\n        &amp;self,\n        input: Value,\n        context: &amp;ToolContext,\n        progress: &amp;dyn ProgressSender,\n    ) -&gt; Result&lt;ToolResult, ToolError&gt;;\n\n    /// Validate the input before execution\n    async fn validate_input(\n        &amp;self,\n        _input: &amp;Value,\n        _context: &amp;ToolContext,\n    ) -&gt; ValidationResult {\n        ValidationResult::Ok\n    }\n\n    /// Tool-specific permission check\n    async fn check_permissions(\n        &amp;self,\n        _input: &amp;Value,\n        _context: &amp;ToolContext,\n    ) -&gt; ToolPermissionCheckResult {\n        ToolPermissionCheckResult::Ask {\n            message: format!(&quot;Tool &#39;{}&#39; requires permission&quot;, self.name()),\n            updated_input: Value::Null,\n        }\n    }\n\n    /// Get the system prompt contribution for this tool\n    fn prompt(&amp;self) -&gt; String;\n\n    /// Whether this tool should be deferred (lazy-loaded) in the prompt.\n    fn is_deferred(&amp;self) -&gt; bool {\n        false\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-6","language":"rust","code":"/// The core Tool trait that all tools must implement\n#[async_trait]\npub trait Tool: Send + Sync {\n    /// The unique name of this tool\n    fn name(&self) -> &str;\n\n    /// Alternative names for this tool\n    fn aliases(&self) -> Vec<&str> {\n        vec![]\n    }\n\n    /// JSON Schema for the tool's input\n    fn input_schema(&self) -> JsonSchema;\n\n    /// Whether this tool only reads data (doesn't modify filesystem)\n    fn is_read_only(&self, _input: &Value) -> bool {\n        false\n    }\n\n    /// Whether this tool is destructive (e.g., deletes files)\n    fn is_destructive(&self, _input: &Value) -> bool {\n        false\n    }\n\n    /// Whether this tool can be safely executed concurrently with other tools\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        false\n    }\n\n    /// Maximum result size in characters before persisting to disk\n    fn max_result_size_chars(&self) -> usize {\n        100_000\n    }\n\n    /// Execute the tool with the given input\n    async fn call(\n        &self,\n        input: Value,\n        context: &ToolContext,\n        progress: &dyn ProgressSender,\n    ) -> Result<ToolResult, ToolError>;\n\n    /// Validate the input before execution\n    async fn validate_input(\n        &self,\n        _input: &Value,\n        _context: &ToolContext,\n    ) -> ValidationResult {\n        ValidationResult::Ok\n    }\n\n    /// Tool-specific permission check\n    async fn check_permissions(\n        &self,\n        _input: &Value,\n        _context: &ToolContext,\n    ) -> ToolPermissionCheckResult {\n        ToolPermissionCheckResult::Ask {\n            message: format!(\"Tool '{}' requires permission\", self.name()),\n            updated_input: Value::Null,\n        }\n    }\n\n    /// Get the system prompt contribution for this tool\n    fn prompt(&self) -> String;\n\n    /// Whether this tool should be deferred (lazy-loaded) in the prompt.\n    fn is_deferred(&self) -> bool {\n        false\n    }\n}","sourcePath":"baoclaw-core/src/tools/trait_def.rs","lineRange":{"start":49,"end":124}}],"progress":16},{"id":"02-core-implementation-slide-11","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/tools/executor.rs</span><span class=\"code-lines\">lines 43-98</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Execute a single tool following the pipeline: validate → permissions → call\npub async fn execute_tool(\n    tool: &amp;dyn Tool,\n    request: &amp;ToolUseRequest,\n    context: &amp;ToolContext,\n    progress: &amp;dyn ProgressSender,\n) -&gt; ToolExecutionResult {\n    let tool_name = tool.name().to_string();\n    let tool_use_id = request.id.clone();\n\n    // Step 1: Validate input\n    let validation = tool.validate_input(&amp;request.input, context).await;\n    if let ValidationResult::Invalid { message, .. } = validation {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(&quot;Validation error: {}&quot;, message)),\n            is_error: true,\n        };\n    }\n\n    // Step 2: Check permissions\n    let permission = tool.check_permissions(&amp;request.input, context).await;\n    if let ToolPermissionCheckResult::Deny { message } = permission {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(&quot;Permission denied: {}&quot;, message)),\n            is_error: true,\n        };\n    }\n\n    // Step 3: Call the tool with abort awareness\n    let abort_signal = context.abort_signal.clone();\n    let call_result = tokio::select! {\n        r = tool.call(request.input.clone(), context, progress) =&gt; r,\n        _ = async {\n            let mut rx = abort_signal.as_ref().clone();\n            loop {\n                if *rx.borrow() {\n                    break;\n                }\n                if rx.changed().await.is_err() {\n                    std::future::pending::&lt;()&gt;().await;\n                }\n            }\n        } =&gt; {\n            Err(ToolError::Aborted)\n        }\n    };\n    // ... 处理结果\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-7","language":"rust","code":"/// Execute a single tool following the pipeline: validate → permissions → call\npub async fn execute_tool(\n    tool: &dyn Tool,\n    request: &ToolUseRequest,\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n) -> ToolExecutionResult {\n    let tool_name = tool.name().to_string();\n    let tool_use_id = request.id.clone();\n\n    // Step 1: Validate input\n    let validation = tool.validate_input(&request.input, context).await;\n    if let ValidationResult::Invalid { message, .. } = validation {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Validation error: {}\", message)),\n            is_error: true,\n        };\n    }\n\n    // Step 2: Check permissions\n    let permission = tool.check_permissions(&request.input, context).await;\n    if let ToolPermissionCheckResult::Deny { message } = permission {\n        return ToolExecutionResult {\n            tool_use_id,\n            tool_name,\n            output: Value::String(format!(\"Permission denied: {}\", message)),\n            is_error: true,\n        };\n    }\n\n    // Step 3: Call the tool with abort awareness\n    let abort_signal = context.abort_signal.clone();\n    let call_result = tokio::select! {\n        r = tool.call(request.input.clone(), context, progress) => r,\n        _ = async {\n            let mut rx = abort_signal.as_ref().clone();\n            loop {\n                if *rx.borrow() {\n                    break;\n                }\n                if rx.changed().await.is_err() {\n                    std::future::pending::<()>().await;\n                }\n            }\n        } => {\n            Err(ToolError::Aborted)\n        }\n    };\n    // ... 处理结果\n}","sourcePath":"baoclaw-core/src/tools/executor.rs","lineRange":{"start":43,"end":98}}],"progress":17},{"id":"02-core-implementation-slide-12","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/tools/executor.rs</span><span class=\"code-lines\">lines 191-263</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Execute multiple tools, running concurrency-safe tools in parallel\n/// and non-concurrency-safe tools sequentially.\npub async fn execute_tools(\n    tools: &amp;[Arc&lt;dyn Tool&gt;],\n    requests: &amp;[ToolUseRequest],\n    context: &amp;ToolContext,\n    progress: &amp;dyn ProgressSender,\n) -&gt; Vec&lt;ToolExecutionResult&gt; {\n    if requests.is_empty() {\n        return vec![];\n    }\n\n    // Build (original_index, request, tool_ref) tuples\n    let mut concurrent: Vec&lt;(usize, &amp;ToolUseRequest, &amp;Arc&lt;dyn Tool&gt;)&gt; = Vec::new();\n    let mut sequential: Vec&lt;(usize, &amp;ToolUseRequest, &amp;Arc&lt;dyn Tool&gt;)&gt; = Vec::new();\n    let mut not_found: Vec&lt;(usize, &amp;ToolUseRequest)&gt; = Vec::new();\n\n    for (idx, req) in requests.iter().enumerate() {\n        match find_tool(tools, &amp;req.name) {\n            Some(tool) =&gt; {\n                if tool.is_concurrency_safe(&amp;req.input) {\n                    concurrent.push((idx, req, tool));\n                } else {\n                    sequential.push((idx, req, tool));\n                }\n            }\n            None =&gt; {\n                not_found.push((idx, req));\n            }\n        }\n    }\n\n    let total = requests.len();\n    let mut results: Vec&lt;Option&lt;ToolExecutionResult&gt;&gt; = vec![None; total];\n\n    // Execute concurrent-safe tools in parallel\n    if !concurrent.is_empty() {\n        let futures: Vec&lt;_&gt; = concurrent\n            .iter()\n            .map(|(_, req, tool)| execute_tool(tool.as_ref(), req, context, progress))\n            .collect();\n        let concurrent_results = futures::future::join_all(futures).await;\n        for ((idx, _, _), result) in concurrent.iter().zip(concurrent_results) {\n            results[*idx] = Some(result);\n        }\n    }\n\n    // Execute sequential tools one by one\n    for (idx, req, tool) in &amp;sequential {\n        let result = execute_tool(tool.as_ref(), req, context, progress).await;\n        results[*idx] = Some(result);\n    }\n\n    // ... 处理 not_found 和返回结果\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-8","language":"rust","code":"/// Execute multiple tools, running concurrency-safe tools in parallel\n/// and non-concurrency-safe tools sequentially.\npub async fn execute_tools(\n    tools: &[Arc<dyn Tool>],\n    requests: &[ToolUseRequest],\n    context: &ToolContext,\n    progress: &dyn ProgressSender,\n) -> Vec<ToolExecutionResult> {\n    if requests.is_empty() {\n        return vec![];\n    }\n\n    // Build (original_index, request, tool_ref) tuples\n    let mut concurrent: Vec<(usize, &ToolUseRequest, &Arc<dyn Tool>)> = Vec::new();\n    let mut sequential: Vec<(usize, &ToolUseRequest, &Arc<dyn Tool>)> = Vec::new();\n    let mut not_found: Vec<(usize, &ToolUseRequest)> = Vec::new();\n\n    for (idx, req) in requests.iter().enumerate() {\n        match find_tool(tools, &req.name) {\n            Some(tool) => {\n                if tool.is_concurrency_safe(&req.input) {\n                    concurrent.push((idx, req, tool));\n                } else {\n                    sequential.push((idx, req, tool));\n                }\n            }\n            None => {\n                not_found.push((idx, req));\n            }\n        }\n    }\n\n    let total = requests.len();\n    let mut results: Vec<Option<ToolExecutionResult>> = vec![None; total];\n\n    // Execute concurrent-safe tools in parallel\n    if !concurrent.is_empty() {\n        let futures: Vec<_> = concurrent\n            .iter()\n            .map(|(_, req, tool)| execute_tool(tool.as_ref(), req, context, progress))\n            .collect();\n        let concurrent_results = futures::future::join_all(futures).await;\n        for ((idx, _, _), result) in concurrent.iter().zip(concurrent_results) {\n            results[*idx] = Some(result);\n        }\n    }\n\n    // Execute sequential tools one by one\n    for (idx, req, tool) in &sequential {\n        let result = execute_tool(tool.as_ref(), req, context, progress).await;\n        results[*idx] = Some(result);\n    }\n\n    // ... 处理 not_found 和返回结果\n}","sourcePath":"baoclaw-core/src/tools/executor.rs","lineRange":{"start":191,"end":263}}],"progress":18},{"id":"02-core-implementation-slide-13","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: client.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/mcp/client.rs</span><span class=\"code-lines\">lines 61-92</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">pub struct McpClient {\n    config: McpServerConfig,\n    status: Arc&lt;RwLock&lt;McpConnectionStatus&gt;&gt;,\n    tools: Arc&lt;RwLock&lt;Vec&lt;McpToolDef&gt;&gt;&gt;,\n    transport: Option&lt;Arc&lt;RwLock&lt;StdioTransport&gt;&gt;&gt;,\n}\n\nimpl McpClient {\n    /// Connect via stdio transport: spawn child process, handshake, refresh tools.\n    pub async fn connect_stdio(&amp;mut self) -&gt; Result&lt;(), McpError&gt; {\n        let transport = StdioTransport::spawn(\n            &amp;self.config.command,\n            &amp;self.config.args,\n            &amp;self.config.env,\n        )\n        .await?;\n\n        self.transport = Some(Arc::new(RwLock::new(transport)));\n        *self.status.write().await = McpConnectionStatus::Connected;\n\n        self.refresh_tools().await?;\n        Ok(())\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-9","language":"rust","code":"pub struct McpClient {\n    config: McpServerConfig,\n    status: Arc<RwLock<McpConnectionStatus>>,\n    tools: Arc<RwLock<Vec<McpToolDef>>>,\n    transport: Option<Arc<RwLock<StdioTransport>>>,\n}\n\nimpl McpClient {\n    /// Connect via stdio transport: spawn child process, handshake, refresh tools.\n    pub async fn connect_stdio(&mut self) -> Result<(), McpError> {\n        let transport = StdioTransport::spawn(\n            &self.config.command,\n            &self.config.args,\n            &self.config.env,\n        )\n        .await?;\n\n        self.transport = Some(Arc::new(RwLock::new(transport)));\n        *self.status.write().await = McpConnectionStatus::Connected;\n\n        self.refresh_tools().await?;\n        Ok(())\n    }\n}","sourcePath":"baoclaw-core/src/mcp/client.rs","lineRange":{"start":61,"end":92}}],"progress":18},{"id":"02-core-implementation-slide-14","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: transport.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/mcp/transport.rs</span><span class=\"code-lines\">lines 48-97</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">pub struct StdioTransport {\n    child: Child,\n    writer: BufWriter&lt;ChildStdin&gt;,\n    reader: BufReader&lt;ChildStdout&gt;,\n    next_id: u64,\n}\n\nimpl StdioTransport {\n    /// Spawn a child process and perform MCP initialize handshake.\n    pub async fn spawn(\n        command: &amp;str,\n        args: &amp;[String],\n        env: &amp;HashMap&lt;String, String&gt;,\n    ) -&gt; Result&lt;Self, McpError&gt; {\n        let mut child = tokio::process::Command::new(command)\n            .args(args)\n            .envs(env)\n            .stdin(std::process::Stdio::piped())\n            .stdout(std::process::Stdio::piped())\n            .stderr(std::process::Stdio::piped())\n            .spawn()\n            .map_err(|e| McpError::ConnectionFailed(format!(&quot;Failed to spawn: {}&quot;, e)))?;\n\n        // ... 建立连接\n\n        // MCP initialize handshake\n        let _init_result = transport\n            .request(\n                &quot;initialize&quot;,\n                Some(serde_json::json!({\n                    &quot;protocolVersion&quot;: &quot;2024-11-05&quot;,\n                    &quot;capabilities&quot;: {},\n                    &quot;clientInfo&quot;: {\n                        &quot;name&quot;: &quot;baoclaw&quot;,\n                        &quot;version&quot;: &quot;0.3.0&quot;\n                    }\n                })),\n            )\n            .await?;\n\n        // Send initialized notification\n        transport.notify(&quot;notifications/initialized&quot;, None).await?;\n\n        Ok(transport)\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-10","language":"rust","code":"pub struct StdioTransport {\n    child: Child,\n    writer: BufWriter<ChildStdin>,\n    reader: BufReader<ChildStdout>,\n    next_id: u64,\n}\n\nimpl StdioTransport {\n    /// Spawn a child process and perform MCP initialize handshake.\n    pub async fn spawn(\n        command: &str,\n        args: &[String],\n        env: &HashMap<String, String>,\n    ) -> Result<Self, McpError> {\n        let mut child = tokio::process::Command::new(command)\n            .args(args)\n            .envs(env)\n            .stdin(std::process::Stdio::piped())\n            .stdout(std::process::Stdio::piped())\n            .stderr(std::process::Stdio::piped())\n            .spawn()\n            .map_err(|e| McpError::ConnectionFailed(format!(\"Failed to spawn: {}\", e)))?;\n\n        // ... 建立连接\n\n        // MCP initialize handshake\n        let _init_result = transport\n            .request(\n                \"initialize\",\n                Some(serde_json::json!({\n                    \"protocolVersion\": \"2024-11-05\",\n                    \"capabilities\": {},\n                    \"clientInfo\": {\n                        \"name\": \"baoclaw\",\n                        \"version\": \"0.3.0\"\n                    }\n                })),\n            )\n            .await?;\n\n        // Send initialized notification\n        transport.notify(\"notifications/initialized\", None).await?;\n\n        Ok(transport)\n    }\n}","sourcePath":"baoclaw-core/src/mcp/transport.rs","lineRange":{"start":48,"end":97}}],"progress":19},{"id":"02-core-implementation-slide-15","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: tool_wrapper.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/mcp/tool_wrapper.rs</span><span class=\"code-lines\">lines 15-73</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Wraps an MCP server tool as a BaoClaw Tool trait implementation.\npub struct McpToolWrapper {\n    client: Arc&lt;McpClient&gt;,\n    tool_def: McpToolDef,\n    server_name: String,\n}\n\n#[async_trait]\nimpl Tool for McpToolWrapper {\n    fn name(&amp;self) -&gt; &amp;str {\n        &amp;self.tool_def.name\n    }\n\n    fn input_schema(&amp;self) -&gt; JsonSchema {\n        let schema = &amp;self.tool_def.input_schema;\n        JsonSchema {\n            schema_type: schema[&quot;type&quot;].as_str().unwrap_or(&quot;object&quot;).to_string(),\n            properties: schema.get(&quot;properties&quot;).cloned(),\n            required: schema.get(&quot;required&quot;).and_then(|v| {\n                v.as_array()\n                    .map(|arr| arr.iter().filter_map(|v| v.as_str().map(String::from)).collect())\n            }),\n            description: Some(self.tool_def.description.clone()),\n        }\n    }\n\n    async fn call(\n        &amp;self,\n        input: Value,\n        _context: &amp;ToolContext,\n        _progress: &amp;dyn ProgressSender,\n    ) -&gt; Result&lt;ToolResult, ToolError&gt; {\n        let result = self\n            .client\n            .call_tool(&amp;self.tool_def.name, input)\n            .await\n            .map_err(|e| ToolError::ExecutionFailed(format!(&quot;MCP tool error: {}&quot;, e)))?;\n\n        let is_error = result\n            .get(&quot;isError&quot;)\n            .and_then(|v| v.as_bool())\n            .unwrap_or(false);\n\n        Ok(ToolResult {\n            data: result,\n            is_error,\n        })\n    }\n\n    fn prompt(&amp;self) -&gt; String {\n        format!(&quot;[MCP:{}] {}&quot;, self.server_name, self.tool_def.description)\n    }\n\n    /// MCP tools can return large base64 images.\n    fn max_result_size_chars(&amp;self) -&gt; usize {\n        10_000_000\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-11","language":"rust","code":"/// Wraps an MCP server tool as a BaoClaw Tool trait implementation.\npub struct McpToolWrapper {\n    client: Arc<McpClient>,\n    tool_def: McpToolDef,\n    server_name: String,\n}\n\n#[async_trait]\nimpl Tool for McpToolWrapper {\n    fn name(&self) -> &str {\n        &self.tool_def.name\n    }\n\n    fn input_schema(&self) -> JsonSchema {\n        let schema = &self.tool_def.input_schema;\n        JsonSchema {\n            schema_type: schema[\"type\"].as_str().unwrap_or(\"object\").to_string(),\n            properties: schema.get(\"properties\").cloned(),\n            required: schema.get(\"required\").and_then(|v| {\n                v.as_array()\n                    .map(|arr| arr.iter().filter_map(|v| v.as_str().map(String::from)).collect())\n            }),\n            description: Some(self.tool_def.description.clone()),\n        }\n    }\n\n    async fn call(\n        &self,\n        input: Value,\n        _context: &ToolContext,\n        _progress: &dyn ProgressSender,\n    ) -> Result<ToolResult, ToolError> {\n        let result = self\n            .client\n            .call_tool(&self.tool_def.name, input)\n            .await\n            .map_err(|e| ToolError::ExecutionFailed(format!(\"MCP tool error: {}\", e)))?;\n\n        let is_error = result\n            .get(\"isError\")\n            .and_then(|v| v.as_bool())\n            .unwrap_or(false);\n\n        Ok(ToolResult {\n            data: result,\n            is_error,\n        })\n    }\n\n    fn prompt(&self) -> String {\n        format!(\"[MCP:{}] {}\", self.server_name, self.tool_def.description)\n    }\n\n    /// MCP tools can return large base64 images.\n    fn max_result_size_chars(&self) -> usize {\n        10_000_000\n    }\n}","sourcePath":"baoclaw-core/src/mcp/tool_wrapper.rs","lineRange":{"start":15,"end":73}}],"progress":19},{"id":"02-core-implementation-slide-16","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: skills.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/discovery/skills.rs</span><span class=\"code-lines\">lines 13-67</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// A discovered skill\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SkillInfo {\n    pub name: String,\n    pub path: String,\n    pub source: String, // &quot;user&quot;, &quot;project&quot;, &quot;managed&quot;\n    pub description: Option&lt;String&gt;,\n}\n\n/// Scan for skills in standard directories relative to cwd and home.\n/// Directory format: skill-name/SKILL.md or skill-name.md\npub async fn discover_skills(cwd: &amp;Path) -&gt; Vec&lt;SkillInfo&gt; {\n    let mut skills = Vec::new();\n\n    // Project skills: &lt;cwd&gt;/.baoclaw/skills/\n    let skills_dir = cwd.join(&quot;.baoclaw&quot;).join(&quot;skills&quot;);\n    if let Ok(entries) = scan_skills_dir(&amp;skills_dir, &quot;project&quot;).await {\n        skills.extend(entries);\n    }\n\n    // User skills: ~/.baoclaw/skills/\n    if let Some(home) = dirs_path() {\n        let user_skills = home.join(&quot;.baoclaw&quot;).join(&quot;skills&quot;);\n        if let Ok(entries) = scan_skills_dir(&amp;user_skills, &quot;user&quot;).await {\n            skills.extend(entries);\n        }\n\n        // Plugin skills: scan ~/.baoclaw/plugins/*/skills/\n        let user_plugins = home.join(&quot;.baoclaw&quot;).join(&quot;plugins&quot;);\n        if let Ok(plugin_skills) = scan_plugin_skills(&amp;user_plugins).await {\n            skills.extend(plugin_skills);\n        }\n    }\n\n    skills\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-12","language":"rust","code":"/// A discovered skill\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SkillInfo {\n    pub name: String,\n    pub path: String,\n    pub source: String, // \"user\", \"project\", \"managed\"\n    pub description: Option<String>,\n}\n\n/// Scan for skills in standard directories relative to cwd and home.\n/// Directory format: skill-name/SKILL.md or skill-name.md\npub async fn discover_skills(cwd: &Path) -> Vec<SkillInfo> {\n    let mut skills = Vec::new();\n\n    // Project skills: <cwd>/.baoclaw/skills/\n    let skills_dir = cwd.join(\".baoclaw\").join(\"skills\");\n    if let Ok(entries) = scan_skills_dir(&skills_dir, \"project\").await {\n        skills.extend(entries);\n    }\n\n    // User skills: ~/.baoclaw/skills/\n    if let Some(home) = dirs_path() {\n        let user_skills = home.join(\".baoclaw\").join(\"skills\");\n        if let Ok(entries) = scan_skills_dir(&user_skills, \"user\").await {\n            skills.extend(entries);\n        }\n\n        // Plugin skills: scan ~/.baoclaw/plugins/*/skills/\n        let user_plugins = home.join(\".baoclaw\").join(\"plugins\");\n        if let Ok(plugin_skills) = scan_plugin_skills(&user_plugins).await {\n            skills.extend(plugin_skills);\n        }\n    }\n\n    skills\n}","sourcePath":"baoclaw-core/src/discovery/skills.rs","lineRange":{"start":13,"end":67}}],"progress":20},{"id":"02-core-implementation-slide-17","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: mcp_config.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/discovery/mcp_config.rs</span><span class=\"code-lines\">lines 40-69</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Discover all MCP server configurations from standard locations.\n/// Reads from:\n///   - ~/.claude/mcp.json (user scope)\n///   - .claude/mcp.json in cwd (project scope)\n///   - .claude/mcp.local.json in cwd (local scope, gitignored)\npub async fn discover_mcp_servers(cwd: &amp;Path) -&gt; Vec&lt;McpServerInfo&gt; {\n    let mut servers = Vec::new();\n\n    // User-level config: ~/.baoclaw/mcp.json\n    if let Some(home) = dirs_path() {\n        let user_config = home.join(&quot;.baoclaw&quot;).join(&quot;mcp.json&quot;);\n        if let Ok(entries) = load_mcp_config(&amp;user_config, &quot;user&quot;).await {\n            servers.extend(entries);\n        }\n\n        // Plugin MCP configs: ~/.baoclaw/plugins/*/mcp.json\n        if let Ok(plugin_servers) = scan_plugin_mcp(&amp;home.join(&quot;.baoclaw&quot;).join(&quot;plugins&quot;)).await {\n            servers.extend(plugin_servers);\n        }\n    }\n\n    // Project-level config: &lt;cwd&gt;/.baoclaw/mcp.json\n    let project_config = cwd.join(&quot;.baoclaw&quot;).join(&quot;mcp.json&quot;);\n    if let Ok(entries) = load_mcp_config(&amp;project_config, &quot;project&quot;).await {\n        servers.extend(entries);\n    }\n\n    // Local config (gitignored): &lt;cwd&gt;/.baoclaw/mcp.local.json\n    let local_config = cwd.join(&quot;.baoclaw&quot;).join(&quot;mcp.local.json&quot;);\n    if let Ok(entries) = load_mcp_config(&amp;local_config, &quot;local&quot;).await {\n        servers.extend(entries);\n    }\n\n    servers\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-13","language":"rust","code":"/// Discover all MCP server configurations from standard locations.\n/// Reads from:\n///   - ~/.claude/mcp.json (user scope)\n///   - .claude/mcp.json in cwd (project scope)\n///   - .claude/mcp.local.json in cwd (local scope, gitignored)\npub async fn discover_mcp_servers(cwd: &Path) -> Vec<McpServerInfo> {\n    let mut servers = Vec::new();\n\n    // User-level config: ~/.baoclaw/mcp.json\n    if let Some(home) = dirs_path() {\n        let user_config = home.join(\".baoclaw\").join(\"mcp.json\");\n        if let Ok(entries) = load_mcp_config(&user_config, \"user\").await {\n            servers.extend(entries);\n        }\n\n        // Plugin MCP configs: ~/.baoclaw/plugins/*/mcp.json\n        if let Ok(plugin_servers) = scan_plugin_mcp(&home.join(\".baoclaw\").join(\"plugins\")).await {\n            servers.extend(plugin_servers);\n        }\n    }\n\n    // Project-level config: <cwd>/.baoclaw/mcp.json\n    let project_config = cwd.join(\".baoclaw\").join(\"mcp.json\");\n    if let Ok(entries) = load_mcp_config(&project_config, \"project\").await {\n        servers.extend(entries);\n    }\n\n    // Local config (gitignored): <cwd>/.baoclaw/mcp.local.json\n    let local_config = cwd.join(\".baoclaw\").join(\"mcp.local.json\");\n    if let Ok(entries) = load_mcp_config(&local_config, \"local\").await {\n        servers.extend(entries);\n    }\n\n    servers\n}","sourcePath":"baoclaw-core/src/discovery/mcp_config.rs","lineRange":{"start":40,"end":69}}],"progress":20},{"id":"02-core-implementation-slide-18","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: plugins.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/discovery/plugins.rs</span><span class=\"code-lines\">lines 6-16</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// A discovered plugin\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct PluginInfo {\n    pub name: String,\n    pub version: Option&lt;String&gt;,\n    pub description: Option&lt;String&gt;,\n    pub path: String,\n    pub source: String, // &quot;user&quot;, &quot;project&quot;\n    pub has_tools: bool,\n    pub has_skills: bool,\n    pub has_mcp: bool,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-14","language":"rust","code":"/// A discovered plugin\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct PluginInfo {\n    pub name: String,\n    pub version: Option<String>,\n    pub description: Option<String>,\n    pub path: String,\n    pub source: String, // \"user\", \"project\"\n    pub has_tools: bool,\n    pub has_skills: bool,\n    pub has_mcp: bool,\n}","sourcePath":"baoclaw-core/src/discovery/plugins.rs","lineRange":{"start":6,"end":16}}],"progress":21},{"id":"02-core-implementation-slide-19","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例: executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/tools/executor.rs</span><span class=\"code-lines\">lines 157-189</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Truncate result data if its serialized size exceeds max_size_chars.\nfn maybe_persist_or_truncate(data: Value, max_size_chars: usize, context: &amp;ToolContext, tool_use_id: &amp;str) -&gt; Value {\n    let serialized = match serde_json::to_string(&amp;data) {\n        Ok(s) =&gt; s,\n        Err(_) =&gt; return data,\n    };\n\n    // Under the size limit — no action needed\n    if serialized.len() &lt;= max_size_chars {\n        return data;\n    }\n\n    // Try persisting via ToolResultStore\n    if let Some(ref store) = context.tool_result_store {\n        let content_str = match &amp;data {\n            Value::String(s) =&gt; s.clone(),\n            other =&gt; serde_json::to_string(other).unwrap_or_default(),\n        };\n\n        if let Some(formatted) = store.persist_and_format(&amp;content_str, tool_use_id) {\n            return Value::String(formatted);\n        }\n    }\n\n    // Fallback: truncate\n    let truncated: String = serialized.chars().take(max_size_chars).collect();\n    Value::String(format!(\n        &quot;{}\\n\\n[Result truncated: output exceeded {} characters]&quot;,\n        truncated, max_size_chars\n    ))\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-15","language":"rust","code":"/// Truncate result data if its serialized size exceeds max_size_chars.\nfn maybe_persist_or_truncate(data: Value, max_size_chars: usize, context: &ToolContext, tool_use_id: &str) -> Value {\n    let serialized = match serde_json::to_string(&data) {\n        Ok(s) => s,\n        Err(_) => return data,\n    };\n\n    // Under the size limit — no action needed\n    if serialized.len() <= max_size_chars {\n        return data;\n    }\n\n    // Try persisting via ToolResultStore\n    if let Some(ref store) = context.tool_result_store {\n        let content_str = match &data {\n            Value::String(s) => s.clone(),\n            other => serde_json::to_string(other).unwrap_or_default(),\n        };\n\n        if let Some(formatted) = store.persist_and_format(&content_str, tool_use_id) {\n            return Value::String(formatted);\n        }\n    }\n\n    // Fallback: truncate\n    let truncated: String = serialized.chars().take(max_size_chars).collect();\n    Value::String(format!(\n        \"{}\\n\\n[Result truncated: output exceeded {} characters]\",\n        truncated, max_size_chars\n    ))\n}","sourcePath":"baoclaw-core/src/tools/executor.rs","lineRange":{"start":157,"end":189}}],"progress":21},{"id":"02-core-implementation-slide-20","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：只读工具应该标记为并发安全\nimpl Tool for MyReadTool {\n    fn is_concurrency_safe(&amp;self, _input: &amp;Value) -&gt; bool {\n        false  // 实际是只读的，应该返回 true\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-16","language":"rust","code":"// ❌ 错误：只读工具应该标记为并发安全\nimpl Tool for MyReadTool {\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        false  // 实际是只读的，应该返回 true\n    }\n}"}],"progress":22},{"id":"02-core-implementation-slide-21","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：只读工具标记为并发安全\nimpl Tool for MyReadTool {\n    fn is_concurrency_safe(&amp;self, _input: &amp;Value) -&gt; bool {\n        true  // 只读操作可以并发执行\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-17","language":"rust","code":"// ✅ 正确：只读工具标记为并发安全\nimpl Tool for MyReadTool {\n    fn is_concurrency_safe(&self, _input: &Value) -> bool {\n        true  // 只读操作可以并发执行\n    }\n}"}],"progress":22},{"id":"02-core-implementation-slide-22","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：长时间运行的工具无法被中断\nasync fn call(&amp;self, input: Value, ctx: &amp;ToolContext) -&gt; Result&lt;ToolResult, ToolError&gt; {\n    let result = self.long_running_task().await;\n    Ok(result)\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-18","language":"rust","code":"// ❌ 错误：长时间运行的工具无法被中断\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult, ToolError> {\n    let result = self.long_running_task().await;\n    Ok(result)\n}"}],"progress":23},{"id":"02-core-implementation-slide-23","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：检查 abort 信号\nasync fn call(&amp;self, input: Value, ctx: &amp;ToolContext) -&gt; Result&lt;ToolResult, ToolError&gt; {\n    tokio::select! {\n        result = self.long_running_task() =&gt; Ok(result),\n        _ = async {\n            let mut rx = ctx.abort_signal.clone();\n            while !*rx.borrow() {\n                if rx.changed().await.is_err() {\n                    std::future::pending::&lt;()&gt;().await;\n                }\n            }\n        } =&gt; {\n            Err(ToolError::Aborted)\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-19","language":"rust","code":"// ✅ 正确：检查 abort 信号\nasync fn call(&self, input: Value, ctx: &ToolContext) -> Result<ToolResult, ToolError> {\n    tokio::select! {\n        result = self.long_running_task() => Ok(result),\n        _ = async {\n            let mut rx = ctx.abort_signal.clone();\n            while !*rx.borrow() {\n                if rx.changed().await.is_err() {\n                    std::future::pending::<()>().await;\n                }\n            }\n        } => {\n            Err(ToolError::Aborted)\n        }\n    }\n}"}],"progress":23},{"id":"02-core-implementation-slide-24","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：默认的 100K 限制对图像太小\nimpl Tool for MyScreenshotTool {\n    // 默认 max_result_size_chars() 返回 100_000\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-20","language":"rust","code":"// ❌ 错误：默认的 100K 限制对图像太小\nimpl Tool for MyScreenshotTool {\n    // 默认 max_result_size_chars() 返回 100_000\n}"}],"progress":24},{"id":"02-core-implementation-slide-25","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：提高限制以支持 base64 图像\nimpl Tool for MyScreenshotTool {\n    fn max_result_size_chars(&amp;self) -&gt; usize {\n        10_000_000  // 10MB\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-21","language":"rust","code":"// ✅ 正确：提高限制以支持 base64 图像\nimpl Tool for MyScreenshotTool {\n    fn max_result_size_chars(&self) -> usize {\n        10_000_000  // 10MB\n    }\n}"}],"progress":24},{"id":"02-core-implementation-slide-26","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">enum Tool {\n    Bash(BashTool),\n    FileRead(FileReadTool),\n    // ...\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-22","language":"rust","code":"enum Tool {\n    Bash(BashTool),\n    FileRead(FileReadTool),\n    // ...\n}"}],"progress":25},{"id":"02-core-implementation-slide-27","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">tool_registry.register(&quot;bash&quot;, |input| {\n    // 直接闭包\n});</code></pre>\n","type":"code","codeBlocks":[{"id":"code-23","language":"rust","code":"tool_registry.register(\"bash\", |input| {\n    // 直接闭包\n});"}],"progress":25},{"id":"02-core-implementation-slide-28","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">tools: Vec&lt;Arc&lt;dyn Tool&gt;&gt;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-24","language":"rust","code":"tools: Vec<Arc<dyn Tool>>"}],"progress":26},{"id":"02-core-implementation-slide-29","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">tools: Vec&lt;Arc&lt;dyn Tool&gt;&gt;</code></pre>\n","type":"code","codeBlocks":[{"id":"code-25","language":"rust","code":"tools: Vec<Arc<dyn Tool>>"}],"progress":26},{"id":"02-core-implementation-slide-30","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">fn is_deferred(&amp;self) -&gt; bool {\n    true  // 延迟加载\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-26","language":"rust","code":"fn is_deferred(&self) -> bool {\n    true  // 延迟加载\n}"}],"progress":27},{"id":"02-core-implementation-slide-31","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"思考","content":"<p><!-- Requirements: 5.4 讨论替代方案与权衡决策 --></p>\n<h3>替代方案</h3>\n<p>#### 方案 A: 枚举类型替代 Trait</p>\n<p>``<code>rust\nenum Tool {\n    Bash(BashTool),\n    FileRead(FileReadTool),\n    // ...\n}\n</code>`<code></p>\n<p>- <strong>优点:</strong> 编译时确定，无动态分发开销\n- <strong>缺点:</strong> 无法扩展，MCP 工具无法集成\n- <strong>适用场景:</strong> 确定不需要扩展的封闭系统</p>\n<p>#### 方案 B: 函数式工具注册</p>\n<p></code>`<code>rust\ntool_registry.register(\"bash\", |input| {\n    // 直接闭包\n});\n</code>`<code></p>\n<p>- <strong>优点:</strong> 简洁，易于注册\n- <strong>缺点:</strong> 缺少 schema、prompt 等元数据\n- <strong>适用场景:</strong> 快速原型开发</p>\n<p>#### 方案 C: Trait 对象 + 动态分发 ✓</p>\n<p></code>`<code>rust\ntools: Vec<Arc<dyn Tool>>\n</code>`<code></p>\n<p>- <strong>优点:</strong> 插件化、统一接口、支持 MCP\n- <strong>缺点:</strong> 轻微虚表开销\n- <strong>适用场景:</strong> 需要扩展性的 Agent 系统（BaoClaw 选择）</p>\n<h3>权衡决策</h3>\n<p>| 决策点 | 选择 | 原因 | 影响 |\n|--------|------|------|------|\n| 工具接口 | Trait 对象 | 动态分发，插件化 | 支持 MCP 扩展 |\n| 执行管道 | 验证→权限→调用 | 分层检查，早期失败 | 安全可靠 |\n| 并发策略 | 分类执行 | 兼顾安全与性能 | 读操作并发 |\n| MCP 集成 | 适配器模式 | 解耦外部协议 | 协议独立演进 |\n| 大结果处理 | 持久化+截断 | 防止上下文溢出 | 支持图像数据 |</p>\n<h3>设计决策：为什么用 Trait 对象？</h3>\n<p></code>`<code>rust\ntools: Vec<Arc<dyn Tool>>\n</code>`<code></p>\n<p><strong>优点:</strong></p>\n<p>1. <strong>动态分发:</strong> 运行时决定调用哪个工具\n2. <strong>插件化:</strong> 可以动态注册新工具（如 MCP 工具）\n3. <strong>统一接口:</strong> 所有工具共享相同的调用方式\n4. <strong>类型安全:</strong> 编译时保证接口正确</p>\n<p><strong>缺点:</strong></p>\n<p>- 轻微性能开销（虚表查找）\n- 无法内联优化</p>\n<p><strong>结论:</strong> 对于 Agent 场景，工具调用的网络延迟远大于虚表开销，动态分发的灵活性更重要。</p>\n<h3>设计决策：为什么 Skills 延迟加载？</h3>\n<p>Skills 不在启动时全部加载，而是通过 </code>SkillTool<code> 按需加载：</p>\n<p></code>`<code>rust\nfn is_deferred(&self) -> bool {\n    true  // 延迟加载\n}\n</code>``</p>\n<p><strong>原因:</strong></p>\n<p>1. <strong>上下文效率:</strong> 不占用宝贵的上下文窗口\n2. <strong>缓存稳定:</strong> 添加/删除 Skill 不影响缓存前缀\n3. <strong>按需加载:</strong> 只加载实际使用的 Skill</p>\n<p>---</p>\n","type":"reflection","progress":27},{"id":"02-core-implementation-slide-32","chapterId":"02-core-implementation","chapterTitle":"工具系统与扩展","title":"总结","content":"<p><!-- Requirements: 5.5 提供要点总结与延伸阅读链接 --></p>\n<h3>核心要点</h3>\n<p>- <strong>Tool Trait</strong>：统一的工具接口，支持验证、权限检查、并发控制\n- <strong>执行管道</strong>：验证 → 权限 → 调用的分层设计确保安全\n- <strong>并发优化</strong>：<code>is_concurrency_safe()</code> 标记实现智能调度\n- <strong>MCP 集成</strong>：通过适配器模式将外部协议工具统一为 Tool trait\n- <strong>延迟加载</strong>：Skills 和 MCP 工具按需加载，节省上下文</p>\n<h3>关键概念回顾</h3>\n<p>1. <strong>Tool Trait</strong>：<code>name()</code>, <code>call()</code>, <code>input_schema()</code>, <code>prompt()</code> 是核心方法\n2. <strong>执行管道</strong>：验证输入 → 检查权限 → 调用工具 → 处理结果\n3. <strong>并发安全</strong>：只读工具返回 <code>is_concurrency_safe() = true</code> 实现并行执行\n4. <strong>McpToolWrapper</strong>：将 MCP 服务器的工具适配为 BaoClaw Tool trait\n5. <strong>Discovery</strong>：分层发现机制（用户级 → 项目级 → 插件级）</p>\n<h3>内置工具一览</h3>\n<p>| 工具名 | 只读 | 并发安全 | 功能 |\n|--------|------|----------|------|\n| BashTool | ❌ | ❌ | 执行 Shell 命令 |\n| FileReadTool | ✅ | ✅ | 读取文件 |\n| FileWriteTool | ❌ | ❌ | 写入文件 |\n| FileEditTool | ❌ | ❌ | 编辑文件 |\n| GlobTool | ✅ | ✅ | 文件名搜索 |\n| GrepTool | ✅ | ✅ | 内容搜索 |\n| WebFetchTool | ✅ | ✅ | HTTP 请求 |\n| WebSearchTool | ✅ | ✅ | 网页搜索 |\n| SkillTool | ✅ | ✅ | 加载技能 |\n| AgentTool | ❌ | ✅ | 创建子代理 |</p>\n<h3>延伸阅读</h3>\n<p>#### 官方资源</p>\n<p>- <a href=\"https://github.com/baoclaw/baoclaw\">BaoClaw GitHub</a> - 完整源码实现\n- <a href=\"./../../../baoclaw-core/src/tools/trait_def.rs\">Tool Trait 源码</a> - 工具接口定义\n- <a href=\"./../../../baoclaw-core/src/tools/executor.rs\">Executor 源码</a> - 工具执行器\n- <a href=\"./../../../baoclaw-core/src/mcp/client.rs\">MCP Client 源码</a> - MCP 客户端实现</p>\n<p>#### 相关章节</p>\n<p>- <a href=\"./../01-fundamentals/\">上一章：Agent 基础</a> - 理解 ReAct 循环和 QueryEngine\n- <a href=\"./../03-memory-context/\">下一章：记忆与上下文</a> - 了解消息管理和上下文压缩</p>\n<p>#### 外部资源</p>\n<p>- <a href=\"https://modelcontextprotocol.io/\">MCP 协议规范</a> - Model Context Protocol 官方文档\n- <a href=\"https://docs.rs/async-trait/\">Rust async-trait</a> - 异步 trait 实现\n- <a href=\"https://docs.rs/futures/\">futures::join_all</a> - 并发执行工具\n</p>","type":"summary","progress":28},{"id":"03-memory-context-slide-01","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"记忆与上下文","content":"<div class=\"chapter-number\">Chapter 3</div>\n<h1>记忆与上下文</h1>\n","type":"title","progress":28},{"id":"03-memory-context-slide-02","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"问题","content":"<p><!-- Requirements: 5.1 描述该章节解决的实际工程问题 --></p>\n<p>在构建 Agent 时，我们面临以下核心问题：</p>\n<h3>1. 上下文窗口有限</h3>\n<p>大语言模型有固定的上下文窗口限制（如 Claude 200K tokens）。长对话会迅速消耗这个窗口：</p>\n<p>- 每条消息都占用 tokens\n- 工具调用和结果占用大量空间\n- 文件内容可能超出限制</p>\n<p>``<code>\nUser: 帮我分析这个项目\n→ 读取 10 个文件 → 50K tokens\n→ 搜索关键词 → 30K tokens 结果\n→ 对话 20 轮 → 累计 150K tokens\n→ 下次调用超限！\n</code>`<code></p>\n<h3>2. 缺乏跨会话记忆</h3>\n<p>传统聊天机器人无法记住之前的对话。用户需要重复说明：</p>\n<p>- 项目背景信息\n- 个人偏好设置\n- 之前做出的决策</p>\n<h3>3. Token 计数不准确</h3>\n<p>精确的 token 计数对上下文管理至关重要，但存在挑战：</p>\n<p>- 不同语言 token 密度不同（中文约 2 字/token，英文约 4 字符/token）\n- API 返回的实际值与估算值可能偏差 4-8 倍\n- 简单的 </code>字符数 / 4<code> 估算在中文场景严重失真</p>\n<h3>4. 压缩策略的两难</h3>\n<p>上下文压缩需要在信息保留和空间节省之间平衡：</p>\n<p>- 保留太多 → 压缩效果差\n- 保留太少 → 丢失关键上下文\n- 压缩时机不当 → 用户等待或 API 错误</p>\n<h3>问题背景</h3>\n<p>Agent 的记忆系统分为三层：</p>\n<p></code>`<code>\n┌─────────────────────────────────────────────────────┐\n│                    Memory Hierarchy                  │\n│                                                      │\n│  ┌─────────────────────────────────────────────┐   │\n│  │        Working Memory (Messages)             │   │\n│  │        当前对话历史，实时更新                 │   │\n│  │        容量: 受 context_window 限制           │   │\n│  └─────────────────────────────────────────────┘   │\n│                       ↓ compact                     │\n│  ┌─────────────────────────────────────────────┐   │\n│  │        Session Memory (Rolling Summary)      │   │\n│  │        会话级滚动摘要，后台 API 更新          │   │\n│  │        容量: ~8000 字符                       │   │\n│  └─────────────────────────────────────────────┘   │\n│                       ↓ persist                    │\n│  ┌─────────────────────────────────────────────┐   │\n│  │        Long-term Memory (MemoryStore)        │   │\n│  │        跨会话持久化，事实/偏好/决策           │   │\n│  │        容量: 无硬性限制                       │   │\n│  └─────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────┘\n</code>``</p>\n<p>---</p>\n","type":"problem","progress":29},{"id":"03-memory-context-slide-03","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"模式","content":"<p><!-- Requirements: 5.2 讲解通用的设计模式或架构范式 --></p>\n<h3>核心设计模式：分层记忆架构</h3>\n<p>BaoClaw 采用三层记忆架构，每层有不同的生命周期和容量特性。</p>\n<p>#### 记忆层次对比</p>\n<p>| 层次 | 生命周期 | 容量 | 更新方式 | 存储位置 |\n|------|----------|------|----------|----------|\n| Working Memory | 会话内 | ~200K tokens | 实时追加 | 内存 |\n| Session Memory | 会话级 | ~8000 字符 | 后台 API 更新 | <code>~/.baoclaw/sessions/{id}.memory.md</code> |\n| Long-term Memory | 跨会话 | 无限制 | 显式添加 | <code>~/.baoclaw/memory.jsonl</code> |</p>\n<h3>工作记忆管理模式</h3>\n<p>工作记忆（消息历史）通过多级阈值管理：</p>\n<p>``<code>\n┌──────────────────────────────────────────────────────────────┐\n│                    Token Budget Zones                         │\n│                                                               │\n│  0 ────────────────────────────────────────────────────────  │\n│    │                    Normal Zone                           │\n│    │                    正常运行区                            │\n│    ▼                                                         │\n│  140K ──────────────────────────────────────────────────────  │\n│    │                    Compact Zone                          │\n│    │                    考虑压缩 (70%)                         │\n│    ▼                                                         │\n│  167K ──────────────────────────────────────────────────────  │\n│    │                    Warning Zone                          │\n│    │                    警告区 (预留 20K)                      │\n│    ▼                                                         │\n│  184K ──────────────────────────────────────────────────────  │\n│    │                    Blocking Zone                         │\n│    │                    必须压缩 (预留 3K)                     │\n│    ▼                                                         │\n│  200K ──────────────────────────────────────────────────────  │\n│                    Context Window Limit                       │\n└──────────────────────────────────────────────────────────────┘\n</code>`<code></p>\n<h3>Token 计数模式：校准 + 估算混合策略</h3>\n<p>精确 token 计数采用<strong>校准 + 增量估算</strong>混合策略：</p>\n<p></code>`<code>mermaid\nsequenceDiagram\n    participant API as LLM API\n    participant Counter as TokenCounter\n    participant Tiktoken as tiktoken\n    \n    Note over Counter: 初始状态: 无基线\n    \n    API->>Counter: 返回 usage.input_tokens=12000\n    Counter->>Counter: calibrate(12000, msg_count=5)\n    Note over Counter: 基线: 12000 tokens @ 5 messages\n    \n    loop 后续估算\n        Counter->>Tiktoken: 计算新增消息的 tokens\n        Tiktoken-->>Counter: delta=500\n        Counter->>Counter: estimate = 12000 + 500\n    end\n    \n    API->>Counter: 返回 usage.input_tokens=12800\n    Counter->>Counter: calibrate(12800, msg_count=7)\n    Note over Counter: 更新基线\n</code>`<code></p>\n<h3>压缩策略模式</h3>\n<p>上下文压缩采用<strong>API 摘要 + 边界保护</strong>策略：</p>\n<p></code>`<code>\n┌─────────────────────────────────────────────────────────────┐\n│                    Compact Strategy                          │\n│                                                              │\n│  Messages: [M1, M2, M3, ..., M_n-4, M_n-3, M_n-2, M_n-1, Mn]│\n│                          │                                   │\n│                          ▼                                   │\n│            ┌─────────────────────────┐                       │\n│            │   keep_recent = 4       │                       │\n│            │   保护最近 4 条消息      │                       │\n│            └─────────────────────────┘                       │\n│                          │                                   │\n│           ┌──────────────┴──────────────┐                    │\n│           ▼                              ▼                   │\n│  [M1, ..., M_n-4]              [M_n-3, ..., Mn]              │\n│   旧消息 → 摘要                  新消息 → 保留                │\n│           │                              │                   │\n│           ▼                              │                   │\n│  ┌─────────────────┐                     │                   │\n│  │  API Summarize  │                     │                   │\n│  │  调用 LLM 摘要   │                     │                   │\n│  └────────┬────────┘                     │                   │\n│           │                              │                   │\n│           ▼                              ▼                   │\n│  ┌──────────────────────────────────────────────────────┐   │\n│  │  [Boundary Message] + [M_n-3, M_n-2, M_n-1, Mn]       │   │\n│  │   摘要内容作为系统消息      最近消息保持完整            │   │\n│  └──────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────┘\n</code>`<code></p>\n<h3>会话记忆模式：滚动摘要</h3>\n<p>Session Memory 采用<strong>滚动摘要</strong>模式，在会话期间通过后台 API 调用更新：</p>\n<p></code>`<code>mermaid\ngraph LR\n    A[会话开始] --> B[消息计数 < 6]\n    B --> C[消息计数 >= 6]\n    C --> D[首次生成摘要]\n    D --> E[消息计数 +10]\n    E --> F[更新摘要]\n    F --> E\n    \n    D --> G[持久化到 .memory.md]\n    F --> G\n</code>``</p>\n<p>---</p>\n","type":"pattern","progress":29},{"id":"03-memory-context-slide-04","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"实现","content":"<p><!-- Requirements: 5.3 提供 BaoClaw 的 Rust 代码示例 --></p>\n<h3>示例 1: MemoryStore - 长期记忆</h3>\n<p>MemoryStore 实现跨会话的持久化记忆。</p>\n<p>``<code>rust path=\"baoclaw-core/src/engine/memory.rs\" lines=\"5-34\"\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub enum MemoryCategory {\n    #[serde(rename = \"fact\")]\n    Fact,       // 事实: \"项目使用 TypeScript\"\n    #[serde(rename = \"preference\")]\n    Preference, // 偏好: \"用户喜欢简洁的代码风格\"\n    #[serde(rename = \"decision\")]\n    Decision,   // 决策: \"选择 PostgreSQL 作为主数据库\"\n}</p>\n<p>#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct MemoryEntry {\n    pub id: String,           // UUID 前 8 位\n    pub content: String,      // 记忆内容\n    pub category: MemoryCategory,\n    pub created_at: String,   // ISO 8601 时间戳\n    pub source: String,       // 来源标识\n}</p>\n<p>/// Persistent memory store backed by a JSONL file.\n/// Supports both global (~/.baoclaw/) and project-level (<cwd>/.baoclaw/) memory.\npub struct MemoryStore {\n    entries: Mutex<Vec<MemoryEntry>>,\n    file_path: Mutex<PathBuf>,\n}\n</code>`<code></p>\n<p><strong>存储位置:</strong></p>\n<p></code>`<code>\n~/.baoclaw/memory.jsonl          # 全局记忆\n<project>/.baoclaw/memory.jsonl  # 项目级记忆\n</code>`<code></p>\n<p><strong>关键方法:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/memory.rs\" lines=\"43-60\"\nimpl MemoryStore {\n    /// Load global memories from ~/.baoclaw/memory.jsonl.\n    pub fn load() -> Self {\n        let home = std::env::var(\"HOME\").unwrap_or_else(|_| \"/tmp\".to_string());\n        let file_path = PathBuf::from(&home).join(\".baoclaw\").join(MEMORY_FILE);\n        let entries = Self::read_file(&file_path);\n        eprintln!(\"Loaded {} long-term memories from {}\", entries.len(), file_path.display());\n        Self {\n            entries: Mutex::new(entries),\n            file_path: Mutex::new(file_path),\n        }\n    }</p>\n<p>    /// Load project-level memories from <cwd>/.baoclaw/memory.jsonl.\n    pub fn load_for_project(cwd: &std::path::Path) -> Self {\n        let project_path = cwd.join(\".baoclaw\").join(MEMORY_FILE);\n        // ...\n    }\n}\n</code>`<code></p>\n<p><strong>添加记忆并持久化:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/memory.rs\" lines=\"98-120\"\n    /// Add a new memory entry.\n    pub async fn add(&self, content: String, category: MemoryCategory, source: String) -> MemoryEntry {\n        let entry = MemoryEntry {\n            id: uuid::Uuid::new_v4().to_string()[..8].to_string(),\n            content,\n            category,\n            created_at: chrono::Utc::now().to_rfc3339(),\n            source,\n        };\n        let mut entries = self.entries.lock().await;\n        entries.push(entry.clone());\n        // Append to file (JSONL format)\n        if let Ok(line) = serde_json::to_string(&entry) {\n            use std::io::Write;\n            let fp = self.file_path.lock().await;\n            if let Ok(mut f) = std::fs::OpenOptions::new().create(true).append(true).open(&*fp) {\n                let _ = writeln!(f, \"{}\", line);\n            }\n        }\n        entry\n    }\n</code>`<code></p>\n<p><strong>构建系统提示片段:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/memory.rs\" lines=\"138-172\"\n    /// Build a system prompt fragment from all memories.\n    pub async fn build_prompt_fragment(&self) -> Option<String> {\n        let entries = self.entries.lock().await;\n        if entries.is_empty() {\n            return None;\n        }</p>\n<p>        let mut parts = Vec::new();\n        parts.push(\"# Long-term Memory\\n\\nThe following are facts, preferences, and decisions remembered from previous conversations.\\n\".to_string());</p>\n<p>        let facts: Vec<&MemoryEntry> = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Fact)).collect();\n        let prefs: Vec<&MemoryEntry> = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Preference)).collect();\n        let decisions: Vec<&MemoryEntry> = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Decision)).collect();</p>\n<p>        if !facts.is_empty() {\n            parts.push(\"## Facts\".to_string());\n            for e in &facts {\n                parts.push(format!(\"- {}\", e.content));\n            }\n        }\n        // ... 类似处理 Preferences 和 Decisions</p>\n<p>        Some(parts.join(\"\\n\"))\n    }\n</code>`<code></p>\n<h3>示例 2: SessionMemory - 会话滚动摘要</h3>\n<p>SessionMemory 维护会话级别的滚动摘要。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/session_memory.rs\" lines=\"14-41\"\n/// Minimum turns before first summary generation.\nconst FIRST_UPDATE_THRESHOLD: usize = 6;</p>\n<p>/// Number of new messages between summary updates.\nconst UPDATE_INTERVAL: usize = 10;</p>\n<p>/// Maximum summary length (chars). Summaries exceeding this are truncated.\nconst MAX_SUMMARY_CHARS: usize = 8000;</p>\n<p>/// Session-level rolling summary persisted to disk.\npub struct SessionMemory {\n    file_path: PathBuf,\n    content: Mutex<String>,\n    last_update_count: Mutex<usize>,\n}\n</code>`<code></p>\n<p><strong>加载和读取:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/session_memory.rs\" lines=\"43-70\"\nimpl SessionMemory {\n    /// Compute the file path for a given session ID.\n    pub fn path_for(session_id: &str) -> PathBuf {\n        let home = std::env::var(\"HOME\").unwrap_or_else(|_| \"/tmp\".to_string());\n        PathBuf::from(home)\n            .join(\".baoclaw\")\n            .join(\"sessions\")\n            .join(format!(\"{}.memory.md\", session_id))\n    }</p>\n<p>    /// Load an existing session memory file. Returns empty string if missing.\n    pub fn load(session_id: &str) -> Self {\n        let file_path = Self::path_for(session_id);\n        let _ = fs::create_dir_all(file_path.parent().unwrap_or(&file_path));\n        let content = fs::read_to_string(&file_path).unwrap_or_default();</p>\n<p>        Self {\n            file_path,\n            content: Mutex::new(content),\n            last_update_count: Mutex::new(0),\n        }\n    }</p>\n<p>    /// Return the current summary text.\n    pub fn get(&self) -> String {\n        self.content.lock().unwrap_or_else(|e| e.into_inner()).clone()\n    }\n}\n</code>`<code></p>\n<p><strong>更新触发判断:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/session_memory.rs\" lines=\"76-94\"\n    /// Whether enough new messages have arrived to warrant an update.\n    pub fn should_update(&self, message_count: usize) -> bool {\n        let guard = self.content.lock().unwrap_or_else(|e| e.into_inner());\n        let current = guard.trim();\n        if current.is_empty() || current.len() <= 20 {\n            // No real summary yet — update after first few messages.\n            drop(guard);\n            message_count >= FIRST_UPDATE_THRESHOLD  // >= 6\n        } else {\n            let last = *self.last_update_count.lock().unwrap_or_else(|e| e.into_inner());\n            drop(guard);\n            message_count >= last + UPDATE_INTERVAL  // +10\n        }\n    }\n</code>`<code></p>\n<p><strong>更新摘要并持久化:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/session_memory.rs\" lines=\"96-116\"\n    /// Write a new summary to memory (and persist to disk).\n    pub fn update(&self, summary: String) {\n        // Security scan before persisting memory\n        if let Err(reason) = validate_memory_content(&summary) {\n            eprintln!(\"Memory content blocked by security scan: {}\", reason);\n            return;\n        }</p>\n<p>        let truncated = if summary.len() > MAX_SUMMARY_CHARS {\n            format!(\"{}...\\n\\n[Summary truncated at {} chars]\",\n                &summary.chars().take(MAX_SUMMARY_CHARS).collect::<String>(),\n                summary.len())\n        } else {\n            summary\n        };\n        let mut guard = self.content.lock().unwrap_or_else(|e| e.into_inner());\n        *guard = truncated;\n        let _ = fs::write(&self.file_path, guard.as_bytes());\n    }\n</code>`<code></p>\n<h3>示例 3: TokenCounter - Token 计数器</h3>\n<p>TokenCounter 实现精确的 token 计数。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/token_counter.rs\" lines=\"24-44\"\n/// Persisted token counter state for fast startup recovery.\n#[derive(serde::Serialize, serde::Deserialize, Debug)]\npub struct TokenBaseline {\n    pub last_known_input_tokens: u64,\n    pub last_known_message_count: usize,\n}</p>\n<p>/// Tracks input-token usage per session, calibrated against real API responses.\n#[derive(Debug)]\npub struct TokenCounter {\n    /// Last known input token count from API (authoritative).\n    last_known_input_tokens: Option<u64>,\n    /// Message count at the time </code>last_known_input_tokens<code> was captured.\n    last_known_message_count: usize,\n    /// Auto-compact threshold as fraction of </code>context_window<code> (e.g. 0.7 = 70%).\n    threshold_ratio: f64,\n    /// Model's context window size in tokens (e.g. 200_000 for Claude).\n    context_window: u64,\n}\n</code>`<code></p>\n<p><strong>tiktoken 计数:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/token_counter.rs\" lines=\"67-79\"\n    /// Count tokens in a text string using the cl100k_base BPE tokeniser.\n    /// cl100k is the tokeniser used by gpt-4/gpt-3.5. For Claude it over-counts\n    /// by ~5-10%, which is still an order of magnitude more accurate than the\n    /// previous </code>chars / 4<code> heuristic (which undercounted Chinese by 4-8×).\n    pub fn count_text_tokens(text: &str) -> u64 {\n        match tiktoken_rs::cl100k_base() {\n            Ok(bpe) => bpe.encode_with_special_tokens(text).len() as u64,\n            Err(_) => (text.chars().count() as u64).saturating_mul(3) / 4,\n        }\n    }\n</code>`<code></p>\n<p><strong>API 校准:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/token_counter.rs\" lines=\"81-90\"\n    /// Called after each API response to anchor the counter to a known value.\n    pub fn calibrate(&mut self, api_input_tokens: u64, message_count_at_call: usize) {\n        self.last_known_input_tokens = Some(api_input_tokens);\n        self.last_known_message_count = message_count_at_call;\n    }\n</code>`<code></p>\n<p><strong>估算当前 token 数:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/token_counter.rs\" lines=\"92-107\"\n    /// Estimate the total input tokens for the given message list.\n    /// Uses the most recent API baseline + tiktoken delta for messages added\n    /// since that baseline. Without any baseline yet, falls back to full\n    /// tiktoken-counting the entire message list.\n    pub fn estimate(&self, messages: &[Message]) -> u64 {\n        match self.last_known_input_tokens {\n            Some(baseline) if messages.len() >= self.last_known_message_count => {\n                let delta: u64 = messages[self.last_known_message_count..]\n                    .iter()\n                    .map(|m| Self::count_text_tokens(&Self::extract_text(m)))\n                    .sum();\n                baseline + delta\n            }\n            _ => messages\n                .iter()\n                .map(|m| Self::count_text_tokens(&Self::extract_text(m)))\n                .sum(),\n        }\n    }\n</code>`<code></p>\n<p><strong>多级预算管理:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/token_counter.rs\" lines=\"121-157\"\nimpl TokenCounter {\n    /// Effective window = context_window − summary_output_reserve − compact_buffer.\n    /// Reserves 20K tokens for the compact summary output and 13K as a buffer.\n    pub fn effective_window(&self) -> u64 {\n        self.context_window.saturating_sub(33_000)\n    }</p>\n<p>    /// Warning threshold — roughly 20K tokens below the effective window.\n    pub fn warning_threshold(&self) -> u64 {\n        self.effective_window().saturating_sub(20_000)\n    }</p>\n<p>    /// Blocking threshold — roughly 3K tokens below the effective window.\n    pub fn blocking_threshold(&self) -> u64 {\n        self.effective_window().saturating_sub(3_000)\n    }</p>\n<p>    /// Compact threshold (the original threshold_ratio-based level).\n    pub fn compact_threshold(&self) -> u64 {\n        (self.context_window as f64 * self.threshold_ratio) as u64\n    }</p>\n<p>    /// Return the current budget status for a pre-computed estimate.\n    pub fn budget_status_given(&self, est: u64) -> BudgetStatus {\n        if est > self.blocking_threshold() {\n            BudgetStatus::Blocking\n        } else if est > self.warning_threshold() {\n            BudgetStatus::Warning\n        } else if est > self.compact_threshold() {\n            BudgetStatus::Compact\n        } else {\n            BudgetStatus::Normal\n        }\n    }\n}</p>\n<p>#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum BudgetStatus {\n    Normal,   // 正常\n    Compact,  // 超过压缩阈值\n    Warning,  // 接近限制\n    Blocking, // 必须压缩\n}\n</code>`<code></p>\n<h3>示例 4: 自动压缩触发</h3>\n<p>在消息提交时检查是否需要压缩：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"818-870\"\n        // ── Token budget check: auto-compact if context is too large ──\n        let (should_compact, initial_budget) = {\n            let counter = self.token_counter.lock().await;\n            let est = counter.current_estimate(&self.messages);\n            let should = counter.should_compact_given(est) && self.messages.len() > 5;\n            let budget = counter.budget_status_given(est);\n            (should, (budget, est))\n        };\n        if should_compact {\n            let msg_count = self.messages.len();\n            if msg_count <= 500 {\n                eprintln!(\"Pre-query auto-compact ({} messages, {} tokens)\", msg_count, initial_budget.1);\n                match self.compact().await {\n                    Ok(result) => {\n                        eprintln!(\"Auto-compact: {} -> {} tokens (saved {})\",\n                            result.tokens_before, result.tokens_after, result.tokens_saved);\n                        self.compact_fail_count = 0;\n                    }\n                    Err(e) => {\n                        eprintln!(\"Auto-compact failed: {}, continuing anyway\", e.message);\n                        self.compact_fail_count += 1;\n                    }\n                }\n            } else {\n                // Too many messages — use session_memory_compact instead (no API call).\n                eprintln!(\"Pre-query: {} messages is too many for API compact\", msg_count);\n                if let Some(ref sm) = self.config.session_memory {\n                    if sm.is_available() {\n                        let mut msgs = self.messages.to_vec();\n                        if session_memory_compact(&mut msgs, &sm.get()) {\n                            self.messages = msgs;\n                        }\n                    }\n                }\n            }\n        }\n</code>`<code></p>\n<h3>示例 5: Compact 核心实现</h3>\n<p>压缩消息历史并生成摘要：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"537-610\"\n    pub async fn compact(&mut self) -> Result<CompactResult, EngineError> {\n        let keep_recent: usize = 4;</p>\n<p>        let tokens_before = estimate_tokens(&self.messages);</p>\n<p>        if self.messages.len() <= keep_recent {\n            return Ok(CompactResult {\n                tokens_saved: 0,\n                summary_tokens: 0,\n                tokens_before,\n                tokens_after: tokens_before,\n            });\n        }</p>\n<p>        let mut split = self.messages.len() - keep_recent;</p>\n<p>        // Ensure we don't split between tool calls and their results.\n        // If old_messages ends with an assistant message containing tool_use,\n        // we need to include ALL following tool_result messages.\n        if split > 0 && split < self.messages.len() {\n            if let MessageContent::Assistant { message, .. } = &self.messages[split - 1].content {\n                let tool_use_ids: Vec<&str> = message.content.iter()\n                    .filter_map(|block| match block {\n                        ContentBlock::ToolUse { id, .. } => Some(id.as_str()),\n                        _ => None,\n                    })\n                    .collect();</p>\n<p>                if !tool_use_ids.is_empty() {\n                    // Scan forward to find all corresponding tool_result messages\n                    let mut found_results: HashSet<String> = HashSet::new();\n                    let mut next_idx = split;</p>\n<p>                    while next_idx < self.messages.len() {\n                        if let MessageContent::User { message, .. } = &self.messages[next_idx].content {\n                            let result_ids = extract_tool_result_ids(message);\n                            for id in result_ids {\n                                if tool_use_ids.contains(&id.as_str()) {\n                                    found_results.insert(id);\n                                }\n                            }\n                            if found_results.len() == tool_use_ids.len() {\n                                break;\n                            }\n                        }\n                        next_idx += 1;\n                    }</p>\n<p>                    // Adjust split to include all tool_result messages\n                    if found_results.len() == tool_use_ids.len() {\n                        split = next_idx + 1;\n                    } else {\n                        // Not all results found - move assistant message to recent_messages\n                        if split > 1 {\n                            split -= 1;\n                        }\n                    }\n                }\n            }\n        }</p>\n<p>        let old_messages = &self.messages[..split];\n        let recent_messages = self.messages[split..].to_vec();\n</code>`<code></p>\n<p><strong>生成摘要并替换:</strong></p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"610-660\"\n        // Build a summarisation prompt from the old messages\n        let raw_summary = format_messages_for_summary(old_messages);\n        let max_summary_chars: usize = 60_000; // ~15k tokens\n        let truncated_summary = if raw_summary.len() > max_summary_chars {\n            format!(\"{}...\\n\\n[Conversation truncated, {} total chars]\",\n                &raw_summary.chars().take(max_summary_chars).collect::<String>(), raw_summary.len())\n        } else {\n            raw_summary\n        };\n        let summary_prompt = format!(\n            \"Summarize the following conversation history concisely, \\\n             preserving key context, decisions, and file changes:\\n\\n{}\",\n            truncated_summary\n        );</p>\n<p>        // Call the API to produce a summary\n        let summary = match self.call_api_for_summary(&summary_prompt).await {\n            Ok(s) => s,\n            Err(e) => {\n                eprintln!(\"Compact: summary API failed ({}), falling back to truncation\", e.message);\n                format!(\"[Previous conversation ({} messages) was truncated due to context limits]\", old_messages.len())\n            }\n        };</p>\n<p>        // Build the compact boundary message\n        let boundary = Message {\n            uuid: uuid::Uuid::new_v4().to_string(),\n            timestamp: chrono::Utc::now().to_rfc3339(),\n            content: MessageContent::System {\n                subtype: SystemSubtype::CompactBoundary,\n                content: summary,\n            },\n        };</p>\n<p>        // Replace messages: boundary + recent\n        self.messages = vec![boundary];\n        self.messages.extend(recent_messages);\n</code>`<code></p>\n<h3>示例 6: CompactResult 结构体</h3>\n<p>压缩结果包含关键指标：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/query_engine.rs\" lines=\"133-139\"\n/// Result of a context compaction operation.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct CompactResult {\n    pub tokens_saved: u64,      // 节省的 tokens\n    pub summary_tokens: u64,    // 摘要占用的 tokens\n    pub tokens_before: u64,     // 压缩前 tokens\n    pub tokens_after: u64,      // 压缩后 tokens\n}\n</code>`<code></p>\n<h3>常见错误示例</h3>\n<p>#### 错误示例 1：使用字符数估算 token</p>\n<p></code>`<code>rust\n// ❌ 错误：中文估算偏差 4-8 倍\nlet tokens = text.len() / 4;\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：使用 tiktoken\nlet tokens = TokenCounter::count_text_tokens(&text);\n</code>`<code></p>\n<p>#### 错误示例 2：压缩时切断 tool_use 和 tool_result</p>\n<p></code>`<code>rust\n// ❌ 错误：可能将 tool_use 和 tool_result 分离\nlet split = messages.len() / 2;\nlet old = &messages[..split];\nlet new = &messages[split..];\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：检查 tool_use/tool_result 完整性\nif let MessageContent::Assistant { message, .. } = &messages[split - 1].content {\n    let tool_use_ids: Vec<&str> = message.content.iter()\n        .filter_map(|block| match block {\n            ContentBlock::ToolUse { id, .. } => Some(id.as_str()),\n            _ => None,\n        })\n        .collect();\n    // ... 确保所有 tool_result 都在分割点之后\n}\n</code>`<code></p>\n<p>#### 错误示例 3：未持久化 session memory</p>\n<p></code>`<code>rust\n// ❌ 错误：只在内存中更新，不持久化\nself.session_memory.update(summary);\n// 程序崩溃后丢失\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：同时持久化到磁盘\npub fn update(&self, summary: String) {\n    let mut guard = self.content.lock().unwrap();\n    *guard = summary.clone();\n    let _ = fs::write(&self.file_path, summary.as_bytes());  // 持久化\n}\n</code>``</p>\n<p>---</p>\n","type":"implementation","progress":30},{"id":"03-memory-context-slide-05","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">User: 帮我分析这个项目\n→ 读取 10 个文件 → 50K tokens\n→ 搜索关键词 → 30K tokens 结果\n→ 对话 20 轮 → 累计 150K tokens\n→ 下次调用超限！</code></pre>\n","type":"code","codeBlocks":[{"id":"code-1","language":"other","code":"User: 帮我分析这个项目\n→ 读取 10 个文件 → 50K tokens\n→ 搜索关键词 → 30K tokens 结果\n→ 对话 20 轮 → 累计 150K tokens\n→ 下次调用超限！"}],"progress":30},{"id":"03-memory-context-slide-06","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">┌─────────────────────────────────────────────────────┐\n│                    Memory Hierarchy                  │\n│                                                      │\n│  ┌─────────────────────────────────────────────┐   │\n│  │        Working Memory (Messages)             │   │\n│  │        当前对话历史，实时更新                 │   │\n│  │        容量: 受 context_window 限制           │   │\n│  └─────────────────────────────────────────────┘   │\n│                       ↓ compact                     │\n│  ┌─────────────────────────────────────────────┐   │\n│  │        Session Memory (Rolling Summary)      │   │\n│  │        会话级滚动摘要，后台 API 更新          │   │\n│  │        容量: ~8000 字符                       │   │\n│  └─────────────────────────────────────────────┘
