s.push(\"--ro-bind\".into());\n    args.push(\"/lib\".into());\n    args.push(\"/lib\".into());\n\n    args.push(\"--ro-bind\".into());\n    args.push(\"/lib64\".into());\n    args.push(\"/lib64\".into());\n\n    args.push(\"--ro-bind\".into());\n    args.push(\"/bin\".into());\n    args.push(\"/bin\".into());\n\n    args.push(\"--proc\".into());\n    args.push(\"/proc\".into());\n\n    args.push(\"--dev\".into());\n    args.push(\"/dev\".into());\n\n    args.push(\"--tmpfs\".into());\n    args.push(\"/tmp\".into());\n\n    // RW mounts\n    for mount in &self.rw_mounts {\n        if Path::new(mount).exists() {\n            args.push(\"--bind\".into());\n            args.push(mount.clone());\n            args.push(mount.clone());\n        }\n    }\n    // ... 网络隔离、工作目录等\n}","sourcePath":"baoclaw-core/src/engine/sandbox.rs","lineRange":{"start":95,"end":145}}],"progress":91},{"id":"06-advanced-patterns-slide-14","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: sandbox.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/sandbox.rs</span><span class=\"code-lines\">lines 162-220</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">fn build_docker_args(&amp;self, command: &amp;str, cwd: &amp;Path, image: &amp;str) -&gt; Vec&lt;String&gt; {\n    let mut args = vec![&quot;docker&quot;.to_string(), &quot;run&quot;.to_string()];\n\n    // Remove container after exit\n    args.push(&quot;--rm&quot;.into());\n\n    // Run as current user to avoid permission issues with mounted volumes\n    #[cfg(unix)]\n    {\n        let uid = unsafe { libc::getuid() };\n        let gid = unsafe { libc::getgid() };\n        args.push(&quot;--user&quot;.into());\n        args.push(format!(&quot;{}:{}&quot;, uid, gid));\n    }\n\n    // Memory limit\n    if self.memory_limit_mb &gt; 0 {\n        args.push(format!(&quot;--memory={}m&quot;, self.memory_limit_mb));\n    }\n\n    // Network\n    if !self.allow_network {\n        args.push(&quot;--network=none&quot;.into());\n    }\n\n    // Mount CWD\n    if let Some(cwd_str) = cwd.to_str() {\n        args.push(&quot;-v&quot;.into());\n        args.push(format!(&quot;{}:{}&quot;, cwd_str, cwd_str));\n    }\n    // ... 环境变量、工作目录等\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-10","language":"rust","code":"fn build_docker_args(&self, command: &str, cwd: &Path, image: &str) -> Vec<String> {\n    let mut args = vec![\"docker\".to_string(), \"run\".to_string()];\n\n    // Remove container after exit\n    args.push(\"--rm\".into());\n\n    // Run as current user to avoid permission issues with mounted volumes\n    #[cfg(unix)]\n    {\n        let uid = unsafe { libc::getuid() };\n        let gid = unsafe { libc::getgid() };\n        args.push(\"--user\".into());\n        args.push(format!(\"{}:{}\", uid, gid));\n    }\n\n    // Memory limit\n    if self.memory_limit_mb > 0 {\n        args.push(format!(\"--memory={}m\", self.memory_limit_mb));\n    }\n\n    // Network\n    if !self.allow_network {\n        args.push(\"--network=none\".into());\n    }\n\n    // Mount CWD\n    if let Some(cwd_str) = cwd.to_str() {\n        args.push(\"-v\".into());\n        args.push(format!(\"{}:{}\", cwd_str, cwd_str));\n    }\n    // ... 环境变量、工作目录等\n}","sourcePath":"baoclaw-core/src/engine/sandbox.rs","lineRange":{"start":162,"end":220}}],"progress":91},{"id":"06-advanced-patterns-slide-15","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: sandbox.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/sandbox.rs</span><span class=\"code-lines\">lines 260-283</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Validate the sandbox configuration and return a human-readable error if invalid.\n/// Returns None if everything is OK.\npub fn validate(&amp;self) -&gt; Option&lt;String&gt; {\n    match &amp;self.backend {\n        SandboxBackend::None =&gt; None,\n        SandboxBackend::Bubblewrap =&gt; {\n            if !which_exists(&quot;bwrap&quot;) {\n                Some(&quot;bwrap not found. Install bubblewrap: apt install bubblewrap&quot;.into())\n            } else {\n                None\n            }\n        }\n        SandboxBackend::Docker { image } =&gt; {\n            if !which_exists(&quot;docker&quot;) {\n                return Some(&quot;docker not found in PATH&quot;.into());\n            }\n            if !docker_image_exists(image) {\n                Some(format!(\n                    &quot;Docker image &#39;{}&#39; not found. Build it with: docker build -t {} -f Dockerfile.sandbox .&quot;,\n                    image, image\n                ))\n            } else {\n                None\n            }\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-11","language":"rust","code":"/// Validate the sandbox configuration and return a human-readable error if invalid.\n/// Returns None if everything is OK.\npub fn validate(&self) -> Option<String> {\n    match &self.backend {\n        SandboxBackend::None => None,\n        SandboxBackend::Bubblewrap => {\n            if !which_exists(\"bwrap\") {\n                Some(\"bwrap not found. Install bubblewrap: apt install bubblewrap\".into())\n            } else {\n                None\n            }\n        }\n        SandboxBackend::Docker { image } => {\n            if !which_exists(\"docker\") {\n                return Some(\"docker not found in PATH\".into());\n            }\n            if !docker_image_exists(image) {\n                Some(format!(\n                    \"Docker image '{}' not found. Build it with: docker build -t {} -f Dockerfile.sandbox .\",\n                    image, image\n                ))\n            } else {\n                None\n            }\n        }\n    }\n}","sourcePath":"baoclaw-core/src/engine/sandbox.rs","lineRange":{"start":260,"end":283}}],"progress":92},{"id":"06-advanced-patterns-slide-16","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 15-40</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Structured summary of a completed session, extracted on session close.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SessionSummary {\n    pub session_id: String,\n    pub timestamp: String,\n    pub cwd: String,\n    pub model: String,\n    pub duration_secs: u64,\n    /// Number of user→assistant turns\n    pub turn_count: usize,\n    /// All user messages (truncated to 200 chars each)\n    pub user_topics: Vec&lt;String&gt;,\n    /// Tool usage frequency: (tool_name, count)\n    pub tool_usage: Vec&lt;(String, u32)&gt;,\n    /// Tools that returned errors: (tool_name, error_preview)\n    pub errors: Vec&lt;(String, String)&gt;,\n    /// Total token usage\n    pub total_input_tokens: u64,\n    pub total_output_tokens: u64,\n    pub total_cache_read: u64,\n    pub total_cost_usd: f64,\n    /// Skills that were loaded/used during this session\n    pub skills_used: Vec&lt;String&gt;,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-12","language":"rust","code":"/// Structured summary of a completed session, extracted on session close.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SessionSummary {\n    pub session_id: String,\n    pub timestamp: String,\n    pub cwd: String,\n    pub model: String,\n    pub duration_secs: u64,\n    /// Number of user→assistant turns\n    pub turn_count: usize,\n    /// All user messages (truncated to 200 chars each)\n    pub user_topics: Vec<String>,\n    /// Tool usage frequency: (tool_name, count)\n    pub tool_usage: Vec<(String, u32)>,\n    /// Tools that returned errors: (tool_name, error_preview)\n    pub errors: Vec<(String, String)>,\n    /// Total token usage\n    pub total_input_tokens: u64,\n    pub total_output_tokens: u64,\n    pub total_cache_read: u64,\n    pub total_cost_usd: f64,\n    /// Skills that were loaded/used during this session\n    pub skills_used: Vec<String>,\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":15,"end":40}}],"progress":92},{"id":"06-advanced-patterns-slide-17","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 53-90</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// A recorded interaction trajectory for RLHF training data.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct Trajectory {\n    pub id: String,\n    pub timestamp: String,\n    pub cwd: String,\n    pub user_prompt: String,\n    pub assistant_actions: Vec&lt;TrajectoryAction&gt;,\n    pub outcome: TrajectoryOutcome,\n    pub tool_count: usize,\n    pub duration_ms: u64,\n    /// User signal: was this interaction successful? None = not rated.\n    pub user_rating: Option&lt;TrajectoryRating&gt;,\n}\n\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct TrajectoryAction {\n    pub tool_name: String,\n    pub input_summary: String,\n    pub output_summary: String,\n    pub is_error: bool,\n}\n\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub enum TrajectoryOutcome {\n    /// Task completed normally (end_turn)\n    Completed { final_text_preview: String },\n    /// Task hit max turns\n    MaxTurns,\n    /// Task was aborted by user\n    Aborted,\n    /// Task errored\n    Error { code: String, message: String },\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-13","language":"rust","code":"/// A recorded interaction trajectory for RLHF training data.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct Trajectory {\n    pub id: String,\n    pub timestamp: String,\n    pub cwd: String,\n    pub user_prompt: String,\n    pub assistant_actions: Vec<TrajectoryAction>,\n    pub outcome: TrajectoryOutcome,\n    pub tool_count: usize,\n    pub duration_ms: u64,\n    /// User signal: was this interaction successful? None = not rated.\n    pub user_rating: Option<TrajectoryRating>,\n}\n\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct TrajectoryAction {\n    pub tool_name: String,\n    pub input_summary: String,\n    pub output_summary: String,\n    pub is_error: bool,\n}\n\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub enum TrajectoryOutcome {\n    /// Task completed normally (end_turn)\n    Completed { final_text_preview: String },\n    /// Task hit max turns\n    MaxTurns,\n    /// Task was aborted by user\n    Aborted,\n    /// Task errored\n    Error { code: String, message: String },\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":53,"end":90}}],"progress":93},{"id":"06-advanced-patterns-slide-18","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 200-240</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Record a completed interaction as a trajectory.\npub async fn record_trajectory(&amp;self, trajectory: Trajectory) {\n    let dir = self.base_dir.lock().await;\n    // ... 持久化轨迹\n\n    // Increment task count\n    let mut count = self.task_count.lock().await;\n    *count += 1;\n\n    // Check if we should trigger skill creation\n    if trajectory.tool_count &gt;= SKILL_CREATION_THRESHOLD {\n        if let TrajectoryOutcome::Completed { .. } = &amp;trajectory.outcome {\n            let candidate = self.extract_skill_candidate(&amp;trajectory);\n            self.save_skill_candidate(&amp;*dir, &amp;candidate).await;\n            eprintln!(&quot;Evolution: skill candidate &#39;{}&#39; extracted from trajectory {}&quot;,\n                candidate.name, trajectory.id);\n        }\n    }\n\n    // Check if we should trigger self-evaluation\n    if *count % SELF_EVAL_INTERVAL == 0 &amp;&amp; *count &gt; 0 {\n        eprintln!(&quot;Evolution: self-evaluation triggered at task count {}&quot;, *count);\n        // Write nudge file for system prompt builder\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-14","language":"rust","code":"/// Record a completed interaction as a trajectory.\npub async fn record_trajectory(&self, trajectory: Trajectory) {\n    let dir = self.base_dir.lock().await;\n    // ... 持久化轨迹\n\n    // Increment task count\n    let mut count = self.task_count.lock().await;\n    *count += 1;\n\n    // Check if we should trigger skill creation\n    if trajectory.tool_count >= SKILL_CREATION_THRESHOLD {\n        if let TrajectoryOutcome::Completed { .. } = &trajectory.outcome {\n            let candidate = self.extract_skill_candidate(&trajectory);\n            self.save_skill_candidate(&*dir, &candidate).await;\n            eprintln!(\"Evolution: skill candidate '{}' extracted from trajectory {}\",\n                candidate.name, trajectory.id);\n        }\n    }\n\n    // Check if we should trigger self-evaluation\n    if *count % SELF_EVAL_INTERVAL == 0 && *count > 0 {\n        eprintln!(\"Evolution: self-evaluation triggered at task count {}\", *count);\n        // Write nudge file for system prompt builder\n    }\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":200,"end":240}}],"progress":93},{"id":"06-advanced-patterns-slide-19","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 250-275</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Extract a skill candidate from a successful trajectory.\nfn extract_skill_candidate(&amp;self, trajectory: &amp;Trajectory) -&gt; SkillCandidate {\n    // Build a procedure description from the tool actions\n    let steps: Vec&lt;String&gt; = trajectory.assistant_actions.iter()\n        .filter(|a| !a.is_error)\n        .enumerate()\n        .map(|(i, a)| format!(&quot;{}. Use `{}`: {}&quot;, i + 1, a.tool_name, a.input_summary))\n        .collect();\n\n    let procedure = steps.join(&quot;\\n&quot;);\n\n    // Derive a name from the user prompt (first 50 chars, slugified)\n    let name_raw = trajectory.user_prompt.chars().take(50).collect::&lt;String&gt;();\n    let name = slugify(&amp;name_raw);\n\n    SkillCandidate {\n        name,\n        description: format!(&quot;Auto-generated from: {}&quot;, \n            trajectory.user_prompt.chars().take(100).collect::&lt;String&gt;()),\n        trigger_pattern: trajectory.user_prompt.chars().take(200).collect(),\n        procedure,\n        source_trajectory_id: trajectory.id.clone(),\n        created_at: chrono::Utc::now().to_rfc3339(),\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-15","language":"rust","code":"/// Extract a skill candidate from a successful trajectory.\nfn extract_skill_candidate(&self, trajectory: &Trajectory) -> SkillCandidate {\n    // Build a procedure description from the tool actions\n    let steps: Vec<String> = trajectory.assistant_actions.iter()\n        .filter(|a| !a.is_error)\n        .enumerate()\n        .map(|(i, a)| format!(\"{}. Use `{}`: {}\", i + 1, a.tool_name, a.input_summary))\n        .collect();\n\n    let procedure = steps.join(\"\\n\");\n\n    // Derive a name from the user prompt (first 50 chars, slugified)\n    let name_raw = trajectory.user_prompt.chars().take(50).collect::<String>();\n    let name = slugify(&name_raw);\n\n    SkillCandidate {\n        name,\n        description: format!(\"Auto-generated from: {}\", \n            trajectory.user_prompt.chars().take(100).collect::<String>()),\n        trigger_pattern: trajectory.user_prompt.chars().take(200).collect(),\n        procedure,\n        source_trajectory_id: trajectory.id.clone(),\n        created_at: chrono::Utc::now().to_rfc3339(),\n    }\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":250,"end":275}}],"progress":94},{"id":"06-advanced-patterns-slide-20","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 285-305</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Promote a skill candidate to an actual skill file.\n/// Skills go to ~/.baoclaw/skills/ (personal, cross-project) by default.\npub async fn promote_skill(&amp;self, _cwd: &amp;Path, candidate_name: &amp;str, \n                            skill_content: &amp;str) -&gt; Result&lt;String, String&gt; {\n    let home = std::env::var(&quot;HOME&quot;).unwrap_or_else(|_| &quot;/tmp&quot;.to_string());\n    let skills_dir = PathBuf::from(home).join(&quot;.baoclaw&quot;).join(&quot;skills&quot;);\n    let _ = std::fs::create_dir_all(&amp;skills_dir);\n\n    let skill_path = skills_dir.join(format!(&quot;{}.md&quot;, candidate_name));\n    std::fs::write(&amp;skill_path, skill_content)\n        .map_err(|e| format!(&quot;Failed to write skill: {}&quot;, e))?;\n\n    // Remove the candidate file\n    let dir = self.base_dir.lock().await;\n    let candidate_path = dir.join(&quot;candidates&quot;).join(format!(&quot;{}.json&quot;, candidate_name));\n    let _ = std::fs::remove_file(&amp;candidate_path);\n\n    eprintln!(&quot;Evolution: promoted skill &#39;{}&#39; to {}&quot;, candidate_name, skill_path.display());\n    Ok(skill_path.to_string_lossy().to_string())\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-16","language":"rust","code":"/// Promote a skill candidate to an actual skill file.\n/// Skills go to ~/.baoclaw/skills/ (personal, cross-project) by default.\npub async fn promote_skill(&self, _cwd: &Path, candidate_name: &str, \n                            skill_content: &str) -> Result<String, String> {\n    let home = std::env::var(\"HOME\").unwrap_or_else(|_| \"/tmp\".to_string());\n    let skills_dir = PathBuf::from(home).join(\".baoclaw\").join(\"skills\");\n    let _ = std::fs::create_dir_all(&skills_dir);\n\n    let skill_path = skills_dir.join(format!(\"{}.md\", candidate_name));\n    std::fs::write(&skill_path, skill_content)\n        .map_err(|e| format!(\"Failed to write skill: {}\", e))?;\n\n    // Remove the candidate file\n    let dir = self.base_dir.lock().await;\n    let candidate_path = dir.join(\"candidates\").join(format!(\"{}.json\", candidate_name));\n    let _ = std::fs::remove_file(&candidate_path);\n\n    eprintln!(\"Evolution: promoted skill '{}' to {}\", candidate_name, skill_path.display());\n    Ok(skill_path.to_string_lossy().to_string())\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":285,"end":305}}],"progress":94},{"id":"06-advanced-patterns-slide-21","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 390-470</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Called when the last client disconnects from a shared session.\n/// Extracts a structured summary from the session transcript.\npub async fn on_session_close(\n    &amp;self,\n    session_id: &amp;str,\n    cwd: &amp;str,\n    model: &amp;str,\n    messages: &amp;[crate::models::message::Message],\n    total_usage: &amp;crate::models::message::Usage,\n    total_cost_usd: f64,\n    session_duration_secs: u64,\n) {\n    // Extract user topics, tool usage, errors, skills used\n    let mut user_topics: Vec&lt;String&gt; = Vec::new();\n    let mut tool_counts: HashMap&lt;String, u32&gt; = HashMap::new();\n    let mut errors: Vec&lt;(String, String)&gt; = Vec::new();\n    let mut skills_used: Vec&lt;String&gt; = Vec::new();\n\n    for msg in messages {\n        // Parse messages to extract structured data\n        match &amp;msg.content {\n            MessageContent::User { message, .. } =&gt; {\n                // Extract user text topics\n                let text = extract_text_from_value(&amp;message.content);\n                if !text.is_empty() {\n                    user_topics.push(text.chars().take(200).collect());\n                }\n            }\n            MessageContent::Assistant { message, .. } =&gt; {\n                for block in &amp;message.content {\n                    if let ContentBlock::ToolUse { name, input, .. } = block {\n                        *tool_counts.entry(name.clone()).or_insert(0) += 1;\n                    }\n                }\n            }\n            _ =&gt; {}\n        }\n    }\n\n    // Build and persist SessionSummary\n    // Generate pending_review.json for next session\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-17","language":"rust","code":"/// Called when the last client disconnects from a shared session.\n/// Extracts a structured summary from the session transcript.\npub async fn on_session_close(\n    &self,\n    session_id: &str,\n    cwd: &str,\n    model: &str,\n    messages: &[crate::models::message::Message],\n    total_usage: &crate::models::message::Usage,\n    total_cost_usd: f64,\n    session_duration_secs: u64,\n) {\n    // Extract user topics, tool usage, errors, skills used\n    let mut user_topics: Vec<String> = Vec::new();\n    let mut tool_counts: HashMap<String, u32> = HashMap::new();\n    let mut errors: Vec<(String, String)> = Vec::new();\n    let mut skills_used: Vec<String> = Vec::new();\n\n    for msg in messages {\n        // Parse messages to extract structured data\n        match &msg.content {\n            MessageContent::User { message, .. } => {\n                // Extract user text topics\n                let text = extract_text_from_value(&message.content);\n                if !text.is_empty() {\n                    user_topics.push(text.chars().take(200).collect());\n                }\n            }\n            MessageContent::Assistant { message, .. } => {\n                for block in &message.content {\n                    if let ContentBlock::ToolUse { name, input, .. } = block {\n                        *tool_counts.entry(name.clone()).or_insert(0) += 1;\n                    }\n                }\n            }\n            _ => {}\n        }\n    }\n\n    // Build and persist SessionSummary\n    // Generate pending_review.json for next session\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":390,"end":470}}],"progress":95},{"id":"06-advanced-patterns-slide-22","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 340-385</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Build a system prompt fragment for the evolution system.\npub async fn build_prompt_fragment(&amp;self, _cwd: &amp;Path) -&gt; Option&lt;String&gt; {\n    let mut parts = Vec::new();\n\n    // Check for pending session review (from previous session&#39;s close hook)\n    if review exists {\n        parts.push(format!(\n            &quot;# 🔁 Last Session Review (Auto-Generated)\\n\\\n            The previous session `{}` had {} turns. Here&#39;s what happened:\\n\\\n            \\n\\\n            ## User Topics:\\n{}\\n\\\n            \\n\\\n            ## Tools Used:\\n{}\\n\\\n            \\n\\\n            **Self-improvement nudge**: Reflect on the above. Ask yourself:\\n\\\n            - Were there repetitive patterns that should become a skill?\\n\\\n            - Did any errors reveal a gap in your knowledge or approach?\\n\\\n            - Should any preferences or decisions be saved to long-term memory?\\n&quot;,\n            session_id, turn_count, topics_str, tools_str,\n        ));\n    }\n\n    // List pending skill candidates\n    let candidates = self.list_candidates().await;\n    if !candidates.is_empty() {\n        parts.push(&quot;# Pending Skill Candidates\\n\\nThe following skill candidates were auto-extracted. Consider promoting the useful ones:\\n&quot;.to_string());\n    }\n\n    if parts.is_empty() { None } else { Some(parts.join(&quot;\\n&quot;)) }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-18","language":"rust","code":"/// Build a system prompt fragment for the evolution system.\npub async fn build_prompt_fragment(&self, _cwd: &Path) -> Option<String> {\n    let mut parts = Vec::new();\n\n    // Check for pending session review (from previous session's close hook)\n    if review exists {\n        parts.push(format!(\n            \"# 🔁 Last Session Review (Auto-Generated)\\n\\\n            The previous session `{}` had {} turns. Here's what happened:\\n\\\n            \\n\\\n            ## User Topics:\\n{}\\n\\\n            \\n\\\n            ## Tools Used:\\n{}\\n\\\n            \\n\\\n            **Self-improvement nudge**: Reflect on the above. Ask yourself:\\n\\\n            - Were there repetitive patterns that should become a skill?\\n\\\n            - Did any errors reveal a gap in your knowledge or approach?\\n\\\n            - Should any preferences or decisions be saved to long-term memory?\\n\",\n            session_id, turn_count, topics_str, tools_str,\n        ));\n    }\n\n    // List pending skill candidates\n    let candidates = self.list_candidates().await;\n    if !candidates.is_empty() {\n        parts.push(\"# Pending Skill Candidates\\n\\nThe following skill candidates were auto-extracted. Consider promoting the useful ones:\\n\".to_string());\n    }\n\n    if parts.is_empty() { None } else { Some(parts.join(\"\\n\")) }\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":340,"end":385}}],"progress":95},{"id":"06-advanced-patterns-slide-23","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: evolution.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/evolution.rs</span><span class=\"code-lines\">lines 127-160</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Grade assigned to a skill during evaluation.\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum SkillGrade {\n    Excellent,\n    Good,\n    NeedsImprovement,\n    Poor,\n    Critical,\n    InsufficientData,\n}\n\n/// Suggested action based on skill evaluation.\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum SuggestedAction {\n    None,\n    MinorTweak,\n    Improve,\n    MajorRevision,\n    Retire,\n}\n\n/// Result of evaluating a skill&#39;s effectiveness.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SkillEvaluation {\n    pub skill_name: String,\n    pub score: f64,\n    pub grade: SkillGrade,\n    pub diagnostics: Vec&lt;String&gt;,\n    pub suggested_action: SuggestedAction,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-19","language":"rust","code":"/// Grade assigned to a skill during evaluation.\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum SkillGrade {\n    Excellent,\n    Good,\n    NeedsImprovement,\n    Poor,\n    Critical,\n    InsufficientData,\n}\n\n/// Suggested action based on skill evaluation.\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum SuggestedAction {\n    None,\n    MinorTweak,\n    Improve,\n    MajorRevision,\n    Retire,\n}\n\n/// Result of evaluating a skill's effectiveness.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SkillEvaluation {\n    pub skill_name: String,\n    pub score: f64,\n    pub grade: SkillGrade,\n    pub diagnostics: Vec<String>,\n    pub suggested_action: SuggestedAction,\n}","sourcePath":"baoclaw-core/src/engine/evolution.rs","lineRange":{"start":127,"end":160}}],"progress":96},{"id":"06-advanced-patterns-slide-24","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：允许网络访问且挂载敏感目录\nlet config = SandboxConfig {\n    backend: SandboxBackend::Bubblewrap,\n    rw_mounts: vec![&quot;/&quot;.to_string()], // 挂载整个根目录\n    allow_network: true,\n    ..SandboxConfig::default()\n};</code></pre>\n","type":"code","codeBlocks":[{"id":"code-20","language":"rust","code":"// ❌ 错误：允许网络访问且挂载敏感目录\nlet config = SandboxConfig {\n    backend: SandboxBackend::Bubblewrap,\n    rw_mounts: vec![\"/\".to_string()], // 挂载整个根目录\n    allow_network: true,\n    ..SandboxConfig::default()\n};"}],"progress":96},{"id":"06-advanced-patterns-slide-25","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：只挂载必要目录，禁用网络\nlet config = SandboxConfig {\n    backend: SandboxBackend::Bubblewrap,\n    rw_mounts: vec![&quot;/home/user/project&quot;.to_string()],\n    allow_network: false, // 禁用网络\n    ..SandboxConfig::default()\n};</code></pre>\n","type":"code","codeBlocks":[{"id":"code-21","language":"rust","code":"// ✅ 正确：只挂载必要目录，禁用网络\nlet config = SandboxConfig {\n    backend: SandboxBackend::Bubblewrap,\n    rw_mounts: vec![\"/home/user/project\".to_string()],\n    allow_network: false, // 禁用网络\n    ..SandboxConfig::default()\n};"}],"progress":97},{"id":"06-advanced-patterns-slide-26","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：假设沙箱一定可用\nlet config = SandboxConfig::auto_detect();\nlet args = config.build_command_args(&quot;rm -rf /&quot;, cwd);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-22","language":"rust","code":"// ❌ 错误：假设沙箱一定可用\nlet config = SandboxConfig::auto_detect();\nlet args = config.build_command_args(\"rm -rf /\", cwd);"}],"progress":97},{"id":"06-advanced-patterns-slide-27","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：验证沙箱配置\nlet config = SandboxConfig::auto_detect();\nif let Some(err) = config.validate() {\n    eprintln!(&quot;Sandbox validation failed: {}&quot;, err);\n    // 降级或终止\n}\nlet args = config.build_command_args(cmd, cwd);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-23","language":"rust","code":"// ✅ 正确：验证沙箱配置\nlet config = SandboxConfig::auto_detect();\nif let Some(err) = config.validate() {\n    eprintln!(\"Sandbox validation failed: {}\", err);\n    // 降级或终止\n}\nlet args = config.build_command_args(cmd, cwd);"}],"progress":98},{"id":"06-advanced-patterns-slide-28","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">安全性: None &lt; Bubblewrap &lt; Docker &lt; gVisor\n效率:   None &gt; Bubblewrap &gt; Docker &gt; gVisor</code></pre>\n","type":"code","codeBlocks":[{"id":"code-24","language":"other","code":"安全性: None < Bubblewrap < Docker < gVisor\n效率:   None > Bubblewrap > Docker > gVisor"}],"progress":98},{"id":"06-advanced-patterns-slide-29","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"思考","content":"<p><!-- Requirements: 5.4 讨论替代方案与权衡决策 --></p>\n<h3>替代方案</h3>\n<p>#### 沙箱执行方案对比</p>\n<p>| 方案 | 优点 | 缺点 | 适用场景 |\n|------|------|------|----------|\n| 无沙箱 | 性能最优 | 安全风险高 | 本地开发、可信环境 |\n| Bubblewrap | 轻量、启动快 | 仅限 Linux | 生产环境首选 |\n| Docker | 安全性高、跨平台 | 启动慢、资源占用 | 高安全要求 |\n| gVisor | 内核级隔离 | 复杂度高 | 金融、医疗等敏感场景 |\n| Firecracker | 微 VM、极快 | 需要 KVM | Serverless、多租户 |</p>\n<p>#### 自我进化方案对比</p>\n<p>| 方案 | 实现方式 | 优点 | 缺点 |\n|------|----------|------|------|\n| 轨迹学习 ✓ | 记录交互提取技能 | 自动化、无额外成本 | 需要人工审核 |\n| RLHF 微调 | 收集偏好数据训练 | 效果持久 | 需要大量数据、计算资源 |\n| 检索增强 | 向量数据库存储经验 | 实时性强 | 需要额外检索开销 |\n| 规则引擎 | 预定义规则 | 可控性强 | 缺乏灵活性 |</p>\n<h3>权衡决策</h3>\n<p>#### 沙箱安全 vs 开发效率</p>\n<p>``<code>\n安全性: None < Bubblewrap < Docker < gVisor\n效率:   None > Bubblewrap > Docker > gVisor\n</code>`<code></p>\n<p><strong>决策建议：</strong></p>\n<p>- <strong>开发环境</strong>: </code>None<code> 或 </code>Bubblewrap<code>（快速迭代）\n- <strong>生产环境</strong>: </code>Bubblewrap<code> 或 </code>Docker<code>（安全优先）\n- <strong>高安全场景</strong>: </code>Docker<code> + 只读文件系统 + 禁用网络</p>\n<p>#### 自动进化 vs 人工控制</p>\n<p><strong>自动化的风险：</strong></p>\n<p>- 可能学习到错误的模式\n- 技能质量难以保证\n- 需要审核机制</p>\n<p><strong>BaoClaw 的平衡：</strong></p>\n<p>- 自动提取技能候选 → 存入 </code>candidates/<code> 目录\n- 人工审核或 LLM 评估 → 决定是否提升\n- 定期自评估 → 淘汰效果差的技能</p>\n<h3>设计决策：为什么选择 Bubblewrap 作为默认沙箱？</h3>\n<p><strong>优点：</strong></p>\n<p>1. <strong>轻量级</strong>: 基于 Linux namespace，无容器开销\n2. <strong>启动快</strong>: 毫秒级启动，适合高频工具调用\n3. <strong>非特权</strong>: 普通用户即可运行，无需 root\n4. <strong>广泛可用</strong>: 大多数 Linux 发行版支持</p>\n<p><strong>缺点：</strong></p>\n<p>1. 仅限 Linux（macOS/Windows 需要 Docker）\n2. 需要安装 </code>bwrap` 命令</p>\n<p><strong>结论:</strong> 对于 BaoClaw 的主要部署环境（Linux 服务器），Bubblewrap 提供了最佳的安全/性能平衡。</p>\n<p>---</p>\n","type":"reflection","progress":99},{"id":"06-advanced-patterns-slide-30","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"总结","content":"<p><!-- Requirements: 5.5 提供要点总结与延伸阅读链接 --></p>\n<h3>核心要点</h3>\n<p>- <strong>沙箱执行</strong>：通过隔离环境限制工具执行的风险，支持 Bubblewrap 和 Docker 两种后端\n- <strong>自我进化引擎</strong>：从交互轨迹中自动提取技能，实现持续改进\n- <strong>技能生命周期</strong>：候选提取 → 审核 → 提升 → 评估 → 淘汰\n- <strong>会话钩子</strong>：会话关闭时生成摘要，为下次提供反思上下文</p>\n<h3>关键概念回顾</h3>\n<p>1. <strong>SandboxBackend</strong>: 三种沙箱后端（None/Bubblewrap/Docker），根据环境自动选择\n2. <strong>SandboxConfig</strong>: 沙箱配置，控制挂载、网络、资源限制\n3. <strong>Trajectory</strong>: 完整的交互轨迹记录，用于技能提取和 RLHF 训练\n4. <strong>SessionSummary</strong>: 会话级别的统计摘要，包含主题、工具使用、错误信息\n5. <strong>SkillCandidate</strong>: 从成功交互中自动提取的技能候选</p>\n<h3>延伸阅读</h3>\n<p>#### 官方资源</p>\n<p>- <a href=\"./../../../baoclaw-core/src/engine/sandbox.rs\">Sandbox 源码</a> - 沙箱执行完整实现\n- <a href=\"./../../../baoclaw-core/src/engine/evolution.rs\">Evolution 源码</a> - 自我进化引擎实现\n- <a href=\"https://github.com/baoclaw/baoclaw\">BaoClaw GitHub</a> - 完整项目源码</p>\n<p>#### 相关章节</p>\n<p>- <a href=\"./../05-production/\">权限控制</a> - 工具权限检查与用户确认\n- <a href=\"./../05-production/\">错误处理与恢复</a> - 模型降级与故障恢复</p>\n<p>#### 外部资源</p>\n<p>- <a href=\"https://github.com/containers/bubblewrap\">Bubblewrap 文档</a> - Linux namespace 沙箱\n- <a href=\"https://docs.docker.com/engine/security/\">Docker 安全最佳实践</a> - 容器安全指南\n- <a href=\"https://arxiv.org/abs/2203.02155\">RLHF 论文</a> - 人类反馈强化学习\n</p>","type":"summary","progress":99}],"toc":{"chapters":[{"id":"01-fundamentals","title":"Agent 基础","sections":["问题","模式","实现","思考","总结"],"slideCount":6,"slides":[{"id":"01-fundamentals-00","title":"Agent 基础","type":"title"},{"id":"01-fundamentals-01","title":"问题","type":"problem"},{"id":"01-fundamentals-02","title":"模式","type":"pattern"},{"id":"01-fundamentals-03","title":"实现","type":"implementation"},{"id":"01-fundamentals-04","title":"思考","type":"reflection"},{"id":"01-fundamentals-05","title":"总结","type":"summary"}]},{"id":"02-core-implementation","title":"工具系统与扩展","sections":["问题","模式","实现","思考","总结"],"slideCount":6,"slides":[{"id":"02-core-implementation-00","title":"工具系统与扩展","type":"title"},{"id":"02-core-implementation-01","title":"问题","type":"problem"},{"id":"02-core-implementation-02","title":"模式","type":"pattern"},{"id":"02-core-implementation-03","title":"实现","type":"implementation"},{"id":"02-core-implementation-04","title":"思考","type":"reflection"},{"id":"02-core-implementation-05","title":"总结","type":"summary"}]},{"id":"03-memory-context","title":"记忆与上下文","sections":["问题","模式","实现","思考","总结"],"slideCount":6,"slides":[{"id":"03-memory-context-00","title":"记忆与上下
