emory-context","chapterTitle":"记忆与上下文","title":"代码示例: memory.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/memory.rs</span><span class=\"code-lines\">lines 98-120</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Add a new memory entry.\n    pub async fn add(&amp;self, content: String, category: MemoryCategory, source: String) -&gt; MemoryEntry {\n        let entry = MemoryEntry {\n            id: uuid::Uuid::new_v4().to_string()[..8].to_string(),\n            content,\n            category,\n            created_at: chrono::Utc::now().to_rfc3339(),\n            source,\n        };\n        let mut entries = self.entries.lock().await;\n        entries.push(entry.clone());\n        // Append to file (JSONL format)\n        if let Ok(line) = serde_json::to_string(&amp;entry) {\n            use std::io::Write;\n            let fp = self.file_path.lock().await;\n            if let Ok(mut f) = std::fs::OpenOptions::new().create(true).append(true).open(&amp;*fp) {\n                let _ = writeln!(f, &quot;{}&quot;, line);\n            }\n        }\n        entry\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-10","language":"rust","code":"    /// Add a new memory entry.\n    pub async fn add(&self, content: String, category: MemoryCategory, source: String) -> MemoryEntry {\n        let entry = MemoryEntry {\n            id: uuid::Uuid::new_v4().to_string()[..8].to_string(),\n            content,\n            category,\n            created_at: chrono::Utc::now().to_rfc3339(),\n            source,\n        };\n        let mut entries = self.entries.lock().await;\n        entries.push(entry.clone());\n        // Append to file (JSONL format)\n        if let Ok(line) = serde_json::to_string(&entry) {\n            use std::io::Write;\n            let fp = self.file_path.lock().await;\n            if let Ok(mut f) = std::fs::OpenOptions::new().create(true).append(true).open(&*fp) {\n                let _ = writeln!(f, \"{}\", line);\n            }\n        }\n        entry\n    }","sourcePath":"baoclaw-core/src/engine/memory.rs","lineRange":{"start":98,"end":120}}],"progress":35},{"id":"03-memory-context-slide-15","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: memory.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/memory.rs</span><span class=\"code-lines\">lines 138-172</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Build a system prompt fragment from all memories.\n    pub async fn build_prompt_fragment(&amp;self) -&gt; Option&lt;String&gt; {\n        let entries = self.entries.lock().await;\n        if entries.is_empty() {\n            return None;\n        }\n\n        let mut parts = Vec::new();\n        parts.push(&quot;# Long-term Memory\\n\\nThe following are facts, preferences, and decisions remembered from previous conversations.\\n&quot;.to_string());\n\n        let facts: Vec&lt;&amp;MemoryEntry&gt; = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Fact)).collect();\n        let prefs: Vec&lt;&amp;MemoryEntry&gt; = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Preference)).collect();\n        let decisions: Vec&lt;&amp;MemoryEntry&gt; = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Decision)).collect();\n\n        if !facts.is_empty() {\n            parts.push(&quot;## Facts&quot;.to_string());\n            for e in &amp;facts {\n                parts.push(format!(&quot;- {}&quot;, e.content));\n            }\n        }\n        // ... 类似处理 Preferences 和 Decisions\n\n        Some(parts.join(&quot;\\n&quot;))\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-11","language":"rust","code":"    /// Build a system prompt fragment from all memories.\n    pub async fn build_prompt_fragment(&self) -> Option<String> {\n        let entries = self.entries.lock().await;\n        if entries.is_empty() {\n            return None;\n        }\n\n        let mut parts = Vec::new();\n        parts.push(\"# Long-term Memory\\n\\nThe following are facts, preferences, and decisions remembered from previous conversations.\\n\".to_string());\n\n        let facts: Vec<&MemoryEntry> = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Fact)).collect();\n        let prefs: Vec<&MemoryEntry> = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Preference)).collect();\n        let decisions: Vec<&MemoryEntry> = entries.iter().filter(|e| matches!(e.category, MemoryCategory::Decision)).collect();\n\n        if !facts.is_empty() {\n            parts.push(\"## Facts\".to_string());\n            for e in &facts {\n                parts.push(format!(\"- {}\", e.content));\n            }\n        }\n        // ... 类似处理 Preferences 和 Decisions\n\n        Some(parts.join(\"\\n\"))\n    }","sourcePath":"baoclaw-core/src/engine/memory.rs","lineRange":{"start":138,"end":172}}],"progress":36},{"id":"03-memory-context-slide-16","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: session_memory.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/session_memory.rs</span><span class=\"code-lines\">lines 14-41</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Minimum turns before first summary generation.\nconst FIRST_UPDATE_THRESHOLD: usize = 6;\n\n/// Number of new messages between summary updates.\nconst UPDATE_INTERVAL: usize = 10;\n\n/// Maximum summary length (chars). Summaries exceeding this are truncated.\nconst MAX_SUMMARY_CHARS: usize = 8000;\n\n/// Session-level rolling summary persisted to disk.\npub struct SessionMemory {\n    file_path: PathBuf,\n    content: Mutex&lt;String&gt;,\n    last_update_count: Mutex&lt;usize&gt;,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-12","language":"rust","code":"/// Minimum turns before first summary generation.\nconst FIRST_UPDATE_THRESHOLD: usize = 6;\n\n/// Number of new messages between summary updates.\nconst UPDATE_INTERVAL: usize = 10;\n\n/// Maximum summary length (chars). Summaries exceeding this are truncated.\nconst MAX_SUMMARY_CHARS: usize = 8000;\n\n/// Session-level rolling summary persisted to disk.\npub struct SessionMemory {\n    file_path: PathBuf,\n    content: Mutex<String>,\n    last_update_count: Mutex<usize>,\n}","sourcePath":"baoclaw-core/src/engine/session_memory.rs","lineRange":{"start":14,"end":41}}],"progress":36},{"id":"03-memory-context-slide-17","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: session_memory.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/session_memory.rs</span><span class=\"code-lines\">lines 43-70</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">impl SessionMemory {\n    /// Compute the file path for a given session ID.\n    pub fn path_for(session_id: &amp;str) -&gt; PathBuf {\n        let home = std::env::var(&quot;HOME&quot;).unwrap_or_else(|_| &quot;/tmp&quot;.to_string());\n        PathBuf::from(home)\n            .join(&quot;.baoclaw&quot;)\n            .join(&quot;sessions&quot;)\n            .join(format!(&quot;{}.memory.md&quot;, session_id))\n    }\n\n    /// Load an existing session memory file. Returns empty string if missing.\n    pub fn load(session_id: &amp;str) -&gt; Self {\n        let file_path = Self::path_for(session_id);\n        let _ = fs::create_dir_all(file_path.parent().unwrap_or(&amp;file_path));\n        let content = fs::read_to_string(&amp;file_path).unwrap_or_default();\n\n        Self {\n            file_path,\n            content: Mutex::new(content),\n            last_update_count: Mutex::new(0),\n        }\n    }\n\n    /// Return the current summary text.\n    pub fn get(&amp;self) -&gt; String {\n        self.content.lock().unwrap_or_else(|e| e.into_inner()).clone()\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-13","language":"rust","code":"impl SessionMemory {\n    /// Compute the file path for a given session ID.\n    pub fn path_for(session_id: &str) -> PathBuf {\n        let home = std::env::var(\"HOME\").unwrap_or_else(|_| \"/tmp\".to_string());\n        PathBuf::from(home)\n            .join(\".baoclaw\")\n            .join(\"sessions\")\n            .join(format!(\"{}.memory.md\", session_id))\n    }\n\n    /// Load an existing session memory file. Returns empty string if missing.\n    pub fn load(session_id: &str) -> Self {\n        let file_path = Self::path_for(session_id);\n        let _ = fs::create_dir_all(file_path.parent().unwrap_or(&file_path));\n        let content = fs::read_to_string(&file_path).unwrap_or_default();\n\n        Self {\n            file_path,\n            content: Mutex::new(content),\n            last_update_count: Mutex::new(0),\n        }\n    }\n\n    /// Return the current summary text.\n    pub fn get(&self) -> String {\n        self.content.lock().unwrap_or_else(|e| e.into_inner()).clone()\n    }\n}","sourcePath":"baoclaw-core/src/engine/session_memory.rs","lineRange":{"start":43,"end":70}}],"progress":37},{"id":"03-memory-context-slide-18","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: session_memory.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/session_memory.rs</span><span class=\"code-lines\">lines 76-94</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Whether enough new messages have arrived to warrant an update.\n    pub fn should_update(&amp;self, message_count: usize) -&gt; bool {\n        let guard = self.content.lock().unwrap_or_else(|e| e.into_inner());\n        let current = guard.trim();\n        if current.is_empty() || current.len() &lt;= 20 {\n            // No real summary yet — update after first few messages.\n            drop(guard);\n            message_count &gt;= FIRST_UPDATE_THRESHOLD  // &gt;= 6\n        } else {\n            let last = *self.last_update_count.lock().unwrap_or_else(|e| e.into_inner());\n            drop(guard);\n            message_count &gt;= last + UPDATE_INTERVAL  // +10\n        }\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-14","language":"rust","code":"    /// Whether enough new messages have arrived to warrant an update.\n    pub fn should_update(&self, message_count: usize) -> bool {\n        let guard = self.content.lock().unwrap_or_else(|e| e.into_inner());\n        let current = guard.trim();\n        if current.is_empty() || current.len() <= 20 {\n            // No real summary yet — update after first few messages.\n            drop(guard);\n            message_count >= FIRST_UPDATE_THRESHOLD  // >= 6\n        } else {\n            let last = *self.last_update_count.lock().unwrap_or_else(|e| e.into_inner());\n            drop(guard);\n            message_count >= last + UPDATE_INTERVAL  // +10\n        }\n    }","sourcePath":"baoclaw-core/src/engine/session_memory.rs","lineRange":{"start":76,"end":94}}],"progress":37},{"id":"03-memory-context-slide-19","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: session_memory.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/session_memory.rs</span><span class=\"code-lines\">lines 96-116</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Write a new summary to memory (and persist to disk).\n    pub fn update(&amp;self, summary: String) {\n        // Security scan before persisting memory\n        if let Err(reason) = validate_memory_content(&amp;summary) {\n            eprintln!(&quot;Memory content blocked by security scan: {}&quot;, reason);\n            return;\n        }\n\n        let truncated = if summary.len() &gt; MAX_SUMMARY_CHARS {\n            format!(&quot;{}...\\n\\n[Summary truncated at {} chars]&quot;,\n                &amp;summary.chars().take(MAX_SUMMARY_CHARS).collect::&lt;String&gt;(),\n                summary.len())\n        } else {\n            summary\n        };\n        let mut guard = self.content.lock().unwrap_or_else(|e| e.into_inner());\n        *guard = truncated;\n        let _ = fs::write(&amp;self.file_path, guard.as_bytes());\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-15","language":"rust","code":"    /// Write a new summary to memory (and persist to disk).\n    pub fn update(&self, summary: String) {\n        // Security scan before persisting memory\n        if let Err(reason) = validate_memory_content(&summary) {\n            eprintln!(\"Memory content blocked by security scan: {}\", reason);\n            return;\n        }\n\n        let truncated = if summary.len() > MAX_SUMMARY_CHARS {\n            format!(\"{}...\\n\\n[Summary truncated at {} chars]\",\n                &summary.chars().take(MAX_SUMMARY_CHARS).collect::<String>(),\n                summary.len())\n        } else {\n            summary\n        };\n        let mut guard = self.content.lock().unwrap_or_else(|e| e.into_inner());\n        *guard = truncated;\n        let _ = fs::write(&self.file_path, guard.as_bytes());\n    }","sourcePath":"baoclaw-core/src/engine/session_memory.rs","lineRange":{"start":96,"end":116}}],"progress":38},{"id":"03-memory-context-slide-20","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: token_counter.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/token_counter.rs</span><span class=\"code-lines\">lines 24-44</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Persisted token counter state for fast startup recovery.\n#[derive(serde::Serialize, serde::Deserialize, Debug)]\npub struct TokenBaseline {\n    pub last_known_input_tokens: u64,\n    pub last_known_message_count: usize,\n}\n\n/// Tracks input-token usage per session, calibrated against real API responses.\n#[derive(Debug)]\npub struct TokenCounter {\n    /// Last known input token count from API (authoritative).\n    last_known_input_tokens: Option&lt;u64&gt;,\n    /// Message count at the time `last_known_input_tokens` was captured.\n    last_known_message_count: usize,\n    /// Auto-compact threshold as fraction of `context_window` (e.g. 0.7 = 70%).\n    threshold_ratio: f64,\n    /// Model&#39;s context window size in tokens (e.g. 200_000 for Claude).\n    context_window: u64,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-16","language":"rust","code":"/// Persisted token counter state for fast startup recovery.\n#[derive(serde::Serialize, serde::Deserialize, Debug)]\npub struct TokenBaseline {\n    pub last_known_input_tokens: u64,\n    pub last_known_message_count: usize,\n}\n\n/// Tracks input-token usage per session, calibrated against real API responses.\n#[derive(Debug)]\npub struct TokenCounter {\n    /// Last known input token count from API (authoritative).\n    last_known_input_tokens: Option<u64>,\n    /// Message count at the time `last_known_input_tokens` was captured.\n    last_known_message_count: usize,\n    /// Auto-compact threshold as fraction of `context_window` (e.g. 0.7 = 70%).\n    threshold_ratio: f64,\n    /// Model's context window size in tokens (e.g. 200_000 for Claude).\n    context_window: u64,\n}","sourcePath":"baoclaw-core/src/engine/token_counter.rs","lineRange":{"start":24,"end":44}}],"progress":38},{"id":"03-memory-context-slide-21","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: token_counter.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/token_counter.rs</span><span class=\"code-lines\">lines 67-79</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Count tokens in a text string using the cl100k_base BPE tokeniser.\n    /// cl100k is the tokeniser used by gpt-4/gpt-3.5. For Claude it over-counts\n    /// by ~5-10%, which is still an order of magnitude more accurate than the\n    /// previous `chars / 4` heuristic (which undercounted Chinese by 4-8×).\n    pub fn count_text_tokens(text: &amp;str) -&gt; u64 {\n        match tiktoken_rs::cl100k_base() {\n            Ok(bpe) =&gt; bpe.encode_with_special_tokens(text).len() as u64,\n            Err(_) =&gt; (text.chars().count() as u64).saturating_mul(3) / 4,\n        }\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-17","language":"rust","code":"    /// Count tokens in a text string using the cl100k_base BPE tokeniser.\n    /// cl100k is the tokeniser used by gpt-4/gpt-3.5. For Claude it over-counts\n    /// by ~5-10%, which is still an order of magnitude more accurate than the\n    /// previous `chars / 4` heuristic (which undercounted Chinese by 4-8×).\n    pub fn count_text_tokens(text: &str) -> u64 {\n        match tiktoken_rs::cl100k_base() {\n            Ok(bpe) => bpe.encode_with_special_tokens(text).len() as u64,\n            Err(_) => (text.chars().count() as u64).saturating_mul(3) / 4,\n        }\n    }","sourcePath":"baoclaw-core/src/engine/token_counter.rs","lineRange":{"start":67,"end":79}}],"progress":39},{"id":"03-memory-context-slide-22","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: token_counter.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/token_counter.rs</span><span class=\"code-lines\">lines 81-90</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Called after each API response to anchor the counter to a known value.\n    pub fn calibrate(&amp;mut self, api_input_tokens: u64, message_count_at_call: usize) {\n        self.last_known_input_tokens = Some(api_input_tokens);\n        self.last_known_message_count = message_count_at_call;\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-18","language":"rust","code":"    /// Called after each API response to anchor the counter to a known value.\n    pub fn calibrate(&mut self, api_input_tokens: u64, message_count_at_call: usize) {\n        self.last_known_input_tokens = Some(api_input_tokens);\n        self.last_known_message_count = message_count_at_call;\n    }","sourcePath":"baoclaw-core/src/engine/token_counter.rs","lineRange":{"start":81,"end":90}}],"progress":39},{"id":"03-memory-context-slide-23","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: token_counter.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/token_counter.rs</span><span class=\"code-lines\">lines 92-107</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    /// Estimate the total input tokens for the given message list.\n    /// Uses the most recent API baseline + tiktoken delta for messages added\n    /// since that baseline. Without any baseline yet, falls back to full\n    /// tiktoken-counting the entire message list.\n    pub fn estimate(&amp;self, messages: &amp;[Message]) -&gt; u64 {\n        match self.last_known_input_tokens {\n            Some(baseline) if messages.len() &gt;= self.last_known_message_count =&gt; {\n                let delta: u64 = messages[self.last_known_message_count..]\n                    .iter()\n                    .map(|m| Self::count_text_tokens(&amp;Self::extract_text(m)))\n                    .sum();\n                baseline + delta\n            }\n            _ =&gt; messages\n                .iter()\n                .map(|m| Self::count_text_tokens(&amp;Self::extract_text(m)))\n                .sum(),\n        }\n    }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-19","language":"rust","code":"    /// Estimate the total input tokens for the given message list.\n    /// Uses the most recent API baseline + tiktoken delta for messages added\n    /// since that baseline. Without any baseline yet, falls back to full\n    /// tiktoken-counting the entire message list.\n    pub fn estimate(&self, messages: &[Message]) -> u64 {\n        match self.last_known_input_tokens {\n            Some(baseline) if messages.len() >= self.last_known_message_count => {\n                let delta: u64 = messages[self.last_known_message_count..]\n                    .iter()\n                    .map(|m| Self::count_text_tokens(&Self::extract_text(m)))\n                    .sum();\n                baseline + delta\n            }\n            _ => messages\n                .iter()\n                .map(|m| Self::count_text_tokens(&Self::extract_text(m)))\n                .sum(),\n        }\n    }","sourcePath":"baoclaw-core/src/engine/token_counter.rs","lineRange":{"start":92,"end":107}}],"progress":40},{"id":"03-memory-context-slide-24","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: token_counter.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/token_counter.rs</span><span class=\"code-lines\">lines 121-157</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">impl TokenCounter {\n    /// Effective window = context_window − summary_output_reserve − compact_buffer.\n    /// Reserves 20K tokens for the compact summary output and 13K as a buffer.\n    pub fn effective_window(&amp;self) -&gt; u64 {\n        self.context_window.saturating_sub(33_000)\n    }\n\n    /// Warning threshold — roughly 20K tokens below the effective window.\n    pub fn warning_threshold(&amp;self) -&gt; u64 {\n        self.effective_window().saturating_sub(20_000)\n    }\n\n    /// Blocking threshold — roughly 3K tokens below the effective window.\n    pub fn blocking_threshold(&amp;self) -&gt; u64 {\n        self.effective_window().saturating_sub(3_000)\n    }\n\n    /// Compact threshold (the original threshold_ratio-based level).\n    pub fn compact_threshold(&amp;self) -&gt; u64 {\n        (self.context_window as f64 * self.threshold_ratio) as u64\n    }\n\n    /// Return the current budget status for a pre-computed estimate.\n    pub fn budget_status_given(&amp;self, est: u64) -&gt; BudgetStatus {\n        if est &gt; self.blocking_threshold() {\n            BudgetStatus::Blocking\n        } else if est &gt; self.warning_threshold() {\n            BudgetStatus::Warning\n        } else if est &gt; self.compact_threshold() {\n            BudgetStatus::Compact\n        } else {\n            BudgetStatus::Normal\n        }\n    }\n}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum BudgetStatus {\n    Normal,   // 正常\n    Compact,  // 超过压缩阈值\n    Warning,  // 接近限制\n    Blocking, // 必须压缩\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-20","language":"rust","code":"impl TokenCounter {\n    /// Effective window = context_window − summary_output_reserve − compact_buffer.\n    /// Reserves 20K tokens for the compact summary output and 13K as a buffer.\n    pub fn effective_window(&self) -> u64 {\n        self.context_window.saturating_sub(33_000)\n    }\n\n    /// Warning threshold — roughly 20K tokens below the effective window.\n    pub fn warning_threshold(&self) -> u64 {\n        self.effective_window().saturating_sub(20_000)\n    }\n\n    /// Blocking threshold — roughly 3K tokens below the effective window.\n    pub fn blocking_threshold(&self) -> u64 {\n        self.effective_window().saturating_sub(3_000)\n    }\n\n    /// Compact threshold (the original threshold_ratio-based level).\n    pub fn compact_threshold(&self) -> u64 {\n        (self.context_window as f64 * self.threshold_ratio) as u64\n    }\n\n    /// Return the current budget status for a pre-computed estimate.\n    pub fn budget_status_given(&self, est: u64) -> BudgetStatus {\n        if est > self.blocking_threshold() {\n            BudgetStatus::Blocking\n        } else if est > self.warning_threshold() {\n            BudgetStatus::Warning\n        } else if est > self.compact_threshold() {\n            BudgetStatus::Compact\n        } else {\n            BudgetStatus::Normal\n        }\n    }\n}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum BudgetStatus {\n    Normal,   // 正常\n    Compact,  // 超过压缩阈值\n    Warning,  // 接近限制\n    Blocking, // 必须压缩\n}","sourcePath":"baoclaw-core/src/engine/token_counter.rs","lineRange":{"start":121,"end":157}}],"progress":40},{"id":"03-memory-context-slide-25","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: query_engine.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/query_engine.rs</span><span class=\"code-lines\">lines 818-870</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">        // ── Token budget check: auto-compact if context is too large ──\n        let (should_compact, initial_budget) = {\n            let counter = self.token_counter.lock().await;\n            let est = counter.current_estimate(&amp;self.messages);\n            let should = counter.should_compact_given(est) &amp;&amp; self.messages.len() &gt; 5;\n            let budget = counter.budget_status_given(est);\n            (should, (budget, est))\n        };\n        if should_compact {\n            let msg_count = self.messages.len();\n            if msg_count &lt;= 500 {\n                eprintln!(&quot;Pre-query auto-compact ({} messages, {} tokens)&quot;, msg_count, initial_budget.1);\n                match self.compact().await {\n                    Ok(result) =&gt; {\n                        eprintln!(&quot;Auto-compact: {} -&gt; {} tokens (saved {})&quot;,\n                            result.tokens_before, result.tokens_after, result.tokens_saved);\n                        self.compact_fail_count = 0;\n                    }\n                    Err(e) =&gt; {\n                        eprintln!(&quot;Auto-compact failed: {}, continuing anyway&quot;, e.message);\n                        self.compact_fail_count += 1;\n                    }\n                }\n            } else {\n                // Too many messages — use session_memory_compact instead (no API call).\n                eprintln!(&quot;Pre-query: {} messages is too many for API compact&quot;, msg_count);\n                if let Some(ref sm) = self.config.session_memory {\n                    if sm.is_available() {\n                        let mut msgs = self.messages.to_vec();\n                        if session_memory_compact(&amp;mut msgs, &amp;sm.get()) {\n                            self.messages = msgs;\n                        }\n                    }\n                }\n            }\n        }</code></pre>\n","type":"code","codeBlocks":[{"id":"code-21","language":"rust","code":"        // ── Token budget check: auto-compact if context is too large ──\n        let (should_compact, initial_budget) = {\n            let counter = self.token_counter.lock().await;\n            let est = counter.current_estimate(&self.messages);\n            let should = counter.should_compact_given(est) && self.messages.len() > 5;\n            let budget = counter.budget_status_given(est);\n            (should, (budget, est))\n        };\n        if should_compact {\n            let msg_count = self.messages.len();\n            if msg_count <= 500 {\n                eprintln!(\"Pre-query auto-compact ({} messages, {} tokens)\", msg_count, initial_budget.1);\n                match self.compact().await {\n                    Ok(result) => {\n                        eprintln!(\"Auto-compact: {} -> {} tokens (saved {})\",\n                            result.tokens_before, result.tokens_after, result.tokens_saved);\n                        self.compact_fail_count = 0;\n                    }\n                    Err(e) => {\n                        eprintln!(\"Auto-compact failed: {}, continuing anyway\", e.message);\n                        self.compact_fail_count += 1;\n                    }\n                }\n            } else {\n                // Too many messages — use session_memory_compact instead (no API call).\n                eprintln!(\"Pre-query: {} messages is too many for API compact\", msg_count);\n                if let Some(ref sm) = self.config.session_memory {\n                    if sm.is_available() {\n                        let mut msgs = self.messages.to_vec();\n                        if session_memory_compact(&mut msgs, &sm.get()) {\n                            self.messages = msgs;\n                        }\n                    }\n                }\n            }\n        }","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":818,"end":870}}],"progress":41},{"id":"03-memory-context-slide-26","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: query_engine.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/query_engine.rs</span><span class=\"code-lines\">lines 537-610</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">    pub async fn compact(&amp;mut self) -&gt; Result&lt;CompactResult, EngineError&gt; {\n        let keep_recent: usize = 4;\n\n        let tokens_before = estimate_tokens(&amp;self.messages);\n\n        if self.messages.len() &lt;= keep_recent {\n            return Ok(CompactResult {\n                tokens_saved: 0,\n                summary_tokens: 0,\n                tokens_before,\n                tokens_after: tokens_before,\n            });\n        }\n\n        let mut split = self.messages.len() - keep_recent;\n\n        // Ensure we don&#39;t split between tool calls and their results.\n        // If old_messages ends with an assistant message containing tool_use,\n        // we need to include ALL following tool_result messages.\n        if split &gt; 0 &amp;&amp; split &lt; self.messages.len() {\n            if let MessageContent::Assistant { message, .. } = &amp;self.messages[split - 1].content {\n                let tool_use_ids: Vec&lt;&amp;str&gt; = message.content.iter()\n                    .filter_map(|block| match block {\n                        ContentBlock::ToolUse { id, .. } =&gt; Some(id.as_str()),\n                        _ =&gt; None,\n                    })\n                    .collect();\n\n                if !tool_use_ids.is_empty() {\n                    // Scan forward to find all corresponding tool_result messages\n                    let mut found_results: HashSet&lt;String&gt; = HashSet::new();\n                    let mut next_idx = split;\n\n                    while next_idx &lt; self.messages.len() {\n                        if let MessageContent::User { message, .. } = &amp;self.messages[next_idx].content {\n                            let result_ids = extract_tool_result_ids(message);\n                            for id in result_ids {\n                                if tool_use_ids.contains(&amp;id.as_str()) {\n                                    found_results.insert(id);\n                                }\n                            }\n                            if found_results.len() == tool_use_ids.len() {\n                                break;\n                            }\n                        }\n                        next_idx += 1;\n                    }\n\n                    // Adjust split to include all tool_result messages\n                    if found_results.len() == tool_use_ids.len() {\n                        split = next_idx + 1;\n                    } else {\n                        // Not all results found - move assistant message to recent_messages\n                        if split &gt; 1 {\n                            split -= 1;\n                        }\n                    }\n                }\n            }\n        }\n\n        let old_messages = &amp;self.messages[..split];\n        let recent_messages = self.messages[split..].to_vec();</code></pre>\n","type":"code","codeBlocks":[{"id":"code-22","language":"rust","code":"    pub async fn compact(&mut self) -> Result<CompactResult, EngineError> {\n        let keep_recent: usize = 4;\n\n        let tokens_before = estimate_tokens(&self.messages);\n\n        if self.messages.len() <= keep_recent {\n            return Ok(CompactResult {\n                tokens_saved: 0,\n                summary_tokens: 0,\n                tokens_before,\n                tokens_after: tokens_before,\n            });\n        }\n\n        let mut split = self.messages.len() - keep_recent;\n\n        // Ensure we don't split between tool calls and their results.\n        // If old_messages ends with an assistant message containing tool_use,\n        // we need to include ALL following tool_result messages.\n        if split > 0 && split < self.messages.len() {\n            if let MessageContent::Assistant { message, .. } = &self.messages[split - 1].content {\n                let tool_use_ids: Vec<&str> = message.content.iter()\n                    .filter_map(|block| match block {\n                        ContentBlock::ToolUse { id, .. } => Some(id.as_str()),\n                        _ => None,\n                    })\n                    .collect();\n\n                if !tool_use_ids.is_empty() {\n                    // Scan forward to find all corresponding tool_result messages\n                    let mut found_results: HashSet<String> = HashSet::new();\n                    let mut next_idx = split;\n\n                    while next_idx < self.messages.len() {\n                        if let MessageContent::User { message, .. } = &self.messages[next_idx].content {\n                            let result_ids = extract_tool_result_ids(message);\n                            for id in result_ids {\n                                if tool_use_ids.contains(&id.as_str()) {\n                                    found_results.insert(id);\n                                }\n                            }\n                            if found_results.len() == tool_use_ids.len() {\n                                break;\n                            }\n                        }\n                        next_idx += 1;\n                    }\n\n                    // Adjust split to include all tool_result messages\n                    if found_results.len() == tool_use_ids.len() {\n                        split = next_idx + 1;\n                    } else {\n                        // Not all results found - move assistant message to recent_messages\n                        if split > 1 {\n                            split -= 1;\n                        }\n                    }\n                }\n            }\n        }\n\n        let old_messages = &self.messages[..split];\n        let recent_messages = self.messages[split..].to_vec();","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":537,"end":610}}],"progress":41},{"id":"03-memory-context-slide-27","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: query_engine.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/query_engine.rs</span><span class=\"code-lines\">lines 610-660</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">        // Build a summarisation prompt from the old messages\n        let raw_summary = format_messages_for_summary(old_messages);\n        let max_summary_chars: usize = 60_000; // ~15k tokens\n        let truncated_summary = if raw_summary.len() &gt; max_summary_chars {\n            format!(&quot;{}...\\n\\n[Conversation truncated, {} total chars]&quot;,\n                &amp;raw_summary.chars().take(max_summary_chars).collect::&lt;String&gt;(), raw_summary.len())\n        } else {\n            raw_summary\n        };\n        let summary_prompt = format!(\n            &quot;Summarize the following conversation history concisely, \\\n             preserving key context, decisions, and file changes:\\n\\n{}&quot;,\n            truncated_summary\n        );\n\n        // Call the API to produce a summary\n        let summary = match self.call_api_for_summary(&amp;summary_prompt).await {\n            Ok(s) =&gt; s,\n            Err(e) =&gt; {\n                eprintln!(&quot;Compact: summary API failed ({}), falling back to truncation&quot;, e.message);\n                format!(&quot;[Previous conversation ({} messages) was truncated due to context limits]&quot;, old_messages.len())\n            }\n        };\n\n        // Build the compact boundary message\n        let boundary = Message {\n            uuid: uuid::Uuid::new_v4().to_string(),\n            timestamp: chrono::Utc::now().to_rfc3339(),\n            content: MessageContent::System {\n                subtype: SystemSubtype::CompactBoundary,\n                content: summary,\n            },\n        };\n\n        // Replace messages: boundary + recent\n        self.messages = vec![boundary];\n        self.messages.extend(recent_messages);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-23","language":"rust","code":"        // Build a summarisation prompt from the old messages\n        let raw_summary = format_messages_for_summary(old_messages);\n        let max_summary_chars: usize = 60_000; // ~15k tokens\n        let truncated_summary = if raw_summary.len() > max_summary_chars {\n            format!(\"{}...\\n\\n[Conversation truncated, {} total chars]\",\n                &raw_summary.chars().take(max_summary_chars).collect::<String>(), raw_summary.len())\n        } else {\n            raw_summary\n        };\n        let summary_prompt = format!(\n            \"Summarize the following conversation history concisely, \\\n             preserving key context, decisions, and file changes:\\n\\n{}\",\n            truncated_summary\n        );\n\n        // Call the API to produce a summary\n        let summary = match self.call_api_for_summary(&summary_prompt).await {\n            Ok(s) => s,\n            Err(e) => {\n                eprintln!(\"Compact: summary API failed ({}), falling back to truncation\", e.message);\n                format!(\"[Previous conversation ({} messages) was truncated due to context limits]\", old_messages.len())\n            }\n        };\n\n        // Build the compact boundary message\n        let boundary = Message {\n            uuid: uuid::Uuid::new_v4().to_string(),\n            timestamp: chrono::Utc::now().to_rfc3339(),\n            content: MessageContent::System {\n                subtype: SystemSubtype::CompactBoundary,\n                content: summary,\n            },\n        };\n\n        // Replace messages: boundary + recent\n        self.messages = vec![boundary];\n        self.messages.extend(recent_messages);","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":610,"end":660}}],"progress":42},{"id":"03-memory-context-slide-28","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例: query_engine.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/query_engine.rs</span><span class=\"code-lines\">lines 133-139</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Result of a context compaction operation.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct CompactResult {\n    pub tokens_saved: u64,      // 节省的 tokens\n    pub summary_tokens: u64,    // 摘要占用的 tokens\n    pub tokens_before: u64,     // 压缩前 tokens\n    pub tokens_after: u64,      // 压缩后 tokens\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-24","language":"rust","code":"/// Result of a context compaction operation.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct CompactResult {\n    pub tokens_saved: u64,      // 节省的 tokens\n    pub summary_tokens: u64,    // 摘要占用的 tokens\n    pub tokens_before: u64,     // 压缩前 tokens\n    pub tokens_after: u64,      // 压缩后 tokens\n}","sourcePath":"baoclaw-core/src/engine/query_engine.rs","lineRange":{"start":133,"end":139}}] 分割点之后\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-28","language":"rust","code":"// ✅ 正确：检查 tool_use/tool_result 完整性\nif let MessageContent::Assistant { message, .. } = &messages[split - 1].content {\n    let tool_use_ids: Vec<&str> = message.content.iter()\n        .filter_map(|block| match block {\n            ContentBlock::ToolUse { id, .. } => Some(id.as_str()),\n            _ => None,\n        })\n        .collect();\n    // ... 确保所有 tool_result 都在分割点之后\n}"}],"progress":44},{"id":"03-memory-context-slide-33","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：只在内存中更新，不持久化\nself.session_memory.update(summary);\n// 程序崩溃后丢失</code></pre>\n","type":"code","codeBlocks":[{"id":"code-29","language":"rust","code":"// ❌ 错误：只在内存中更新，不持久化\nself.session_memory.update(summary);\n// 程序崩溃后丢失"}],"progress":45},{"id":"03-memory-context-slide-34","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：同时持久化到磁盘\npub fn update(&amp;self, summary: String) {\n    let mut guard = self.content.lock().unwrap();\n    *guard = summary.clone();\n    let _ = fs::write(&amp;self.file_path, summary.as_bytes());  // 持久化\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-30","language":"rust","code":"// ✅ 正确：同时持久化到磁盘\npub fn update(&self, summary: String) {\n    let mut guard = self.content.lock().unwrap();\n    *guard = summary.clone();\n    let _ = fs::write(&self.file_path, summary.as_bytes());  // 持久化\n}"}],"progress":45},{"id":"03-memory-context-slide-35","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// 简单截断：保留最近 N 条消息\nif messages.len() &gt; 100 {\n    messages = messages[messages.len() - 100..].to_vec();\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-31","language":"rust","code":"// 简单截断：保留最近 N 条消息\nif messages.len() > 100 {\n    messages = messages[messages.len() - 100..].to_vec();\n}"}],"progress":46},{"id":"03-memory-context-slide-36","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// 将历史消息存入向量数据库，按需检索\nlet relevant = vector_db.search(query, top_k=10);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-32","language":"rust","code":"// 将历史消息存入向量数据库，按需检索\nlet relevant = vector_db.search(query, top_k=10);"}],"progress":46},{"id":"03-memory-context-slide-37","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// 调用 LLM API 生成摘要\nlet summary = api.summarize(old_messages).await;\nmessages = vec![boundary_message(summary), recent_messages].concat();</code></pre>\n","type":"code","codeBlocks":[{"id":"code-33","language":"rust","code":"// 调用 LLM API 生成摘要\nlet summary = api.summarize(old_messages).await;\nmessages = vec![boundary_message(summary), recent_messages].concat();"}],"progress":47},{"id":"03-memory-context-slide-38","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// 校准：API 返回真实值\ncounter.calibrate(usage.input_tokens, messages.len());\n\n// 估算：基线 + tiktoken delta\nlet est = baseline + tiktoken_count(new_messages);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-34","language":"rust","code":"// 校准：API 返回真实值\ncounter.calibrate(usage.input_tokens, messages.len());\n\n// 估算：基线 + tiktoken delta\nlet est = baseline + tiktoken_count(new_messages);"}],"progress":47},{"id":"03-memory-context-slide-39","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">Working Memory (实时) → Session Memory (会话) → Long-term Memory (持久)</code></pre>\n","type":"code","codeBlocks":[{"id":"code-35","language":"other","code":"Working Memory (实时) → Session Memory (会话) → Long-term Memory (持久)"}],"progress":48},{"id":"03-memory-context-slide-40","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"思考","content":"<p><!-- Requirements: 5.4 讨论替代方案与权衡决策 --></p>\n<h3>替代方案</h3>\n<p>#### 方案 A: 滑动窗口截断</p>\n<p>``<code>rust\n// 简单截断：保留最近 N 条消息\nif messages.len() > 100 {\n    messages = messages[messages.len() - 100..].to_vec();\n}\n</code>`<code></p>\n<p>- <strong>优点:</strong> 实现简单，无 API 调用成本\n- <strong>缺点:</strong> 丢失早期上下文，可能丢失关键决策\n- <strong>适用场景:</strong> 无状态对话</p>\n<p>#### 方案 B: 向量数据库检索</p>\n<p></code>`<code>rust\n// 将历史消息存入向量数据库，按需检索\nlet relevant = vector_db.search(query, top_k=10);\n</code>`<code></p>\n<p>- <strong>优点:</strong> 理论上无限上下文\n- <strong>缺点:</strong> 需要额外的向量服务和嵌入成本，检索质量依赖嵌入模型\n- <strong>适用场景:</strong> 长期知识库</p>\n<p>#### 方案 C: API 摘要压缩 ✓</p>\n<p></code>`<code>rust\n// 调用 LLM API 生成摘要\nlet summary = api.summarize(old_messages).await;\nmessages = vec![boundary_message(summary), recent_messages].concat();\n</code>`<code></p>\n<p>- <strong>优点:</strong> 保留关键上下文，信息密度高\n- <strong>缺点:</strong> 有 API 成本和延迟\n- <strong>适用场景:</strong> 长对话会话（BaoClaw 选择）</p>\n<h3>权衡决策</h3>\n<p>| 决策点 | 选择 | 原因 | 影响 |\n|--------|------|------|------|\n| Token 计数 | 校准 + tiktoken | 精确度与性能平衡 | 避免上下文溢出 |\n| 压缩触发 | 多级阈值 | 渐进式压力管理 | 平滑降级 |\n| 摘要方式 | API 调用 | 信息密度高 | 保留关键上下文 |\n| Session Memory | 后台更新 | 不阻塞主流程 | 零成本恢复 |\n| 长期记忆 | JSONL + 分类 | 简单可靠 | 支持跨会话 |</p>\n<h3>设计决策：为什么用校准 + tiktoken？</h3>\n<p></code>`<code>rust\n// 校准：API 返回真实值\ncounter.calibrate(usage.input_tokens, messages.len());</p>\n<p>// 估算：基线 + tiktoken delta\nlet est = baseline + tiktoken_count(new_messages);\n</code>`<code></p>\n<p><strong>优点:</strong></p>\n<p>1. <strong>精确:</strong> 校准锚定真实值，误差 < 5%\n2. <strong>高效:</strong> 无需每次调用 API 计数\n3. <strong>跨语言准确:</strong> tiktoken 支持多语言 tokenization</p>\n<p><strong>对比 </code>chars / 4<code>:</strong></p>\n<p>| 语言 | chars/4 | tiktoken | 实际 | 误差 |\n|------|---------|----------|------|------|\n| 英文 | 250 | 1000 | 1000 | 0% |\n| 中文 | 1000 | 4000 | 4000 | 0% |\n| 混合 | 500 | 2000 | 2000 | 0% |</p>\n<h3>设计决策：为什么用三层记忆？</h3>\n<p></code>`<code>\nWorking Memory (实时) → Session Memory (会话) → Long-term Memory (持久)\n</code>`<code></p>\n<p><strong>原因:</strong></p>\n<p>1. <strong>Working Memory</strong>: 实时响应，受限于 context window\n2. <strong>Session Memory</strong>: 低成本恢复，摘要压缩 10-20 倍\n3. <strong>Long-term Memory</strong>: 跨会话持久化，用户显式添加</p>\n<p><strong>边界划分:</strong></p>\n<p>- Working → Session: 自动压缩，API 摘要\n- Session → Long-term: 用户显式 </code>memory add` 命令</p>\n<p>---</p>\n","type":"reflection","progress":48},{"id":"03-memory-context-slide-41","chapterId":"03-memory-context","chapterTitle":"记忆与上下文","title":"总结","content":"<p><!-- Requirements: 5.5 提供要点总结与延伸阅读链接 --></p>\n<h3>核心要点</h3>\n<p>- <strong>三层记忆架构</strong>: Working Memory → Session Memory → Long-term Memory\n- <strong>Token 计数</strong>: 校准 + tiktoken 混合策略，精确度 > 95%\n- <strong>多级预算管理</strong>: Normal → Compact → Warning → Blocking 渐进阈值\n- <strong>压缩策略</strong>: API 摘要 + 边界保护，保留 tool_use/tool_result 完整性\n- <strong>Session Memory</strong>: 滚动摘要，后台更新，零成本恢复</p>\n<h3>关键概念回顾</h3>\n<p>1. <strong>MemoryStore</strong>: 跨会话持久化记忆，支持 Fact/Preference/Decision 分类\n2. <strong>SessionMemory</strong>: 会话级滚动摘要，~8000 字符，后台 API 更新\n3. <strong>TokenCounter</strong>: tiktoken 计数 + API 校准，精确估算上下文使用\n4. <strong>BudgetStatus</strong>: 多级状态，Normal/Compact/Warning/Blocking\n5. <strong>CompactResult</strong>: 压缩结果，tokens_saved/tokens_before/tokens_after</p>\n<h3>Token 预算区域（Claude 200K）</h3>\n<p>| 区域 | Token 范围 | 行为 |\n|------|-----------|------|\n| Normal | 0 - 140K | 正常运行 |\n| Compact | 140K - 167K | 考虑压缩 |\n| Warning | 167K - 184K | 发出警告 |\n| Blocking | 184K+ | 必须压缩 |</p>\n<h3>延伸阅读</h3>\n<p>#### 官方资源</p>\n<p>- <a href=\"https://github.com/baoclaw/baoclaw\">BaoClaw GitHub</a> - 完整源码实现\n- <a href=\"./../../../baoclaw-core/src/engine/memory.rs\">MemoryStore 源码</a> - 长期记忆实现\n- <a href=\"./../../../baoclaw-core/src/engine/session_memory.rs\">SessionMemory 源码</a> - 会话记忆实现\n- <a href=\"./../../../baoclaw-core/src/engine/token_counter.rs\">TokenCounter 源码</a> - Token 计数实现</p>\n<p>#### 相关章节</p>\n<p>- <a href=\"./../02-core-implementation/\">上一章：工具系统与扩展</a> - 理解 Tool trait 和工具执行\n- <a href=\"./../04-ipc-multiclient/\">下一章：IPC 与多客户端</a> - 了解守护进程架构和多客户端会话</p>\n<p>#### 外部资源</p>\n<p>- <a href=\"https://github.com/openai/tiktoken\">tiktoken</a> - OpenAI 的 BPE tokenizer\n- <a href=\"https://docs.anthropic.com/claude/docs/context-windows\">Claude Context Windows</a> - 上下文窗口说明\n- <a href=\"https://arxiv.org/abs/2210.03629\">ReAct 论文</a> - ReAct 模式原始论文\n</p>","type":"summary","progress":49},{"id":"04-ipc-multiclient-slide-01","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"IPC 与多客户端","content":"<div class=\"chapter-number\">Chapter 4</div>\n<h1>IPC 与多客户端</h1>\n","type":"title","progress":49},{"id":"04-ipc-multiclient-slide-02","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"问题","content":"<p><!-- Requirements: 5.1 描述该章节解决的实际工程问题 --></p>\n<p>在构建 Agent 应用时，我们面临以下核心问题：</p>\n<h3>1. 如何让 Agent 在后台持久运行？</h3>\n<p>传统 CLI 程序每次调用都需要重新启动，存在以下问题：</p>\n<p>- 启动时间长（加载模型、初始化工具）\n- 无法保持会话状态\n- 每次重新加载 MCP 服务器</p>\n<h3>2. 如何支持多渠道同时访问？</h3>\n<p>用户可能通过多种方式与 Agent 交互：</p>\n<p>- 终端 CLI（本地开发）\n- 即时通讯工具（Telegram、WhatsApp）\n- 企业协作平台（飞书、钉钉）</p>\n<p>每种渠道需要独立的客户端，但共享同一个 Agent 核心。</p>\n<h3>3. 如何实现进程间通信？</h3>\n<p>客户端与守护进程运行在不同进程，需要可靠的通信机制：</p>\n<p>- 低延迟：实时响应用户请求\n- 高吞吐：处理大量流事件\n- 容错性：处理异常断开和重连</p>\n<h3>4. 如何隔离不同用户的会话？</h3>\n<p>多用户场景下需要确保：</p>\n<p>- 会话隔离：用户 A 看不到用户 B 的对话\n- 权限控制：不同用户有不同的访问权限\n- 资源管理：防止单用户占用过多资源</p>\n<h3>问题背景</h3>\n<p>BaoClaw 采用 <strong>守护进程模式 + JSON-RPC over Unix Domain Socket</strong> 架构解决上述问题。守护进程作为全局后台服务管理所有 Agent 实例，客户端通过标准的 JSON-RPC 协议连接，支持会话共享和多渠道接入。</p>\n<p>``<code>\n┌─────────────────────────────────────────────────────────────────────┐\n│                        BaoClaw Daemon                                │\n│  ┌─────────────┐   ┌─────────────┐   ┌─────────────────────────┐   │\n│  │ IpcServer   │→  │ Router      │→  │ QueryEngine             │   │\n│  │ (UDS)       │   │             │   │                         │   │\n│  └─────────────┘   └─────────────┘   └─────────────────────────┘   │\n│         ↑                                     │                      │\n│         │                                     ▼                      │\n│  ┌─────────────┐   ┌─────────────┐   ┌─────────────────────────┐   │\n│  │ Events      │←  │ ToolExecutor│←  │ Stream Events           │   │\n│  │             │   │             │   │ (assistant_chunk, etc.) │   │\n│  └─────────────┘   └─────────────┘   └─────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────────┘\n         │\n         │ Unix Domain Socket (NDJSON)\n         ▼\n┌─────────────────────────────────────────────────────────────────────┐\n│                        IPC Clients                                   │\n│  ┌─────────────┐   ┌─────────────┐   ┌─────────────────────────┐   │\n│  │ CLI Client  │   │ WhatsApp    │   │ Telegram / Feishu       │   │\n│  │ (ts-ipc)    │   │ Gateway     │   │ Gateway                 │   │\n│  └─────────────┘   └─────────────┘   └─────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────────┘\n</code>``</p>\n<p>---</p>\n","type":"problem","progress":50},{"id":"04-ipc-multiclient-slide-03","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"模式","content":"<p><!-- Requirements: 5.2 讲解通用的设计模式或架构范式 --></p>\n<h3>核心设计模式：守护进程 + IPC 网关</h3>\n<p>BaoClaw 采用<strong>守护进程模式</strong>，将 Agent 核心与客户端解耦，通过 JSON-RPC 协议通信。</p>\n<p>#### 守护进程模式优势</p>\n<p>| 优势 | 说明 | 对比传统 CLI |\n|------|------|-------------|\n| 持久化 | Agent 在后台持续运行 | 每次启动需重新初始化 |\n| 会话保持 | 自动保存和恢复会话 | 手动管理会话状态 |\n| 多客户端 | 支持多渠道同时连接 | 每个渠道独立进程 |\n| 资源共享 | MCP 服务器全局共享 | 每次重启需重新加载 |</p>\n<p>#### JSON-RPC 2.0 协议</p>\n<p>JSON-RPC 2.0 是轻量级的远程过程调用协议：</p>\n<p>``<code>json\n// 请求\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"submitMessage\",\n  \"params\": { \"prompt\": \"Hello\" },\n  \"id\": 1\n}</p>\n<p>// 成功响应\n{\n  \"jsonrpc\": \"2.0\",\n  \"result\": { \"status\": \"ok\" },\n  \"id\": 1\n}</p>\n<p>// 通知（无 id，无需响应）\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"stream/event\",\n  \"params\": { \"type\": \"assistant_chunk\", \"content\": \"...\" }\n}\n</code>`<code></p>\n<p>#### Unix Domain Socket vs TCP</p>\n<p>| 特性 | Unix Domain Socket | TCP |\n|------|-------------------|-----|\n| 通信范围 | 本机 | 网络 |\n| 性能 | 更快（无网络栈开销） | 较慢 |\n| 安全 | 文件权限控制 | 需额外认证 |\n| 适用场景 | 本地服务（BaoClaw） | 分布式服务 |</p>\n<p>#### NDJSON 帧格式</p>\n<p>NDJSON (Newline-Delimited JSON) 是流式 JSON 格式：</p>\n<p></code>`<code>\n{\"jsonrpc\":\"2.0\",\"method\":\"stream/event\",\"params\":{...}}\\n\n{\"jsonrpc\":\"2.0\",\"method\":\"stream/event\",\"params\":{...}}\\n\n{\"jsonrpc\":\"2.0\",\"result\":{...},\"id\":1}\\n\n</code>`<code></p>\n<p><strong>优势：</strong></p>\n<p>- 流式处理友好，无需预先知道消息长度\n- 天然支持消息边界\n- 便于调试（每行一个完整 JSON）</p>\n<h3>多客户端架构</h3>\n<p>#### 统一 IPC 客户端模式</p>\n<p>所有网关使用相同的 IPC 客户端实现模式：</p>\n<p></code>`<code>\n┌─────────────────────────────────────────────────────────────────────┐\n│                        Gateway Pattern                               │\n│                                                                      │\n│  ┌───────────────────────────────────────────────────────────────┐ │\n│  │                     Gateway (TypeScript)                        │ │\n│  │  ┌─────────────┐  ┌─────────────┐  ┌─────────────────────┐    │ │\n│  │  │ Platform    │  │ IpcClient   │  │ MessageQueue        │    │ │\n│  │  │ Client      │  │             │  │                     │    │ │\n│  │  │ (WhatsApp/  │  │ - connect() │  │ - enqueue()         │    │ │\n│  │  │  Telegram)  │  │ - request() │  │ - dequeue()         │    │ │\n│  │  └──────┬──────┘  │ - onNotify()│  │ - isProcessing()    │    │ │\n│  │         │         └──────┬──────┘  └─────────────────────┘    │ │\n│  │         │                │                                     │ │\n│  │         ▼                ▼                                     │ │\n│  │  ┌─────────────────────────────────────────────────────────┐  │ │\n│  │  │              Unix Domain Socket                          │  │ │\n│  │  └─────────────────────────────────────────────────────────┘  │ │\n│  └───────────────────────────────────────────────────────────────┘ │\n│                                │                                     │\n│                                ▼                                     │\n│                    ┌─────────────────────┐                          │\n│                    │   BaoClaw Daemon    │                          │\n│                    └─────────────────────┘                          │\n└─────────────────────────────────────────────────────────────────────┘\n</code>`<code></p>\n<p>#### 网关实现对比</p>\n<p>| 网关 | 平台客户端 | IPC 客户端 | 特点 |\n|------|-----------|-----------|------|\n| CLI | readline | ts-ipc/client.ts | 交互式终端 |\n| WhatsApp | Baileys | baoclaw-whatsapp/ipcClient.ts | QR 码登录，媒体支持 |\n| Telegram | node-telegram-bot-api | 内联实现 | Polling 模式 |\n| Feishu | lark-cli | baoclaw-feishu/ipcClient.ts | NDJSON 事件流 |</p>\n<h3>会话共享模式</h3>\n<p>多个客户端可以通过 </code>shared_session_id<code> 共享同一个会话：</p>\n<p></code>`<code>mermaid\ngraph LR\n    A[CLI Client] -->|shared_session_id=default| D[Session]\n    B[WhatsApp] -->|shared_session_id=default| D\n    C[Telegram] -->|shared_session_id=user_alice| E[Session 2]\n    \n    D --> F[Shared Messages]\n    E --> G[Alice's Messages]\n</code>`<code></p>\n<p><strong>用途：</strong> 不同渠道的用户可以共享同一对话历史，实现无缝切换。</p>\n<h3>消息队列模式</h3>\n<p>每个网关实现自己的消息队列，确保：</p>\n<p>- 每个发送者一次只处理一条消息\n- 按顺序处理，不乱序\n- 支持队列满时的背压</p>\n<p></code>`<code>mermaid\nsequenceDiagram\n    participant User as 用户\n    participant GW as Gateway\n    participant MQ as MessageQueue\n    participant IPC as IpcClient\n    participant Daemon as Daemon\n    \n    User->>GW: 发送消息 A\n    GW->>MQ: enqueue(sender, A)\n    MQ->>IPC: process(sender, A)\n    IPC->>Daemon: submitMessage(A)\n    Note over MQ: isProcessing = true\n    \n    User->>GW: 发送消息 B\n    GW->>MQ: enqueue(sender, B)\n    Note over MQ: 等待 A 完成\n    \n    Daemon-->>IPC: stream/event (result)\n    IPC-->>GW: 完成\n    MQ->>IPC: process(sender, B)\n    Note over MQ: isProcessing = false → true\n</code>`<code></p>\n<h3>守护进程发现机制</h3>\n<p>客户端通过元数据文件发现运行中的守护进程：</p>\n<p></code>`<code>\n/tmp/baoclaw-sockets/\n├── default.json          # 默认会话\n├── project-alpha.json    # 项目 alpha\n└── project-beta.json     # 项目 beta\n</code>`<code></p>\n<p><strong>元数据结构：</strong></p>\n<p></code>`<code>typescript\ninterface DaemonInfo {\n  pid: number;          // 进程 ID\n  cwd: string;          // 工作目录\n  session_id: string;   // 会话 ID\n  socket: string;       // Socket 路径\n  started_at: string;   // 启动时间 (ISO 8601)\n}\n</code>`<code></p>\n<p><strong>发现流程：</strong></p>\n<p>1. 扫描 </code>/tmp/baoclaw-sockets/*.json<code>\n2. 检查进程存活（</code>process.kill(pid, 0)`）\n3. 检查 socket 文件存在\n4. 选择匹配 cwd 或最新的守护进程</p>\n<p>---</p>\n","type":"pattern","progress":51},{"id":"04-ipc-multiclient-slide-04","chapterId":"04-ipc-multiclient","chapterTitle":"IPC 与多客户端","title":"实现","content":"<p><!-- Requirements: 5.3 提供 BaoClaw 的 Rust 代码示例 --></p>\n<h3>示例 1: JSON-RPC 协议定义</h3>\n<p>JSON-RPC 2.0 消息类型定义。</p>\n<p>``<code>rust path=\"baoclaw-core/src/ipc/protocol.rs\" lines=\"15-60\"\n// 请求 ID - 支持数字或字符串\n#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]\n#[serde(untagged)]\npub enum RequestId {\n    Number(i64),\n    String(String),\n}</p>\n<p>// JSON-RPC 2.0 请求\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcRequest {\n    pub jsonrpc: String,           // \"2.0\"\n    pub method: String,            // RPC 方法名\n    #[serde(default)]\n    pub params: Value,             // 参数（可选）\n    pub id: RequestId,             // 请求 ID\n}</p>\n<p>// JSON-RPC 2.0 成功响应\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcResponse {\n    pub jsonrpc: String,\n    pub result: Value,             // 结果\n    pub id: RequestId,\n}</p>\n<p>// JSON-RPC 2.0 错误响应\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcErrorResponse {\n    pub jsonrpc: String,\n    pub error: JsonRpcError,\n    pub id: Option<RequestId>,     // 可能为 None（解析错误）\n}</p>\n<p>#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcError {\n    pub code: i32,\n    pub message: String,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub data: Option<Value>,\n}\n</code>`<code></p>\n<p><strong>设计要点：</strong></p>\n<p>- </code>RequestId<code> 使用 </code>#[serde(untagged)]<code> 支持 JSON-RPC 规范中的数字或字符串 ID\n- 错误响应的 </code>id<code> 可为 </code>None<code>（如解析错误时无法确定请求 ID）</p>\n<h3>示例 2: 统一消息类型</h3>\n<p>自定义反序列化逻辑，根据 JSON 字段自动判断消息类型。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/ipc/protocol.rs\" lines=\"62-120\"\n#[derive(Clone, Debug)]\npub enum JsonRpcMessage {\n    Request(JsonRpcRequest),\n    Response(JsonRpcResponse),\n    ErrorResponse(JsonRpcErrorResponse),\n    Notification(JsonRpcNotification),\n}</p>\n<p>impl<'de> Deserialize<'de> for JsonRpcMessage {\n    fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>\n    where\n        D: serde::Deserializer<'de>,\n    {\n        let value = Value::deserialize(deserializer)?;\n        \n        // 有 error 字段 → ErrorResponse\n        if value.get(\"error\").is_some() {\n            return Ok(JsonRpcMessage::ErrorResponse(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        // 有 result 字段 → Response\n        if value.get(\"result\").is_some() {\n            return Ok(JsonRpcMessage::Response(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        // 有 method 字段\n        if let Some(_method) = value.get(\"method\") {\n            // 有 id → Request\n            if value.get(\"id\").is_some() {\n                return Ok(JsonRpcMessage::Request(\n                    serde_json::from_value(value).map_err(serde::de::Error::custom)?\n                ));\n            }\n            // 无 id → Notification\n            return Ok(JsonRpcMessage::Notification(\n                serde_json::from_value(value).map_err(serde::de::Error::custom)?\n            ));\n        }\n        \n        Err(serde::de::Error::custom(\"Invalid JSON-RPC message\"))\n    }\n}\n</code>`<code></p>\n<h3>示例 3: NDJSON 帧格式</h3>\n<p>编码和解码 NDJSON 消息。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/ipc/protocol.rs\" lines=\"130-160\"\n// 编码：JSON + 换行符\npub fn encode_ndjson(message: &impl Serialize) -> Result<Vec<u8>, serde_json::Error> {\n    let mut bytes = serde_json::to_vec(message)?;\n    bytes.push(b'\\n');\n    Ok(bytes)\n}</p>\n<p>// 解码：单行 JSON → JsonRpcMessage\npub fn decode_ndjson_line(line: &str) -> Result<JsonRpcMessage, serde_json::Error> {\n    let trimmed = line.trim();\n    if trimmed.is_empty() {\n        return Err(serde_json::Error::custom(\"Empty line\"));\n    }\n    serde_json::from_str(trimmed)\n}\n</code>`<code></p>\n<h3>示例 4: IPC 服务端</h3>\n<p>IPC 服务端监听 Unix Domain Socket。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/ipc/server.rs\" lines=\"35-80\"\n/// IPC 服务端 - 监听 Unix Domain Socket\npub struct IpcServer {\n    listener: UnixListener,\n    socket_path: PathBuf,\n}</p>\n<p>impl IpcServer {\n    /// Create and bind to a Unix Domain Socket.\n    /// Cleans up old socket file if exists, sets permissions to 0600.\n    pub async fn bind(socket_path: PathBuf) -> Result<Self, IpcError> {\n        // Remove old socket file if exists\n        if socket_path.exists() {\n            std::fs::remove_file(&socket_path)\n                .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        }\n        \n        // Create parent directory\n        if let Some(parent) = socket_path.parent() {\n            std::fs::create_dir_all(parent)\n                .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        }\n        \n        // Bind listener\n        let listener = UnixListener::bind(&socket_path)\n            .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        \n        // Set permissions to 0600 (only owner can access)\n        std::fs::set_permissions(&socket_path, std::fs::Permissions::from_mode(0o600))\n            .map_err(|e| IpcError::BindFailed(e.to_string()))?;\n        \n        Ok(Self { listener, socket_path })\n    }\n}</p>\n<p>impl Drop for IpcServer {\n    fn drop(&mut self) {\n        // Clean up socket file on drop\n        let _ = std::fs::remove_file(&self.socket_path);\n    }\n}\n</code>`<code></p>\n<p><strong>安全特性：</strong></p>\n<p>- 自动清理旧 socket 文件，避免 \"address already in use\"\n- 设置 0600 权限，防止其他用户连接\n- 析构时自动清理 socket 文件</p>\n<h3>示例 5: IPC 连接读写</h3>\n<p>IPC 连接支持带缓冲的 NDJSON 读写。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/ipc/server.rs\" lines=\"82-130\"\n/// IPC 连接 - 带缓冲的读写\npub struct IpcConnection {\n    reader: BufReader<tokio::net::unix::OwnedReadHalf>,\n    writer: BufWriter<tokio::net::unix::OwnedWriteHalf>,\n}</p>\n<p>impl IpcConnection {\n    /// Read a single NDJSON message.\n    pub async fn read_message(&mut self) -> Result<JsonRpcMessage, IpcError> {\n        let mut line = String::new();\n        let n = self.reader.read_line(&mut line).await\n            .map_err(|e| IpcError::ReadFailed(e.to_string()))?;\n        \n        if n == 0 {\n            return Err(IpcError::ConnectionClosed);\n        }\n        \n        decode_ndjson_line(&line)\n            .map_err(|e| IpcError::ParseFailed(e.to_string()))\n    }\n    \n    /// Write a single NDJSON message.\n    pub async fn write_message(&mut self, message: &impl Serialize) -> Result<(), IpcError> {\n        let bytes = encode_ndjson(message)\n            .map_err(|e| IpcError::EncodeFailed(e.to_string()))?;\n        \n        self.writer.write_all(&bytes).await\n            .map_err(|e| IpcError::WriteFailed(e.to_string()))?;\n        \n        self.writer.flush().await\n            .map_err(|e| IpcError::WriteFailed(e.to_string()))?;\n        \n        Ok(())\n    }\n}\n</code>`<code></p>\n<h3>示例 6: RPC 路由定义</h3>\n<p>定义客户端可调用的 RPC 方法。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/ipc/router.rs\" lines=\"25-80\"\n#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]\n#[serde(tag = \"method\", content = \"params\")]\npub enum ClientMethod {\n    #[serde(rename = \"initialize\")]\n    Initialize {\n        cwd: PathBuf,\n        model: Option<String>,\n        settings: Value,\n        #[serde(default)]\n        resume_session_id: Option<String>,\n        #[serde(default)]\n        shared_session_id: Option<String>,\n    },</p>\n<p>    #[serde(rename = \"submitMessage\")]\n    SubmitMessage {\n        prompt: Value,\n        uuid: Option<String>,\n        #[serde(default)]\n        attachments: Option<Vec<Value>>,\n    },</p>\n<p>    #[serde(rename = \"permissionResponse\")]\n    PermissionResponse {\n        tool_use_id: String,\n        decision: String,\n        rule: Option<String>,\n    },</p>\n<p>    #[serde(rename = \"abort\")]\n    Abort,</p>\n<p>    #[serde(rename = \"listTools\")]\n    ListTools,</p>\n<p>    #[serde(rename = \"listMcpServers\")]\n    ListMcpServers,</p>\n<p>    #[serde(rename = \"compact\")]\n    Compact,</p>\n<p>    #[serde(rename = \"switchModel\")]\n    SwitchModel {\n        model: String,\n    },\n    \n    // ... 更多方法\n}\n</code>`<code></p>\n<p><strong>设计要点：</strong></p>\n<p>- 使用 </code>#[serde(tag = \"method\", content = \"params\")]<code> 实现方法名到参数类型的映射\n- 支持 </code>#[serde(default)]<code> 处理可选参数</p>\n<h3>示例 7: 事件层</h3>\n<p>引擎事件转换为 stream/event 通知。</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/ipc/events.rs\" lines=\"15-50\"\n/// 引擎事件 → stream/event 通知\npub fn engine_event_to_notification(event: &EngineEvent) -> JsonRpcNotification {\n    JsonRpcNotification::new(\n        \"stream/event\",\n        serde_json::to_value(event).unwrap_or(Value::Null),\n    )\n}</p>\n<p>/// 通知结构\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct JsonRpcNotification {\n    pub jsonrpc: String,\n    pub method: String,\n    pub params: Value,\n}</p>\n<p>impl JsonRpcNotification {\n    pub fn new(method: &str, params: Value) -> Self {\n        Self {\n            jsonrpc: \"2.0\".to_string(),\n            method: method.to_string(),\n            params,\n        }\n    }\n}\n</code>`<code></p>\n<p><strong>流事件类型：</strong></p>\n<p>| 事件类型 | 说明 | 参数 |\n|---------|------|------|\n| </code>TurnStart<code> | 回合开始 | </code>turn_id<code> |\n| </code>AssistantChunk<code> | AI 输出文本块 | </code>content<code>, </code>tool_use_id<code> |\n| </code>ThinkingChunk<code> | 思考过程块 | </code>content<code> |\n| </code>ToolUse<code> | 工具调用 | </code>tool_name<code>, </code>input<code>, </code>tool_use_id<code> |\n| </code>ToolResult<code> | 工具结果 | </code>tool_use_id<code>, </code>output<code>, </code>is_error<code> |\n| </code>PermissionRequest<code> | 权限请求 | </code>tool_name<code>, </code>input<code>, </code>message<code> |\n| </code>Result<code> | 查询完成 | </code>status<code>, </code>text<code> |\n| </code>Error<code> | 错误 | </code>message<code> |</p>\n<h3>示例 8: TypeScript IPC 客户端</h3>\n<p>TypeScript 客户端连接 Unix Domain Socket。</p>\n<p></code>`<code>typescript path=\"ts-ipc/client.ts\" lines=\"20-70\"\nexport class IpcClient {\n  private socket: net.Socket | null = null;\n  private buffer = '';\n  private nextId = 1;\n  private pendingRequests = new Map<number | string, {\n    resolve: (value: unknown) => void;\n    reject: (error: Error) => void;\n    timer: ReturnType<typeof setTimeout>;\n  }>();\n  private notificationHandlers = new Map<string, NotificationHandler[]>();</p>\n<p>  async connect(socketPath: string): Promise<void> {\n    return new Promise((resolve, reject) => {\n      this.socket = net.createConnection(socketPath, () => {\n        resolve();\n      });\n      \n      this.socket.on('data', (data) => {\n        this.buffer += data.toString();\n        this.processBuffer();\n      });\n      \n      this.socket.on('error', (err) => {\n        reject(new Error(</code>IPC connection error: ${err.message}<code>));\n      });\n      \n      this.socket.on('close', () => {\n        this.cleanup();\n      });\n    });\n  }</p>\n<p>  private processBuffer(): void {\n    const lines = this.buffer.split('\\n');\n    this.buffer = lines.pop() || '';  // Keep incomplete line in buffer\n    \n    for (const line of lines) {\n      if (line.trim()) {\n        this.handleMessage(JSON.parse(line));\n      }\n    }\n  }\n}\n</code>`<code></p>\n<p><strong>请求-响应机制：</strong></p>\n<p></code>`<code>typescript path=\"ts-ipc/client.ts\" lines=\"72-120\"\n  async request<T = unknown>(method: string, params?: unknown, timeout = 30000): Promise<T> {\n    return new Promise((resolve, reject) => {\n      if (!this.socket) {\n        reject(new Error('Not connected'));\n        return;\n      }\n      \n      const id = this.nextId++;\n      const request = {\n        jsonrpc: '2.0',\n        method,\n        params,\n        id,\n      };\n      \n      // Set timeout\n      const timer = setTimeout(() => {\n        this.pendingRequests.delete(id);\n        reject(new Error(</code>Request ${id} timed out<code>));\n      }, timeout);\n      \n      // Store pending request\n      this.pendingRequests.set(id, {\n        resolve: resolve as (value: unknown) => void,\n        reject,\n        timer,\n      });\n      \n      // Send request\n      this.socket.write(JSON.stringify(request) + '\\n');\n    });\n  }</p>\n<p>  onNotification(method: string, handler: NotificationHandler): () => void {\n    if (!this.notificationHandlers.has(method)) {\n      this.notificationHandlers.set(method, []);\n    }\n    this.notificationHandlers.get(method)!.push(handler);\n    \n    // Return unsubscribe function\n    return () => {\n      const handlers = this.notificationHandlers.get(method);\n      if (handlers) {\n        const index = handlers.indexOf(handler);\n        if (index >= 0) handlers.splice(index, 1);\n      }\n    };\n  }\n</code>`<code></p>\n<h3>示例 9: WhatsApp 网关核心组件</h3>\n<p>WhatsApp 网关展示完整的网关实现。</p>\n<p></code>`<code>typescript path=\"baoclaw-whatsapp/src/gateway.ts\" lines=\"45-100\"\nexport class Gateway {\n  private sessionManager: SessionManager;\n  private ipcClient: IpcClient;\n  private senderTracker: SenderTracker;\n  private permissionManager: PermissionManager;\n  private mediaHandler: MediaHandler;\n  private messageQueue: MessageQueue;</p>\n<p>  async start(): Promise<void> {\n    // 1. Initialize WhatsApp session\n    await this.sessionManager.connect();\n    \n    // 2. Discover and connect to daemon\n    const daemonInfo = await discoverDaemon(this.config.cwd);\n    await this.ipcClient.connect(daemonInfo.socket);\n    \n    // 3. Initialize IPC session\n    await this.ipcClient.request('initialize', {\n      cwd: this.config.cwd,\n      shared_session_id: this.config.sharedSessionId,\n    });\n    \n    // 4. Subscribe to stream events\n    this.ipcClient.onNotification('stream/event', (event) => {\n      this.handleStreamEvent(event);\n    });\n    \n    // 5. Start message processing loop\n    this.startProcessingLoop();\n  }</p>\n<p>  private async handleIncomingMessage(msg: Message): Promise<void> {\n    // 1. 去重检查\n    if (await this.isDuplicate(msg)) return;\n    \n    // 2. 允许列表检查\n    if (!this.isAllowed(msg.sender)) return;\n    \n    // 3. 速率限制\n    if (this.isRateLimited(msg.sender)) return;\n    \n    // 4. 命令解析\n    const text = this.parseCommand(msg.text);\n    if (!text) return;\n    \n    // 5. 消息入队\n    this.messageQueue.enqueue(msg.sender, text);\n  }\n}\n</code>`<code></p>\n<h3>示例 10: 消息队列实现</h3>\n<p>消息队列确保顺序处理。</p>\n<p></code>`<code>typescript path=\"baoclaw-whatsapp/src/messageQueue.ts\" lines=\"10-50\"\nexport class MessageQueue {\n  private queues = new Map<string, string[]>();\n  private processing = new Set<string>();\n  private maxSize: number;</p>\n<p>  constructor(maxSize = 10) {\n    this.maxSize = maxSize;\n  }</p>\n<p>  enqueue(sender: string, text: string): boolean {\n    // Check if queue is full\n    const queue = this.queues.get(sender) || [];\n    if (queue.length >= this.maxSize) {\n      return false;  // Backpressure\n    }\n    \n    queue.push(text);\n    this.queues.set(sender, queue);\n    return true;\n  }</p>\n<p>  dequeue(sender: string): string | undefined {\n    const queue = this.queues.get(sender);\n    if (!queue || queue.length === 0) return undefined;\n    \n    return queue.shift();\n  }</p>\n<p>  isProcessing(sender: string): boolean {\n    return this.processing.has(sender);\n  }</p>\n<p>  setProcessing(sender: string, value: boolean): void {\n    if (value) {\n      this.processing.add(sender);\n    } else {\n      this.processing.delete(sender);\n    }\n  }\n}\n</code>`<code></p>\n<h3>示例 11: 发送者追踪</h3>\n<p>追踪发送者状态和响应累积。</p>\n<p></code>`<code>typescript path=\"baoclaw-whatsapp/src/senderTracker.ts\" lines=\"10-50\"\nexport class SenderTracker {\n  // 发送者 → JID 映射\n  private senderToJid = new Map<string, string>();\n  // 响应累积器\n  private accumulators = new Map<string, string>();</p>\n<p>  registerSender(phone: string, jid: string, isGroup: boolean): void {\n    this.senderToJid.set(phone, jid);\n  }</p>\n<p>  getJid(phone: string): string | null {\n    return this.senderToJid.get(phone) || null;\n  }</p>\n<p>  accumulate(phone: string, content: string): void {\n    const current = this.accumulators.get(phone) || '';\n    this.accumulators.set(phone, current + content);\n  }</p>\n<p>  getAccumulated(phone: string): string {\n    return this.accumulators.get(phone) || '';\n  }</p>\n<p>  clearAccumulator(phone: string): void {\n    this.accumulators.delete(phone);\n  }\n}\n</code>`<code></p>\n<h3>示例 12: 守护进程发现</h3>\n<p>发现运行中的守护进程。</p>\n<p></code>`<code>typescript path=\"ts-ipc/cli.ts\" lines=\"150-200\"\nfunction discoverDaemons(): DaemonInfo[] {\n  const dir = path.join(os.tmpdir(), 'baoclaw-sockets');\n  \n  if (!fs.existsSync(dir)) return [];\n  \n  const daemons: DaemonInfo[] = [];\n  \n  for (const file of fs.readdirSync(dir)) {\n    if (!file.endsWith('.json')) continue;\n    \n    try {\n      const content = fs.readFileSync(path.join(dir, file), 'utf-8');\n      const info: DaemonInfo = JSON.parse(content);\n      \n      // 检查进程存活\n      try {\n        process.kill(info.pid, 0);  // Signal 0 = check if process exists\n      } catch {\n        // Process dead, clean up\n        fs.unlinkSync(path.join(dir, file));\n        continue;\n      }\n      \n      // 检查 socket 文件存在\n      if (!fs.existsSync(info.socket)) {\n        fs.unlinkSync(path.join(dir, file));\n        continue;\n      }\n      \n      daemons.push(info);\n    } catch {\n      // Invalid JSON, skip\n    }\n  }\n  \n  // 按启动时间排序，最新的优先\n  daemons.sort((a, b) => \n    new Date(b.started_at).getTime() - new Date(a.started_at).getTime()\n  );\n  \n  return daemons;\n}\n</code>`<code></p>\n<h3>示例 13: 优雅关闭</h3>\n<p>所有网关实现统一的关闭流程。</p>\n<p></code>`<code>typescript path=\"baoclaw-whatsapp/src/gateway.ts\" lines=\"300-340\"\nexport class Gateway {\n  private shuttingDown = false;</p>\n<p>  async shutdown(signal: string): Promise<void> {\n    if (this.shuttingDown) return;\n    this.shuttingDown = true;\n    \n    console.log(</code>Shutting down (${signal})...<code>);\n    \n    // 1. 设置超时强制退出\n    const forceTimer = setTimeout(() => {\n      console.log('Force exit after timeout');\n      process.exit(1);\n    }, 10000);\n    \n    try {\n      // 2. 保存会话状态\n      await this.sessionManager.disconnect();\n      \n      // 3. 关闭 IPC 连接\n      await this.ipcClient.disconnect();\n      \n      // 4. 清理 PID 文件\n      this.removePidFile();\n      \n      console.log('Shutdown complete');\n    } catch (err) {\n      console.error('Shutdown error:', err);\n    } finally {\n      clearTimeout(forceTimer);\n      process.exit(0);\n    }\n  }\n}</p>\n<p>// 注册信号处理\nprocess.on('SIGTERM', () => gateway.shutdown('SIGTERM'));\nprocess.on('SIGINT', () => gateway.shutdown('SIGINT'));\n</code>`<code></p>\n<h3>常见错误示例</h3>\n<p>#### 错误示例 1：未设置 socket 权限</p>\n<p></code>`<code>rust\n// ❌ 错误：默认权限允许其他用户连接\nlet listener = UnixListener::bind(&socket_path)?;\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：设置 0600 权限\nlet listener = UnixListener::bind(&socket_path)?;\nstd::fs::set_permissions(&socket_path, std::fs::Permissions::from_mode(0o600))?;\n</code>`<code></p>\n<p>#### 错误示例 2：未处理消息边界</p>\n<p></code>`<code>typescript\n// ❌ 错误：假设一次读取就是一条完整消息\nsocket.on('data', (data) => {\n  const msg = JSON.parse(data.toString());  // 可能不完整或包含多条\n});\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>typescript\n// ✅ 正确：使用 NDJSON 帧格式\nsocket.on('data', (data) => {\n  this.buffer += data.toString();\n  const lines = this.buffer.split('\\n');\n  this.buffer = lines.pop() || '';\n  for (const line of lines) {\n    if (line.trim()) {\n      this.handleMessage(JSON.parse(line));\n    }\n  }\n});\n</code>`<code></p>\n<p>#### 错误示例 3：未处理进程意外终止</p>\n<p></code>`<code>typescript\n// ❌ 错误：假设守护进程总是运行\nawait ipcClient.request('initialize', params);\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>typescript\n// ✅ 正确：检查守护进程状态\ntry {\n  await ipcClient.request('initialize', params);\n} catch (err) {\n  if (err.code === 'ECONNREFUSED') {\n    // 守护进程已终止，尝试重启\n    await startDaemon();\n    await ipcClient.connect(socketPath);\n    await ipcClient.request('initialize', params);\n  } else {\n    throw err;\n  }\n}\n</code>`<code></p>\n<p>#### 错误示例 4：消息队列无背压控制</p>\n<p></code>`<code>typescript\n// ❌ 错误：无限队列可能导致内存溢出\nqueue.push(message);\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>typescript\n// ✅ 正确：限制队列大小\nif (queue.length >= this.maxSize) {\n  return false;  // 拒绝新消息，让客户端稍后重试\n}\nqueue.push(message);\nreturn true;\n</code>``</p>\n<p>---</p
