ased).\n    pub seq: u32,\n    /// Timestamp.\n    pub timestamp: String,\n}\n\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum StreamChunkType {\n    Started,    // 工具开始执行\n    Progress,   // 中间进度\n    Stdout,     // 标准输出\n    Stderr,     // 标准错误\n    Completed,  // 执行完成\n    Error,      // 执行失败\n    Heartbeat,  // 心跳保活\n}","sourcePath":"baoclaw-core/src/engine/streaming_executor.rs","lineRange":{"start":8,"end":26}}],"progress":76},{"id":"05-production-slide-12","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: streaming_executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/streaming_executor.rs</span><span class=\"code-lines\">lines 28-55</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Configuration for streaming execution.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct StreamingConfig {\n    /// Maximum chunks to buffer (backpressure).\n    pub buffer_size: usize,\n    /// Heartbeat interval in milliseconds (0 = disabled).\n    pub heartbeat_interval_ms: u64,\n    /// Maximum execution time in seconds.\n    pub timeout_secs: u64,\n    /// Whether to stream stdout.\n    pub stream_stdout: bool,\n    /// Whether to stream stderr.\n    pub stream_stderr: bool,\n    /// Maximum output size in bytes (truncates beyond this).\n    pub max_output_bytes: usize,\n}\n\nimpl Default for StreamingConfig {\n    fn default() -&gt; Self {\n        Self {\n            buffer_size: 256,\n            heartbeat_interval_ms: 5000,\n            timeout_secs: 300,\n            stream_stdout: true,\n            stream_stderr: true,\n            max_output_bytes: 1024 * 1024, // 1MB\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-8","language":"rust","code":"/// Configuration for streaming execution.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct StreamingConfig {\n    /// Maximum chunks to buffer (backpressure).\n    pub buffer_size: usize,\n    /// Heartbeat interval in milliseconds (0 = disabled).\n    pub heartbeat_interval_ms: u64,\n    /// Maximum execution time in seconds.\n    pub timeout_secs: u64,\n    /// Whether to stream stdout.\n    pub stream_stdout: bool,\n    /// Whether to stream stderr.\n    pub stream_stderr: bool,\n    /// Maximum output size in bytes (truncates beyond this).\n    pub max_output_bytes: usize,\n}\n\nimpl Default for StreamingConfig {\n    fn default() -> Self {\n        Self {\n            buffer_size: 256,\n            heartbeat_interval_ms: 5000,\n            timeout_secs: 300,\n            stream_stdout: true,\n            stream_stderr: true,\n            max_output_bytes: 1024 * 1024, // 1MB\n        }\n    }\n}","sourcePath":"baoclaw-core/src/engine/streaming_executor.rs","lineRange":{"start":28,"end":55}}],"progress":76},{"id":"05-production-slide-13","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: streaming_executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/streaming_executor.rs</span><span class=\"code-lines\">lines 101-163</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Write end of a streaming execution — used by tool implementations.\npub struct StreamWriter {\n    sender: mpsc::Sender&lt;StreamChunk&gt;,\n    execution_id: String,\n    seq_counter: u32,\n}\n\nimpl StreamWriter {\n    /// Send a started event.\n    pub async fn started(&amp;mut self, tool_name: &amp;str) { /* ... */ }\n\n    /// Send a progress update.\n    pub async fn progress(&amp;mut self, message: &amp;str) { /* ... */ }\n\n    /// Send stdout data.\n    pub async fn stdout(&amp;mut self, data: &amp;str) { /* ... */ }\n\n    /// Send stderr data.\n    pub async fn stderr(&amp;mut self, data: &amp;str) { /* ... */ }\n\n    /// Send completion event.\n    pub async fn completed(&amp;mut self) { /* ... */ }\n\n    /// Send error event.\n    pub async fn error(&amp;mut self, message: &amp;str) { /* ... */ }\n\n    /// Send heartbeat.\n    pub async fn heartbeat(&amp;mut self) { /* ... */ }\n}\n\n/// Handle for receiving streaming output from a tool execution.\npub struct StreamReader {\n    receiver: mpsc::Receiver&lt;StreamChunk&gt;,\n    execution_id: String,\n}\n\nimpl StreamReader {\n    /// Receive the next chunk, waiting if necessary.\n    pub async fn next(&amp;mut self) -&gt; Option&lt;StreamChunk&gt; {\n        self.receiver.recv().await\n    }\n\n    /// Collect all remaining chunks into a single result.\n    pub async fn collect(mut self) -&gt; StreamResult { /* ... */ }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-9","language":"rust","code":"/// Write end of a streaming execution — used by tool implementations.\npub struct StreamWriter {\n    sender: mpsc::Sender<StreamChunk>,\n    execution_id: String,\n    seq_counter: u32,\n}\n\nimpl StreamWriter {\n    /// Send a started event.\n    pub async fn started(&mut self, tool_name: &str) { /* ... */ }\n\n    /// Send a progress update.\n    pub async fn progress(&mut self, message: &str) { /* ... */ }\n\n    /// Send stdout data.\n    pub async fn stdout(&mut self, data: &str) { /* ... */ }\n\n    /// Send stderr data.\n    pub async fn stderr(&mut self, data: &str) { /* ... */ }\n\n    /// Send completion event.\n    pub async fn completed(&mut self) { /* ... */ }\n\n    /// Send error event.\n    pub async fn error(&mut self, message: &str) { /* ... */ }\n\n    /// Send heartbeat.\n    pub async fn heartbeat(&mut self) { /* ... */ }\n}\n\n/// Handle for receiving streaming output from a tool execution.\npub struct StreamReader {\n    receiver: mpsc::Receiver<StreamChunk>,\n    execution_id: String,\n}\n\nimpl StreamReader {\n    /// Receive the next chunk, waiting if necessary.\n    pub async fn next(&mut self) -> Option<StreamChunk> {\n        self.receiver.recv().await\n    }\n\n    /// Collect all remaining chunks into a single result.\n    pub async fn collect(mut self) -> StreamResult { /* ... */ }\n}","sourcePath":"baoclaw-core/src/engine/streaming_executor.rs","lineRange":{"start":101,"end":163}}],"progress":77},{"id":"05-production-slide-14","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: streaming_executor.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/streaming_executor.rs</span><span class=\"code-lines\">lines 91-99</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Creates a streaming execution pair (writer, reader).\npub fn create_stream_pair(execution_id: String) -&gt; (StreamWriter, StreamReader) {\n    let (tx, rx) = mpsc::channel(256);\n    let writer = StreamWriter {\n        sender: tx,\n        execution_id: execution_id.clone(),\n        seq_counter: 0,\n    };\n    let reader = StreamReader {\n        receiver: rx,\n        execution_id,\n    };\n    (writer, reader)\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-10","language":"rust","code":"/// Creates a streaming execution pair (writer, reader).\npub fn create_stream_pair(execution_id: String) -> (StreamWriter, StreamReader) {\n    let (tx, rx) = mpsc::channel(256);\n    let writer = StreamWriter {\n        sender: tx,\n        execution_id: execution_id.clone(),\n        seq_counter: 0,\n    };\n    let reader = StreamReader {\n        receiver: rx,\n        execution_id,\n    };\n    (writer, reader)\n}","sourcePath":"baoclaw-core/src/engine/streaming_executor.rs","lineRange":{"start":91,"end":99}}],"progress":77},{"id":"05-production-slide-15","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: gate.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/permissions/gate.rs</span><span class=\"code-lines\">lines 20-56</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// User&#39;s permission decision sent from CLI\n#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]\n#[serde(tag = &quot;type&quot;)]\npub enum PermissionDecision {\n    #[serde(rename = &quot;allow&quot;)]\n    Allow,\n    #[serde(rename = &quot;deny&quot;)]\n    Deny,\n    #[serde(rename = &quot;allow_always&quot;)]\n    AllowAlways {\n        #[serde(skip_serializing_if = &quot;Option::is_none&quot;)]\n        rule: Option&lt;String&gt;,\n    },\n}\n\n/// Permission decision channel — maintained in QueryEngine,\n/// used by ToolExecutor to wait for user responses.\n#[derive(Clone)]\npub struct PermissionGate {\n    pending: Arc&lt;RwLock&lt;HashMap&lt;String, oneshot::Sender&lt;PermissionDecision&gt;&gt;&gt;&gt;,\n}\n\nimpl PermissionGate {\n    /// Register a pending permission request, returns a receiver to await the decision.\n    pub fn request(&amp;self, tool_use_id: &amp;str) -&gt; oneshot::Receiver&lt;PermissionDecision&gt; {\n        let (tx, rx) = oneshot::channel();\n        self.pending\n            .write()\n            .unwrap()\n            .insert(tool_use_id.to_string(), tx);\n        rx\n    }\n\n    /// Submit a user&#39;s permission decision. Returns true if the decision was delivered.\n    pub fn respond(&amp;self, tool_use_id: &amp;str, decision: PermissionDecision) -&gt; bool {\n        if let Some(tx) = self.pending.write().unwrap().remove(tool_use_id) {\n            tx.send(decision).is_ok()\n        } else {\n            false\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-11","language":"rust","code":"/// User's permission decision sent from CLI\n#[derive(Clone, Debug, Serialize, Deserialize, PartialEq)]\n#[serde(tag = \"type\")]\npub enum PermissionDecision {\n    #[serde(rename = \"allow\")]\n    Allow,\n    #[serde(rename = \"deny\")]\n    Deny,\n    #[serde(rename = \"allow_always\")]\n    AllowAlways {\n        #[serde(skip_serializing_if = \"Option::is_none\")]\n        rule: Option<String>,\n    },\n}\n\n/// Permission decision channel — maintained in QueryEngine,\n/// used by ToolExecutor to wait for user responses.\n#[derive(Clone)]\npub struct PermissionGate {\n    pending: Arc<RwLock<HashMap<String, oneshot::Sender<PermissionDecision>>>>,\n}\n\nimpl PermissionGate {\n    /// Register a pending permission request, returns a receiver to await the decision.\n    pub fn request(&self, tool_use_id: &str) -> oneshot::Receiver<PermissionDecision> {\n        let (tx, rx) = oneshot::channel();\n        self.pending\n            .write()\n            .unwrap()\n            .insert(tool_use_id.to_string(), tx);\n        rx\n    }\n\n    /// Submit a user's permission decision. Returns true if the decision was delivered.\n    pub fn respond(&self, tool_use_id: &str, decision: PermissionDecision) -> bool {\n        if let Some(tx) = self.pending.write().unwrap().remove(tool_use_id) {\n            tx.send(decision).is_ok()\n        } else {\n            false\n        }\n    }\n}","sourcePath":"baoclaw-core/src/permissions/gate.rs","lineRange":{"start":20,"end":56}}],"progress":78},{"id":"05-production-slide-16","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: manager.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/permissions/manager.rs</span><span class=\"code-lines\">lines 15-35</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum PermissionMode {\n    Default,            // 默认：询问用户\n    Plan,               // 计划模式：只读工具自动允许\n    BypassPermissions,  // 绕过模式：所有工具自动允许\n    Auto,               // 自动模式\n}\n\n#[derive(Clone, Debug, PartialEq)]\npub enum PermissionResult {\n    Allow,\n    Ask { message: String },\n    Deny { message: String },\n}\n\npub struct PermissionManager {\n    context: RwLock&lt;ToolPermissionContext&gt;,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-12","language":"rust","code":"#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum PermissionMode {\n    Default,            // 默认：询问用户\n    Plan,               // 计划模式：只读工具自动允许\n    BypassPermissions,  // 绕过模式：所有工具自动允许\n    Auto,               // 自动模式\n}\n\n#[derive(Clone, Debug, PartialEq)]\npub enum PermissionResult {\n    Allow,\n    Ask { message: String },\n    Deny { message: String },\n}\n\npub struct PermissionManager {\n    context: RwLock<ToolPermissionContext>,\n}","sourcePath":"baoclaw-core/src/permissions/manager.rs","lineRange":{"start":15,"end":35}}],"progress":78},{"id":"05-production-slide-17","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: manager.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/permissions/manager.rs</span><span class=\"code-lines\">lines 117-165</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">impl PermissionManager {\n    /// Check permission for a tool invocation.\n    ///\n    /// Evaluation order:\n    /// 1. Deny rules (highest priority)\n    /// 2. Allow rules\n    /// 3. Ask rules\n    /// 4. Mode-specific defaults\n    /// 5. Default: Ask\n    pub fn check_permission(\n        &amp;self,\n        tool_name: &amp;str,\n        input_description: Option&lt;&amp;str&gt;,\n    ) -&gt; PermissionResult {\n        let ctx = self.context.read().unwrap();\n\n        // Step 1: Check deny rules first (highest priority)\n        if find_matching_rule_in_map(&amp;ctx.always_deny_rules, tool_name, input_description) {\n            return PermissionResult::Deny {\n                message: format!(&quot;Tool &#39;{}&#39; is denied by permission rules&quot;, tool_name),\n            };\n        }\n\n        // Step 2: In BypassPermissions mode, allow all non-denied tools\n        if ctx.mode == PermissionMode::BypassPermissions {\n            return PermissionResult::Allow;\n        }\n\n        // Step 3: Check allow rules\n        if find_matching_rule_in_map(&amp;ctx.always_allow_rules, tool_name, input_description) {\n            return PermissionResult::Allow;\n        }\n\n        // Step 4: Check ask rules\n        if find_matching_rule_in_map(&amp;ctx.always_ask_rules, tool_name, input_description) {\n            return PermissionResult::Ask {\n                message: format!(&quot;Tool &#39;{}&#39; requires permission (matched ask rule)&quot;, tool_name),\n            };\n        }\n\n        // Step 5: Plan mode - allow read-only tools, ask for others\n        if ctx.mode == PermissionMode::Plan {\n            if is_read_only_tool(tool_name) {\n                return PermissionResult::Allow;\n            }\n            return PermissionResult::Ask {\n                message: format!(&quot;Tool &#39;{}&#39; requires permission in Plan mode&quot;, tool_name),\n            };\n        }\n\n        // Step 6: Default - Ask\n        PermissionResult::Ask {\n            message: format!(&quot;Tool &#39;{}&#39; requires permission&quot;, tool_name),\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-13","language":"rust","code":"impl PermissionManager {\n    /// Check permission for a tool invocation.\n    ///\n    /// Evaluation order:\n    /// 1. Deny rules (highest priority)\n    /// 2. Allow rules\n    /// 3. Ask rules\n    /// 4. Mode-specific defaults\n    /// 5. Default: Ask\n    pub fn check_permission(\n        &self,\n        tool_name: &str,\n        input_description: Option<&str>,\n    ) -> PermissionResult {\n        let ctx = self.context.read().unwrap();\n\n        // Step 1: Check deny rules first (highest priority)\n        if find_matching_rule_in_map(&ctx.always_deny_rules, tool_name, input_description) {\n            return PermissionResult::Deny {\n                message: format!(\"Tool '{}' is denied by permission rules\", tool_name),\n            };\n        }\n\n        // Step 2: In BypassPermissions mode, allow all non-denied tools\n        if ctx.mode == PermissionMode::BypassPermissions {\n            return PermissionResult::Allow;\n        }\n\n        // Step 3: Check allow rules\n        if find_matching_rule_in_map(&ctx.always_allow_rules, tool_name, input_description) {\n            return PermissionResult::Allow;\n        }\n\n        // Step 4: Check ask rules\n        if find_matching_rule_in_map(&ctx.always_ask_rules, tool_name, input_description) {\n            return PermissionResult::Ask {\n                message: format!(\"Tool '{}' requires permission (matched ask rule)\", tool_name),\n            };\n        }\n\n        // Step 5: Plan mode - allow read-only tools, ask for others\n        if ctx.mode == PermissionMode::Plan {\n            if is_read_only_tool(tool_name) {\n                return PermissionResult::Allow;\n            }\n            return PermissionResult::Ask {\n                message: format!(\"Tool '{}' requires permission in Plan mode\", tool_name),\n            };\n        }\n\n        // Step 6: Default - Ask\n        PermissionResult::Ask {\n            message: format!(\"Tool '{}' requires permission\", tool_name),\n        }\n    }\n}","sourcePath":"baoclaw-core/src/permissions/manager.rs","lineRange":{"start":117,"end":165}}],"progress":79},{"id":"05-production-slide-18","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例: manager.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/permissions/manager.rs</span><span class=\"code-lines\">lines 43-78</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">/// Simple glob matching with `*` wildcard.\n/// `*` matches any sequence of characters (including empty).\nfn glob_matches(pattern: &amp;str, text: &amp;str) -&gt; bool {\n    let pattern_bytes = pattern.as_bytes();\n    let text_bytes = text.as_bytes();\n    let p_len = pattern_bytes.len();\n    let t_len = text_bytes.len();\n\n    // DP approach: dp[i][j] = pattern[0..i] matches text[0..j]\n    let mut dp = vec![vec![false; t_len + 1]; p_len + 1];\n    dp[0][0] = true;\n\n    // Handle leading *s\n    for i in 1..=p_len {\n        if pattern_bytes[i - 1] == b&#39;*&#39; {\n            dp[i][0] = dp[i - 1][0];\n        }\n    }\n\n    for i in 1..=p_len {\n        for j in 1..=t_len {\n            if pattern_bytes[i - 1] == b&#39;*&#39; {\n                // * matches zero chars (dp[i-1][j]) or one more char (dp[i][j-1])\n                dp[i][j] = dp[i - 1][j] || dp[i][j - 1];\n            } else if pattern_bytes[i - 1].to_ascii_lowercase()\n                == text_bytes[j - 1].to_ascii_lowercase()\n            {\n                dp[i][j] = dp[i - 1][j - 1];\n            }\n        }\n    }\n\n    dp[p_len][t_len]\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-14","language":"rust","code":"/// Simple glob matching with `*` wildcard.\n/// `*` matches any sequence of characters (including empty).\nfn glob_matches(pattern: &str, text: &str) -> bool {\n    let pattern_bytes = pattern.as_bytes();\n    let text_bytes = text.as_bytes();\n    let p_len = pattern_bytes.len();\n    let t_len = text_bytes.len();\n\n    // DP approach: dp[i][j] = pattern[0..i] matches text[0..j]\n    let mut dp = vec![vec![false; t_len + 1]; p_len + 1];\n    dp[0][0] = true;\n\n    // Handle leading *s\n    for i in 1..=p_len {\n        if pattern_bytes[i - 1] == b'*' {\n            dp[i][0] = dp[i - 1][0];\n        }\n    }\n\n    for i in 1..=p_len {\n        for j in 1..=t_len {\n            if pattern_bytes[i - 1] == b'*' {\n                // * matches zero chars (dp[i-1][j]) or one more char (dp[i][j-1])\n                dp[i][j] = dp[i - 1][j] || dp[i][j - 1];\n            } else if pattern_bytes[i - 1].to_ascii_lowercase()\n                == text_bytes[j - 1].to_ascii_lowercase()\n            {\n                dp[i][j] = dp[i - 1][j - 1];\n            }\n        }\n    }\n\n    dp[p_len][t_len]\n}","sourcePath":"baoclaw-core/src/permissions/manager.rs","lineRange":{"start":43,"end":78}}],"progress":79},{"id":"05-production-slide-19","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：直接执行工具，跳过权限检查\nasync fn execute(&amp;self, tool: ToolCall) -&gt; Result&lt;ToolResult&gt; {\n    tool.call(input, context, progress).await\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-15","language":"rust","code":"// ❌ 错误：直接执行工具，跳过权限检查\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    tool.call(input, context, progress).await\n}"}],"progress":80},{"id":"05-production-slide-20","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：先检查权限\nasync fn execute(&amp;self, tool: ToolCall) -&gt; Result&lt;ToolResult&gt; {\n    let permission = self.permission_manager.check_permission(\n        tool.name(),\n        Some(&amp;tool.input_description()),\n    );\n    \n    match permission {\n        PermissionResult::Deny { message } =&gt; {\n            return Err(ToolError::PermissionDenied(message));\n        }\n        PermissionResult::Ask { message } =&gt; {\n            // 发送权限请求，等待用户响应\n            let decision = self.permission_gate.request(&amp;tool.id).await?;\n            if matches!(decision, PermissionDecision::Deny) {\n                return Err(ToolError::PermissionDenied(&quot;User denied&quot;.into()));\n            }\n        }\n        PermissionResult::Allow =&gt; {}\n    }\n    \n    tool.call(input, context, progress).await\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-16","language":"rust","code":"// ✅ 正确：先检查权限\nasync fn execute(&self, tool: ToolCall) -> Result<ToolResult> {\n    let permission = self.permission_manager.check_permission(\n        tool.name(),\n        Some(&tool.input_description()),\n    );\n    \n    match permission {\n        PermissionResult::Deny { message } => {\n            return Err(ToolError::PermissionDenied(message));\n        }\n        PermissionResult::Ask { message } => {\n            // 发送权限请求，等待用户响应\n            let decision = self.permission_gate.request(&tool.id).await?;\n            if matches!(decision, PermissionDecision::Deny) {\n                return Err(ToolError::PermissionDenied(\"User denied\".into()));\n            }\n        }\n        PermissionResult::Allow => {}\n    }\n    \n    tool.call(input, context, progress).await\n}"}],"progress":80},{"id":"05-production-slide-21","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：长时间运行无心跳，客户端可能超时\nasync fn long_running_task(&amp;mut self, writer: &amp;mut StreamWriter) {\n    for i in 0..1000 {\n        // 执行耗时操作\n        self.process_item(i).await;\n        writer.progress(&amp;format!(&quot;处理中: {}/1000&quot;, i)).await;\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-17","language":"rust","code":"// ❌ 错误：长时间运行无心跳，客户端可能超时\nasync fn long_running_task(&mut self, writer: &mut StreamWriter) {\n    for i in 0..1000 {\n        // 执行耗时操作\n        self.process_item(i).await;\n        writer.progress(&format!(\"处理中: {}/1000\", i)).await;\n    }\n}"}],"progress":81},{"id":"05-production-slide-22","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：定期发送心跳\nasync fn long_running_task(&amp;mut self, writer: &amp;mut StreamWriter) {\n    let mut last_heartbeat = Instant::now();\n    \n    for i in 0..1000 {\n        self.process_item(i).await;\n        writer.progress(&amp;format!(&quot;处理中: {}/1000&quot;, i)).await;\n        \n        // 每 5 秒发送心跳\n        if last_heartbeat.elapsed() &gt; Duration::from_secs(5) {\n            writer.heartbeat().await;\n            last_heartbeat = Instant::now();\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-18","language":"rust","code":"// ✅ 正确：定期发送心跳\nasync fn long_running_task(&mut self, writer: &mut StreamWriter) {\n    let mut last_heartbeat = Instant::now();\n    \n    for i in 0..1000 {\n        self.process_item(i).await;\n        writer.progress(&format!(\"处理中: {}/1000\", i)).await;\n        \n        // 每 5 秒发送心跳\n        if last_heartbeat.elapsed() > Duration::from_secs(5) {\n            writer.heartbeat().await;\n            last_heartbeat = Instant::now();\n        }\n    }\n}"}],"progress":81},{"id":"05-production-slide-23","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ❌ 错误：认证错误不应该重试\nmatch error_type {\n    &quot;api_error&quot; =&gt; self.retry_with_backoff().await,\n    _ =&gt; self.report_fatal(error).await,\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-19","language":"rust","code":"// ❌ 错误：认证错误不应该重试\nmatch error_type {\n    \"api_error\" => self.retry_with_backoff().await,\n    _ => self.report_fatal(error).await,\n}"}],"progress":82},{"id":"05-production-slide-24","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">// ✅ 正确：使用 determine_recovery_strategy\nlet strategy = determine_recovery_strategy(error_type, error_message);\n\nmatch strategy {\n    RecoveryStrategy::Retry { max_attempts, initial_delay_ms } =&gt; {\n        self.retry_with_backoff(max_attempts, initial_delay_ms).await\n    }\n    RecoveryStrategy::Fatal(msg) =&gt; {\n        self.report_fatal(msg).await\n    }\n    // ... 其他策略\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-20","language":"rust","code":"// ✅ 正确：使用 determine_recovery_strategy\nlet strategy = determine_recovery_strategy(error_type, error_message);\n\nmatch strategy {\n    RecoveryStrategy::Retry { max_attempts, initial_delay_ms } => {\n        self.retry_with_backoff(max_attempts, initial_delay_ms).await\n    }\n    RecoveryStrategy::Fatal(msg) => {\n        self.report_fatal(msg).await\n    }\n    // ... 其他策略\n}"}],"progress":82},{"id":"05-production-slide-25","chapterId":"05-production","chapterTitle":"生产实践","title":"代码示例","content":"<pre class=\"code-block language-rust\"><code class=\"language-rust\">let (tx, rx) = mpsc::channel(256);</code></pre>\n","type":"code","codeBlocks":[{"id":"code-21","language":"rust","code":"let (tx, rx) = mpsc::channel(256);"}],"progress":83},{"id":"05-production-slide-26","chapterId":"05-production","chapterTitle":"生产实践","title":"思考","content":"<p><!-- Requirements: 5.4 讨论替代方案与权衡决策 --></p>\n<h3>替代方案</h3>\n<p>#### 方案 A: 简单重试（无策略区分）</p>\n<p>- <strong>优点</strong>: 实现简单\n- <strong>缺点</strong>: 可能对不可恢复错误无限重试，浪费资源\n- <strong>适用场景</strong>: 原型开发阶段</p>\n<p>#### 方案 B: 分类恢复策略 ✓</p>\n<p>- <strong>优点</strong>: 针对不同错误类型选择最优策略，资源高效\n- <strong>缺点</strong>: 需要预先定义错误类型和策略映射\n- <strong>适用场景</strong>: 生产环境（BaoClaw 选择）</p>\n<p>#### 方案 C: 机器学习预测恢复策略</p>\n<p>- <strong>优点</strong>: 自适应，可能发现更优策略\n- <strong>缺点</strong>: 复杂度高，需要训练数据，不可预测\n- <strong>适用场景</strong>: 大规模分布式系统</p>\n<h3>权衡决策</h3>\n<p>| 决策点 | 选择 | 原因 | 影响 |\n|--------|------|------|------|\n| 权限存储 | 内存 + 配置文件 | 平衡性能和持久化 | 重启后保留规则 |\n| Glob 实现 | 自定义 DP | 无额外依赖，足够简单 | 功能有限但够用 |\n| 流式传输 | mpsc channel | Tokio 原生支持，高效 | 需要管理背压 |\n| 心跳间隔 | 5 秒 | 平衡响应和开销 | 及时检测僵尸进程 |\n| 超时默认值 | 5 分钟 | 覆盖大部分工具 | 长任务需自定义 |</p>\n<h3>设计决策：为什么用 Channel 做流式传输？</h3>\n<p>``<code>rust\nlet (tx, rx) = mpsc::channel(256);\n</code>``</p>\n<p><strong>优点：</strong></p>\n<p>- <strong>解耦</strong>: 工具执行和结果消费分离\n- <strong>背压</strong>: buffer 满时发送方自动等待\n- <strong>取消安全</strong>: 接收方丢弃时发送方会感知\n- <strong>多消费者</strong>: 可通过 broadcast 扩展</p>\n<p><strong>缺点：</strong></p>\n<p>- 需要管理 channel 生命周期\n- 异步上下文才能使用</p>\n<p><strong>结论:</strong> 对于 Agent 场景，工具执行和客户端响应天然分离，channel 是最佳选择。</p>\n<h3>设计决策：权限规则的优先级</h3>\n<p>为什么 Deny > Allow > Ask？</p>\n<p>1. <strong>Deny 最高</strong>: 安全第一，明确拒绝的规则必须生效\n2. <strong>Allow 其次</strong>: 明确允许的工具应该快速通过\n3. <strong>Ask 最后</strong>: 不确定时询问用户，提供交互机会</p>\n<p>这种顺序确保：</p>\n<p>- 管理员可以通过 Deny 规则强制禁止危险操作\n- 用户可以通过 Allow 规则加速常用操作\n- 新工具默认询问，避免意外执行</p>\n<p>---</p>\n","type":"reflection","progress":84},{"id":"05-production-slide-27","chapterId":"05-production","chapterTitle":"生产实践","title":"总结","content":"<p><!-- Requirements: 5.5 提供要点总结与延伸阅读链接 --></p>\n<h3>核心要点</h3>\n<p>- <strong>错误恢复策略</strong>: 根据错误类型选择重试、同步、重启或致命处理\n- <strong>流式输出</strong>: 通过 mpsc channel 实时推送进度，支持心跳和超时\n- <strong>权限门控</strong>: Deny > Allow > Ask 的优先级顺序，支持 Glob 模式匹配\n- <strong>多层防护</strong>: 权限层 → 错误处理层 → 流式层的架构设计</p>\n<h3>关键概念回顾</h3>\n<p>1. <strong>RecoveryStrategy</strong>: 错误恢复策略枚举，区分可恢复和不可恢复错误\n2. <strong>StreamChunk</strong>: 流式输出数据块，包含类型、内容、序列号\n3. <strong>PermissionGate</strong>: 权限门控，管理待处理的权限请求\n4. <strong>PermissionManager</strong>: 权限管理器，实现规则评估和匹配</p>\n<h3>代码引用</h3>\n<p>| 概念 | 源文件 |\n|------|--------|\n| 错误恢复策略 | <a href=\"./../../../baoclaw-core/src/engine/error_handling.rs\">error_handling.rs</a> |\n| 流式执行器 | <a href=\"./../../../baoclaw-core/src/engine/streaming_executor.rs\">streaming_executor.rs</a> |\n| 权限门控 | <a href=\"./../../../baoclaw-core/src/permissions/gate.rs\">permissions/gate.rs</a> |\n| 权限管理器 | <a href=\"./../../../baoclaw-core/src/permissions/manager.rs\">permissions/manager.rs</a> |</p>\n<h3>延伸阅读</h3>\n<p>#### 相关章节</p>\n<p>- <a href=\"./../04-ipc-multiclient/\">上一章：IPC 与多客户端</a> - 了解守护进程和 IPC 架构\n- <a href=\"./../06-advanced-patterns/\">下一章：高级模式</a> - 探索沙箱执行和自我进化</p>\n<p>#### 外部资源</p>\n<p>- <a href=\"https://docs.rs/tokio/latest/tokio/sync/mpsc/index.html\">Tokio Channel 文档</a> - mpsc channel 详细说明\n- <a href=\"https://doc.rust-lang.org/book/ch09-00-error-handling.html\">Rust 错误处理最佳实践</a> - 错误处理指南\n- <a href=\"https://en.wikipedia.org/wiki/Glob_(programming\">Glob 模式匹配</a>) - Glob 语法参考\n</p>","type":"summary","progress":84},{"id":"06-advanced-patterns-slide-01","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"高级模式","content":"<div class=\"chapter-number\">Chapter 6</div>\n<h1>高级模式</h1>\n","type":"title","progress":85},{"id":"06-advanced-patterns-slide-02","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"问题","content":"<p><!-- Requirements: 5.1 描述该章节解决的实际工程问题 --></p>\n<p>当 Agent 进入生产环境后，我们面临以下高级挑战：</p>\n<h3>1. 工具执行的安全风险</h3>\n<p>Agent 执行的命令可能来自不可信来源（如用户输入、外部 API 响应）。直接在宿主机执行存在以下风险：</p>\n<p>- <strong>文件系统破坏</strong>：误删重要文件、写入敏感位置\n- <strong>权限泄露</strong>：访问不应该访问的私有数据\n- <strong>网络攻击</strong>：发起恶意请求、数据外泄\n- <strong>资源耗尽</strong>：无限循环、内存泄漏、CPU 占满</p>\n<p>``<code>\n传统执行：Agent → Shell → 宿主机内核 → 危险！\n安全执行：Agent → Sandbox → 隔离环境 → 受控\n</code>``</p>\n<h3>2. 缺乏自我改进能力</h3>\n<p>传统 Agent 每次交互都是独立的，无法从过去的经验中学习：</p>\n<p>- 重复解决相同类型的问题\n- 无法识别可复用的操作模式\n- 没有持续的技能积累机制\n- 难以适应用户偏好和工作流</p>\n<h3>3. 多模型协调的复杂性</h3>\n<p>单一模型可能无法满足所有场景需求：</p>\n<p>- 不同任务需要不同能力（速度 vs 质量）\n- 成本控制需要模型降级策略\n- 特定领域需要专门模型\n- 模型故障需要自动切换</p>\n<h3>问题背景</h3>\n<p>高级模式通过<strong>沙箱执行</strong>解决安全问题，通过<strong>自我进化引擎</strong>实现持续改进，通过<strong>模型降级策略</strong>保证可靠性。</p>\n<p>---</p>\n","type":"problem","progress":85},{"id":"06-advanced-patterns-slide-03","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"模式","content":"<p><!-- Requirements: 5.2 讲解通用的设计模式或架构范式 --></p>\n<h3>模式 1: 沙箱执行（Sandbox Execution）</h3>\n<p>沙箱执行模式将工具运行在隔离环境中，限制其对宿主系统的访问。</p>\n<p>#### 三层隔离架构</p>\n<p>| 层级 | 后端 | 隔离强度 | 适用场景 |\n|------|------|----------|----------|\n| 无沙箱 | None | 无 | 可信环境、本地开发 |\n| 轻量沙箱 | Bubblewrap | 进程级 | Linux 生产环境 |\n| 容器沙箱 | Docker | 系统级 | 高安全要求、多租户 |</p>\n<p>#### 沙箱配置要素</p>\n<p>``<code>mermaid\ngraph TD\n    A[SandboxConfig] --> B[backend: 后端类型]\n    A --> C[rw_mounts: 读写挂载]\n    A --> D[ro_mounts: 只读挂载]\n    A --> E[allow_network: 网络控制]\n    A --> F[resource_limits: 资源限制]\n    \n    B --> B1[None]\n    B --> B2[Bubblewrap]\n    B --> B3[Docker]\n    \n    F --> F1[memory_limit_mb]\n    F --> F2[cpu_time_limit_secs]\n</code>`<code></p>\n<p>#### 工作原理</p>\n<p></code>`<code>\n┌─────────────────────────────────────────────┐\n│                 Host System                  │\n│  ┌───────────────────────────────────────┐  │\n│  │            Sandbox Container           │  │\n│  │  ┌─────────────────────────────────┐  │  │\n│  │  │        Tool Execution           │  │  │\n│  │  │                                 │  │  │\n│  │  │  • 只读: /usr, /lib, /bin       │  │  │\n│  │  │  • 读写: /workspace (项目目录)   │  │  │\n│  │  │  • 隔离: 网络、进程、用户空间     │  │  │\n│  │  └─────────────────────────────────┘  │  │\n│  └───────────────────────────────────────┘  │\n└─────────────────────────────────────────────┘\n</code>`<code></p>\n<h3>模式 2: 自我进化引擎（Evolution Engine）</h3>\n<p>自我进化引擎从交互中学习，自动创建和改进技能。</p>\n<p>#### 学习循环</p>\n<p></code>`<code>mermaid\ngraph LR\n    A[交互轨迹] --> B[轨迹分析]\n    B --> C{复杂任务?}\n    C -->|是| D[提取技能候选]\n    D --> E[人工/自动审核]\n    E --> F[技能提升]\n    F --> G[技能库]\n    G --> H[下次复用]\n    C -->|否| I[记录统计]\n</code>`<code></p>\n<p>#### 核心数据结构</p>\n<p>| 结构 | 作用 | 存储位置 |\n|------|------|----------|\n| Trajectory | 记录完整交互轨迹 | trajectories.jsonl |\n| SessionSummary | 会话级统计摘要 | session_summaries.jsonl |\n| SkillCandidate | 待审核的技能候选 | candidates/*.json |\n| SkillStats | 技能使用统计 | skill_stats.json |</p>\n<p>#### 自改进周期（5 阶段）</p>\n<p>1. <strong>收集 (Collect)</strong>: 记录每次交互的轨迹数据\n2. <strong>评估 (Evaluate)</strong>: 分析技能使用效果和用户反馈\n3. <strong>改进 (Improve)</strong>: 生成改进建议\n4. <strong>验证 (Validate)</strong>: 检查技能完整性\n5. <strong>淘汰 (Retire)</strong>: 自动禁用效果差的技能</p>\n<h3>模式 3: 模型降级策略</h3>\n<p>当主模型不可用时，自动切换到备用模型。</p>\n<p></code>`<code>mermaid\nsequenceDiagram\n    participant E as Engine\n    participant M1 as 主模型\n    participant M2 as 备用模型1\n    participant M3 as 备用模型2\n    \n    E->>M1: API 调用\n    M1-->>E: 超时/错误\n    E->>E: 记录失败\n    E->>M2: API 调用\n    M2-->>E: 成功响应\n    E->>E: 更新模型偏好\n</code>``</p>\n<p>---</p>\n","type":"pattern","progress":86},{"id":"06-advanced-patterns-slide-04","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"实现","content":"<p><!-- Requirements: 5.3 提供 BaoClaw 的 Rust 代码示例 --></p>\n<h3>示例 1: SandboxBackend 枚举定义</h3>\n<p>SandboxBackend 定义了三种沙箱后端：</p>\n<p>``<code>rust path=\"baoclaw-core/src/engine/sandbox.rs\" lines=\"8-14\"\n/// Sandbox backend type.\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum SandboxBackend {\n    /// No sandbox — direct execution (for trusted environments).\n    None,\n    /// Bubblewrap (bwrap) — lightweight Linux namespace sandbox.\n    Bubblewrap,\n    /// Docker container isolation.\n    Docker { image: String },\n}\n</code>`<code></p>\n<p><strong>设计说明：</strong></p>\n<p>- </code>None<code>: 直接执行，适用于可信环境\n- </code>Bubblewrap<code>: Linux namespace 隔离，轻量高效\n- </code>Docker<code>: 完整容器隔离，安全性最高</p>\n<h3>示例 2: SandboxConfig 配置结构</h3>\n<p>SandboxConfig 封装了沙箱执行的所有配置选项：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/sandbox.rs\" lines=\"16-35\"\n/// Configuration for sandbox execution.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SandboxConfig {\n    /// Which backend to use.\n    pub backend: SandboxBackend,\n    /// Directories to mount read-write into the sandbox.\n    pub rw_mounts: Vec<String>,\n    /// Directories to mount read-only into the sandbox.\n    pub ro_mounts: Vec<String>,\n    /// Environment variables to pass through.\n    pub env_passthrough: Vec<String>,\n    /// Network access allowed.\n    pub allow_network: bool,\n    /// Memory limit in MB (0 = unlimited).\n    pub memory_limit_mb: u32,\n    /// CPU time limit in seconds (0 = unlimited).\n    pub cpu_time_limit_secs: u32,\n    /// Working directory inside sandbox.\n    pub workdir: Option<String>,\n}\n</code>`<code></p>\n<p><strong>配置解析：</strong></p>\n<p>| 字段 | 类型 | 默认值 | 说明 |\n|------|------|--------|------|\n| </code>backend<code> | enum | None | 沙箱后端类型 |\n| </code>rw_mounts<code> | Vec\\<String\\> | [] | 读写挂载目录 |\n| </code>ro_mounts<code> | Vec\\<String\\> | [] | 只读挂载目录 |\n| </code>allow_network<code> | bool | true | 是否允许网络 |\n| </code>memory_limit_mb<code> | u32 | 0 | 内存限制 (MB) |\n| </code>cpu_time_limit_secs<code> | u32 | 300 | CPU 时间限制 (秒) |</p>\n<h3>示例 3: 自动检测最佳后端</h3>\n<p></code>auto_detect()<code> 方法自动选择可用的沙箱后端：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/sandbox.rs\" lines=\"55-71\"\nimpl SandboxConfig {\n    /// Create config that auto-detects the best available backend.\n    pub fn auto_detect() -> Self {\n        let backend = if which_exists(\"bwrap\") {\n            SandboxBackend::Bubblewrap\n        } else if which_exists(\"docker\") {\n            SandboxBackend::Docker {\n                image: std::env::var(\"BAOCLAW_SANDBOX_IMAGE\")\n                    .unwrap_or_else(|_| \"baoclaw-sandbox:latest\".into()),\n            }\n        } else {\n            SandboxBackend::None\n        };\n        Self {\n            backend,\n            ..Self::default()\n        }\n    }\n}\n</code>`<code></p>\n<p><strong>检测优先级：</strong></p>\n<p>1. 优先使用 </code>bwrap<code>（Bubblewrap）— 轻量级，性能好\n2. 其次使用 </code>docker<code> — 更安全，需要预构建镜像\n3. 最后回退到 </code>None<code> — 无沙箱，仅限可信环境</p>\n<h3>示例 4: 构建 Bubblewrap 命令</h3>\n<p>Bubblewrap 使用 Linux namespace 实现轻量级隔离：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/sandbox.rs\" lines=\"95-145\"\nfn build_bwrap_args(&self, command: &str, cwd: &Path) -> Vec<String> {\n    let mut args = vec![\"bwrap\".to_string()];</p>\n<p>    // Bind host filesystem read-only by default\n    args.push(\"--ro-bind\".into());\n    args.push(\"/usr\".into());\n    args.push(\"/usr\".into());</p>\n<p>    args.push(\"--ro-bind\".into());\n    args.push(\"/lib\".into());\n    args.push(\"/lib\".into());</p>\n<p>    args.push(\"--ro-bind\".into());\n    args.push(\"/lib64\".into());\n    args.push(\"/lib64\".into());</p>\n<p>    args.push(\"--ro-bind\".into());\n    args.push(\"/bin\".into());\n    args.push(\"/bin\".into());</p>\n<p>    args.push(\"--proc\".into());\n    args.push(\"/proc\".into());</p>\n<p>    args.push(\"--dev\".into());\n    args.push(\"/dev\".into());</p>\n<p>    args.push(\"--tmpfs\".into());\n    args.push(\"/tmp\".into());</p>\n<p>    // RW mounts\n    for mount in &self.rw_mounts {\n        if Path::new(mount).exists() {\n            args.push(\"--bind\".into());\n            args.push(mount.clone());\n            args.push(mount.clone());\n        }\n    }\n    // ... 网络隔离、工作目录等\n}\n</code>`<code></p>\n<p><strong>Bubblewrap 隔离机制：</strong></p>\n<p>- </code>--ro-bind<code>: 只读绑定挂载，保护系统目录\n- </code>--bind<code>: 读写绑定，用于项目目录\n- </code>--proc/--dev<code>: 创建虚拟文件系统\n- </code>--tmpfs<code>: 临时文件系统，每次运行重置\n- </code>--unshare-net<code>: 禁用网络（可选）</p>\n<h3>示例 5: 构建 Docker 命令</h3>\n<p>Docker 提供完整的容器级隔离：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/sandbox.rs\" lines=\"162-220\"\nfn build_docker_args(&self, command: &str, cwd: &Path, image: &str) -> Vec<String> {\n    let mut args = vec![\"docker\".to_string(), \"run\".to_string()];</p>\n<p>    // Remove container after exit\n    args.push(\"--rm\".into());</p>\n<p>    // Run as current user to avoid permission issues with mounted volumes\n    #[cfg(unix)]\n    {\n        let uid = unsafe { libc::getuid() };\n        let gid = unsafe { libc::getgid() };\n        args.push(\"--user\".into());\n        args.push(format!(\"{}:{}\", uid, gid));\n    }</p>\n<p>    // Memory limit\n    if self.memory_limit_mb > 0 {\n        args.push(format!(\"--memory={}m\", self.memory_limit_mb));\n    }</p>\n<p>    // Network\n    if !self.allow_network {\n        args.push(\"--network=none\".into());\n    }</p>\n<p>    // Mount CWD\n    if let Some(cwd_str) = cwd.to_str() {\n        args.push(\"-v\".into());\n        args.push(format!(\"{}:{}\", cwd_str, cwd_str));\n    }\n    // ... 环境变量、工作目录等\n}\n</code>`<code></p>\n<p><strong>Docker 安全特性：</strong></p>\n<p>- </code>--rm<code>: 容器退出后自动删除\n- </code>--user<code>: 以宿主机用户身份运行，避免权限问题\n- </code>--memory<code>: 内存限制，防止资源耗尽\n- </code>--network=none<code>: 完全禁用网络</p>\n<h3>示例 6: 沙箱配置验证</h3>\n<p></code>validate()<code> 方法检查沙箱配置是否有效：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/sandbox.rs\" lines=\"260-283\"\n/// Validate the sandbox configuration and return a human-readable error if invalid.\n/// Returns None if everything is OK.\npub fn validate(&self) -> Option<String> {\n    match &self.backend {\n        SandboxBackend::None => None,\n        SandboxBackend::Bubblewrap => {\n            if !which_exists(\"bwrap\") {\n                Some(\"bwrap not found. Install bubblewrap: apt install bubblewrap\".into())\n            } else {\n                None\n            }\n        }\n        SandboxBackend::Docker { image } => {\n            if !which_exists(\"docker\") {\n                return Some(\"docker not found in PATH\".into());\n            }\n            if !docker_image_exists(image) {\n                Some(format!(\n                    \"Docker image '{}' not found. Build it with: docker build -t {} -f Dockerfile.sandbox .\",\n                    image, image\n                ))\n            } else {\n                None\n            }\n        }\n    }\n}\n</code>`<code></p>\n<h3>示例 7: EvolutionEngine 核心结构</h3>\n<p>EvolutionEngine 从交互中学习，创建和改进技能：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"15-40\"\n/// Structured summary of a completed session, extracted on session close.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SessionSummary {\n    pub session_id: String,\n    pub timestamp: String,\n    pub cwd: String,\n    pub model: String,\n    pub duration_secs: u64,\n    /// Number of user→assistant turns\n    pub turn_count: usize,\n    /// All user messages (truncated to 200 chars each)\n    pub user_topics: Vec<String>,\n    /// Tool usage frequency: (tool_name, count)\n    pub tool_usage: Vec<(String, u32)>,\n    /// Tools that returned errors: (tool_name, error_preview)\n    pub errors: Vec<(String, String)>,\n    /// Total token usage\n    pub total_input_tokens: u64,\n    pub total_output_tokens: u64,\n    pub total_cache_read: u64,\n    pub total_cost_usd: f64,\n    /// Skills that were loaded/used during this session\n    pub skills_used: Vec<String>,\n}\n</code>`<code></p>\n<h3>示例 8: 轨迹记录数据结构</h3>\n<p>Trajectory 记录完整的交互轨迹，用于技能提取和 RLHF 训练：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"53-90\"\n/// A recorded interaction trajectory for RLHF training data.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct Trajectory {\n    pub id: String,\n    pub timestamp: String,\n    pub cwd: String,\n    pub user_prompt: String,\n    pub assistant_actions: Vec<TrajectoryAction>,\n    pub outcome: TrajectoryOutcome,\n    pub tool_count: usize,\n    pub duration_ms: u64,\n    /// User signal: was this interaction successful? None = not rated.\n    pub user_rating: Option<TrajectoryRating>,\n}</p>\n<p>#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct TrajectoryAction {\n    pub tool_name: String,\n    pub input_summary: String,\n    pub output_summary: String,\n    pub is_error: bool,\n}</p>\n<p>#[derive(Clone, Debug, Serialize, Deserialize)]\npub enum TrajectoryOutcome {\n    /// Task completed normally (end_turn)\n    Completed { final_text_preview: String },\n    /// Task hit max turns\n    MaxTurns,\n    /// Task was aborted by user\n    Aborted,\n    /// Task errored\n    Error { code: String, message: String },\n}\n</code>`<code></p>\n<h3>示例 9: 技能自动提取</h3>\n<p>当任务复杂度超过阈值时，自动提取技能候选：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"200-240\"\n/// Record a completed interaction as a trajectory.\npub async fn record_trajectory(&self, trajectory: Trajectory) {\n    let dir = self.base_dir.lock().await;\n    // ... 持久化轨迹</p>\n<p>    // Increment task count\n    let mut count = self.task_count.lock().await;\n    *count += 1;</p>\n<p>    // Check if we should trigger skill creation\n    if trajectory.tool_count >= SKILL_CREATION_THRESHOLD {\n        if let TrajectoryOutcome::Completed { .. } = &trajectory.outcome {\n            let candidate = self.extract_skill_candidate(&trajectory);\n            self.save_skill_candidate(&*dir, &candidate).await;\n            eprintln!(\"Evolution: skill candidate '{}' extracted from trajectory {}\",\n                candidate.name, trajectory.id);\n        }\n    }</p>\n<p>    // Check if we should trigger self-evaluation\n    if <em>count % SELF_EVAL_INTERVAL == 0 && </em>count > 0 {\n        eprintln!(\"Evolution: self-evaluation triggered at task count {}\", *count);\n        // Write nudge file for system prompt builder\n    }\n}\n</code>`<code></p>\n<p><strong>技能提取条件：</strong></p>\n<p>- </code>SKILL_CREATION_THRESHOLD = 3<code>: 工具调用数 >= 3 视为复杂任务\n- 仅对成功完成的任务（</code>Completed<code>）提取\n- 自动生成描述和触发模式</p>\n<h3>示例 10: 技能候选提取逻辑</h3>\n<p>从成功轨迹中提取可复用的操作模式：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"250-275\"\n/// Extract a skill candidate from a successful trajectory.\nfn extract_skill_candidate(&self, trajectory: &Trajectory) -> SkillCandidate {\n    // Build a procedure description from the tool actions\n    let steps: Vec<String> = trajectory.assistant_actions.iter()\n        .filter(|a| !a.is_error)\n        .enumerate()\n        .map(|(i, a)| format!(\"{}. Use </code>{}<code>: {}\", i + 1, a.tool_name, a.input_summary))\n        .collect();</p>\n<p>    let procedure = steps.join(\"\\n\");</p>\n<p>    // Derive a name from the user prompt (first 50 chars, slugified)\n    let name_raw = trajectory.user_prompt.chars().take(50).collect::<String>();\n    let name = slugify(&name_raw);</p>\n<p>    SkillCandidate {\n        name,\n        description: format!(\"Auto-generated from: {}\", \n            trajectory.user_prompt.chars().take(100).collect::<String>()),\n        trigger_pattern: trajectory.user_prompt.chars().take(200).collect(),\n        procedure,\n        source_trajectory_id: trajectory.id.clone(),\n        created_at: chrono::Utc::now().to_rfc3339(),\n    }\n}\n</code>`<code></p>\n<h3>示例 11: 技能提升</h3>\n<p>将审核通过的技能候选转化为正式技能：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"285-305\"\n/// Promote a skill candidate to an actual skill file.\n/// Skills go to ~/.baoclaw/skills/ (personal, cross-project) by default.\npub async fn promote_skill(&self, _cwd: &Path, candidate_name: &str, \n                            skill_content: &str) -> Result<String, String> {\n    let home = std::env::var(\"HOME\").unwrap_or_else(|_| \"/tmp\".to_string());\n    let skills_dir = PathBuf::from(home).join(\".baoclaw\").join(\"skills\");\n    let _ = std::fs::create_dir_all(&skills_dir);</p>\n<p>    let skill_path = skills_dir.join(format!(\"{}.md\", candidate_name));\n    std::fs::write(&skill_path, skill_content)\n        .map_err(|e| format!(\"Failed to write skill: {}\", e))?;</p>\n<p>    // Remove the candidate file\n    let dir = self.base_dir.lock().await;\n    let candidate_path = dir.join(\"candidates\").join(format!(\"{}.json\", candidate_name));\n    let _ = std::fs::remove_file(&candidate_path);</p>\n<p>    eprintln!(\"Evolution: promoted skill '{}' to {}\", candidate_name, skill_path.display());\n    Ok(skill_path.to_string_lossy().to_string())\n}\n</code>`<code></p>\n<h3>示例 12: 会话关闭钩子</h3>\n<p>会话结束时自动生成摘要，为下次会话提供上下文：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"390-470\"\n/// Called when the last client disconnects from a shared session.\n/// Extracts a structured summary from the session transcript.\npub async fn on_session_close(\n    &self,\n    session_id: &str,\n    cwd: &str,\n    model: &str,\n    messages: &[crate::models::message::Message],\n    total_usage: &crate::models::message::Usage,\n    total_cost_usd: f64,\n    session_duration_secs: u64,\n) {\n    // Extract user topics, tool usage, errors, skills used\n    let mut user_topics: Vec<String> = Vec::new();\n    let mut tool_counts: HashMap<String, u32> = HashMap::new();\n    let mut errors: Vec<(String, String)> = Vec::new();\n    let mut skills_used: Vec<String> = Vec::new();</p>\n<p>    for msg in messages {\n        // Parse messages to extract structured data\n        match &msg.content {\n            MessageContent::User { message, .. } => {\n                // Extract user text topics\n                let text = extract_text_from_value(&message.content);\n                if !text.is_empty() {\n                    user_topics.push(text.chars().take(200).collect());\n                }\n            }\n            MessageContent::Assistant { message, .. } => {\n                for block in &message.content {\n                    if let ContentBlock::ToolUse { name, input, .. } = block {\n                        *tool_counts.entry(name.clone()).or_insert(0) += 1;\n                    }\n                }\n            }\n            _ => {}\n        }\n    }</p>\n<p>    // Build and persist SessionSummary\n    // Generate pending_review.json for next session\n}\n</code>`<code></p>\n<h3>示例 13: 自改进系统提示</h3>\n<p>EvolutionEngine 为下次会话生成反思提示：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"340-385\"\n/// Build a system prompt fragment for the evolution system.\npub async fn build_prompt_fragment(&self, _cwd: &Path) -> Option<String> {\n    let mut parts = Vec::new();</p>\n<p>    // Check for pending session review (from previous session's close hook)\n    if review exists {\n        parts.push(format!(\n            \"# 🔁 Last Session Review (Auto-Generated)\\n\\\n            The previous session </code>{}<code> had {} turns. Here's what happened:\\n\\\n            \\n\\\n            ## User Topics:\\n{}\\n\\\n            \\n\\\n            ## Tools Used:\\n{}\\n\\\n            \\n\\\n            <strong>Self-improvement nudge</strong>: Reflect on the above. Ask yourself:\\n\\\n            - Were there repetitive patterns that should become a skill?\\n\\\n            - Did any errors reveal a gap in your knowledge or approach?\\n\\\n            - Should any preferences or decisions be saved to long-term memory?\\n\",\n            session_id, turn_count, topics_str, tools_str,\n        ));\n    }</p>\n<p>    // List pending skill candidates\n    let candidates = self.list_candidates().await;\n    if !candidates.is_empty() {\n        parts.push(\"# Pending Skill Candidates\\n\\nThe following skill candidates were auto-extracted. Consider promoting the useful ones:\\n\".to_string());\n    }</p>\n<p>    if parts.is_empty() { None } else { Some(parts.join(\"\\n\")) }\n}\n</code>`<code></p>\n<h3>示例 14: 技能评估与分级</h3>\n<p>Phase 2 新增的技能自改进功能：</p>\n<p></code>`<code>rust path=\"baoclaw-core/src/engine/evolution.rs\" lines=\"127-160\"\n/// Grade assigned to a skill during evaluation.\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum SkillGrade {\n    Excellent,\n    Good,\n    NeedsImprovement,\n    Poor,\n    Critical,\n    InsufficientData,\n}</p>\n<p>/// Suggested action based on skill evaluation.\n#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]\npub enum SuggestedAction {\n    None,\n    MinorTweak,\n    Improve,\n    MajorRevision,\n    Retire,\n}</p>\n<p>/// Result of evaluating a skill's effectiveness.\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct SkillEvaluation {\n    pub skill_name: String,\n    pub score: f64,\n    pub grade: SkillGrade,\n    pub diagnostics: Vec<String>,\n    pub suggested_action: SuggestedAction,\n}\n</code>`<code></p>\n<h3>常见错误示例</h3>\n<p>#### 错误示例 1：沙箱配置过于宽松</p>\n<p></code>`<code>rust\n// ❌ 错误：允许网络访问且挂载敏感目录\nlet config = SandboxConfig {\n    backend: SandboxBackend::Bubblewrap,\n    rw_mounts: vec![\"/\".to_string()], // 挂载整个根目录\n    allow_network: true,\n    ..SandboxConfig::default()\n};\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：只挂载必要目录，禁用网络\nlet config = SandboxConfig {\n    backend: SandboxBackend::Bubblewrap,\n    rw_mounts: vec![\"/home/user/project\".to_string()],\n    allow_network: false, // 禁用网络\n    ..SandboxConfig::default()\n};\n</code>`<code></p>\n<p>#### 错误示例 2：未验证沙箱可用性</p>\n<p></code>`<code>rust\n// ❌ 错误：假设沙箱一定可用\nlet config = SandboxConfig::auto_detect();\nlet args = config.build_command_args(\"rm -rf /\", cwd);\n</code>`<code></p>\n<p><strong>修正方法：</strong></p>\n<p></code>`<code>rust\n// ✅ 正确：验证沙箱配置\nlet config = SandboxConfig::auto_detect();\nif let Some(err) = config.validate() {\n    eprintln!(\"Sandbox validation failed: {}\", err);\n    // 降级或终止\n}\nlet args = config.build_command_args(cmd, cwd);\n</code>``</p>\n<p>---</p>\n","type":"implementation","progress":86},{"id":"06-advanced-patterns-slide-05","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block language-other\"><code class=\"language-other\">传统执行：Agent → Shell → 宿主机内核 → 危险！\n安全执行：Agent → Sandbox → 隔离环境 → 受控</code></pre>\n","type":"code","codeBlocks":[{"id":"code-1","language":"other","code":"传统执行：Agent → Shell → 宿主机内核 → 危险！\n安全执行：Agent → Sandbox → 隔离环境 → 受控"}],"progress":87},{"id":"06-advanced-patterns-slide-06","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block language-mermaid\"><code class=\"language-mermaid\">graph TD\n    A[SandboxConfig] --&gt; B[backend: 后端类型]\n    A --&gt; C[rw_mounts: 读写挂载]\n    A --&gt; D[ro_mounts: 只读挂载]\n    A --&gt; E[allow_network: 网络控制]\n    A --&gt; F[resource_limits: 资源限制]\n    \n    B --&gt; B1[None]\n    B --&gt; B2[Bubblewrap]\n    B --&gt; B3[Docker]\n    \n    F --&gt; F1[memory_limit_mb]\n    F --&gt; F2[cpu_time_limit_secs]</code></pre>\n","type":"code","codeBlocks":[{"id":"code-2","language":"mermaid","code":"graph TD\n    A[SandboxConfig] --> B[backend: 后端类型]\n    A --> C[rw_mounts: 读写挂载]\n    A --> D[ro_mounts: 只读挂载]\n    A --> E[allow_network: 网络控制]\n    A --> F[resource_limits: 资源限制]\n    \n    B --> B1[None]\n    B --> B2[Bubblewrap]\n    B --> B3[Docker]\n    \n    F --> F1[memory_limit_mb]\n    F --> F2[cpu_time_limit_secs]"}],"progress":87},{"id":"06-advanced-patterns-slide-07","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例","content":"<pre class=\"code-block mited).\n    pub cpu_time_limit_secs: u32,\n    /// Working directory inside sandbox.\n    pub workdir: Option<String>,\n}","sourcePath":"baoclaw-core/src/engine/sandbox.rs","lineRange":{"start":16,"end":35}}],"progress":90},{"id":"06-advanced-patterns-slide-12","chapterId":"06-advanced-patterns","chapterTitle":"高级模式","title":"代码示例: sandbox.rs","content":"<div class=\"code-source\"><span class=\"code-path\">baoclaw-core/src/engine/sandbox.rs</span><span class=\"code-lines\">lines 55-71</span></div>\n<pre class=\"code-block language-rust\"><code class=\"language-rust\">impl SandboxConfig {\n    /// Create config that auto-detects the best available backend.\n    pub fn auto_detect() -&gt; Self {\n        let backend = if which_exists(&quot;bwrap&quot;) {\n            SandboxBackend::Bubblewrap\n        } else if which_exists(&quot;docker&quot;) {\n            SandboxBackend::Docker {\n                image: std::env::var(&quot;BAOCLAW_SANDBOX_IMAGE&quot;)\n                    .unwrap_or_else(|_| &quot;baoclaw-sandbox:latest&quot;.into()),\n            }\n        } else {\n            SandboxBackend::None\n        };\n        Self {\n            backend,\n            ..Self::default()\n        }\n    }\n}</code></pre>\n","type":"code","codeBlocks":[{"id":"code-8","language":"rust","code":"impl SandboxConfig {\n    /// Create config that auto-detects the best available backend.\n    pub fn auto_detect() -> Self {\n        let backend = if which_exists(\"bwrap\") {\n            SandboxBackend::Bubblewrap\n        } else if which_exists(\"docker\") {\n            SandboxBackend::Docker {\n                image: std::env::var(\"BAOCLAW_SANDBOX_IMAGE\")\n                    .unwrap_or_else(|_| \"baoclaw-sandbox:latest\".into()),\n            }\n        } else {\n            SandboxBackend::None\n        };\n        Self {\n            backend,\n            ..Self::default()\n        }\n    }\n}","sourcePath":"baoclaw-core/src/engine/sandbox.rs","lineRange":{"start":55,"end
